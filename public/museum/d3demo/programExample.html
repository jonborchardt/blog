      property="og:image"
      content="https://jonborchardt.github.io/blog/og/drag-the-timeline-refilter-the-page.png"
    />

    <link href="libs/nvd3/nv.d3.css" rel="stylesheet" />
    <link href="styles/programStyle.css" rel="stylesheet" />
    <link href="styles/baseStyle.css" rel="stylesheet" />

    <script src="libs/d3.v3.min.js"></script>

  <body>
    <h1>Example of CrossFilter technology reporting on Programs</h1>
    <hr class="clear" />

    <div id="nvd3-spend-over-tcpm">
      <svg></svg>
    </div>

    <div class="row">
      <div class="station">
        <svg id="nvd3-spend-by-station"></svg>
      </div>
      <div class="cpm_tcpm">
        <div class="cpm">
          <svg id="nvd3-spend-by-cpm"></svg>
        </div>
        <div class="tcpm">
          <svg id="nvd3-spend-by-tcpm"></svg>
        </div>
      </div>
      <div class="imps_timps">
        <div class="imps">
          <svg id="nvd3-spend-by-imps"></svg>
        </div>
        <div class="timps">
          <svg id="nvd3-spend-by-timps"></svg>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="dow">
        <svg id="nvd3-spend-by-dow"></svg>
      </div>
      <div class="daypart">
        <svg id="nvd3-spend-by-daypart"></svg>
      </div>
      <div class="duration">
        <svg id="nvd3-spend-by-duration"></svg>
      </div>
    </div>

    <div id="nvd3-tcpm">
      <b>CPA increases as Imps increase; however, tCPM (radius) is independent</b>
      <svg></svg>
    </div>

    <h3 class="clear">Top Programs to Buy</h3>
    <div id="programList"></div>
