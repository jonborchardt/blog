<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>MapHack (Soda War) — a 2014 hackathon demo</title>
	<meta
		name="description"
		content="A 2014 Adap.TV hackathon demo: a D3 choropleth of Coke vs. Pepsi TV ad spend animating across a day, preserved as-is."
	/>
	<meta name="robots" content="noindex, nofollow" />
	<meta
		property="og:image"
		content="https://jonborchardt.github.io/blog/og/drag-the-timeline-refilter-the-page.png"
	/>
	<link rel="stylesheet" href="app.css" type="text/css" />
	<link rel="stylesheet" href="libs/bootstrap.min.css" />

	<script src="../d3demo/libs/d3.v3.min.js"></script>
	<script src="../d3demo/libs/topojson.v1.min.js"></script>
	<script src="libs/jquery-2.1.1.min.js"></script>
	<script src="libs/bootstrap.min.js"></script>
	<script src="libs/moment-2.7.0.min.js"></script>
	<script src="app.js"></script>
</head>

<style>
	body {
		padding: 25px;
		max-width: 1005px;
	}

	.states {
		fill: rgb(233,229,220);
	}

	.states-boundary {
		fill: none;
		stroke: rgb(219,213,202);
	}

	svg {
		background: rgb(178,208,254);
	}
</style>
<body>
	<h3>Coke vs Pepsi TV ad spend for 24 hours (4/28/2014)</h3>
	<div class="span" id="sliderdiv">
		<button class="btn" id="stop">Play&nbsp;<i class="icon-play"></i></button>
		<span style="width:98px" id="date"></span>

		<div style="width:1000px"><input type="range" value="0" min="0" max="1439" step="1" id="slider"></div>
	</div>
	<div id="map"></div>
</body>
</html>
