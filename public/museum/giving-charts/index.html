<!doctype html>
<html lang="en" data-ng-app="app">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rewards Report — a 2015 peer-recognition dashboard</title>
    <meta
      name="description"
      content="The 2015 Adap.tv Rewards Report: the same AngularJS crossfilter dashboard as Fatal Encounters, pointed at a peer-recognition dataset. Names and messages are anonymized."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      property="og:image"
      content="https://jonborchardt.github.io/blog/og/google-charts-to-d3.png"
    />

    <!--
      Preserved-demo note on paths: every vendor file this app loads is byte-identical to the
      copy already shipped under ../fatal-encounters/ (the two apps are forks of one codebase),
      so they are referenced there rather than duplicated. The only two exceptions - adap-charts
      chartBase.js and filterRowChart.js, which genuinely differ between the forks - are vendored
      locally under vendor/adap-charts/.
    -->

    <!-- ========== Vendor Stylesheets ========== -->
    <link rel="stylesheet" href="../fatal-encounters/vendor/bootstrap/dist/css/bootstrap.css" />
    <link rel="stylesheet" href="../fatal-encounters/vendor/ng-grid/ng-grid.css" />
    <link rel="stylesheet" href="../fatal-encounters/vendor/angular-ui-grid/ui-grid.css" />
    <link rel="stylesheet" href="../fatal-encounters/vendor/angular-ui-select/dist/select.css" />
    <link rel="stylesheet" href="../fatal-encounters/vendor/dcjs/dc.css" />
    <link rel="stylesheet" href="../fatal-encounters/vendor/nvd3/nv.d3.css" />
    <link rel="stylesheet" href="../fatal-encounters/vendor/adap-charts/chartsBase.css" />

    <!-- ========== Core Stylesheets ========== -->
    <link rel="stylesheet" href="App/core/app.css" />

    <!-- ========== Common Stylesheets ========== -->
    <link rel="stylesheet" href="App/features/layout/layout.css" />
    <link rel="stylesheet" href="App/features/common/common.css" />
    <link rel="stylesheet" href="App/features/common/progressIndicator/progressIndicator.css" />

    <!-- ========== Feature Stylesheets ========== -->
    <link rel="stylesheet" href="App/features/rewardsReport/rewardsReport.css" />
  </head>
  <body role="document" data-ng-controller="layoutCtrl">
    <!-- ============ Primary NavBar ============= -->
    <div class="header-container" data-ng-include="'App/features/common/navbar.html'"></div>
    <!-- ========== Page content ========== -->
    <div class="container" role="main" data-ng-view></div>

    <!--
      Preserved-demo note: the three templates below are inlined as ng-template scripts
      (instead of separate .html files fetched via ng-include/templateUrl) purely so this
      static export has one fewer same-origin round trip per template; AngularJS reads
      script[type="text/ng-template"] into $templateCache keyed by its id, so behavior is
      byte-for-byte the same as the original ng-include/templateUrl fetch. Content unchanged
      from the original app except "#/" nav links -> "#" (this app has a single route, so
      both resolved to the same view anyway), width/height/alt added to the logo image, and
      a missing ";" on one &nbsp entity.
    -->
    <script type="text/ng-template" id="App/features/common/navbar.html">
      <div class="navbar navbar-inverse navbar-fixed-top" role="navigation">
          <div class="container-fluid">
              <div class="navbar-header">
                  <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target=".navbar-collapse">
                      <span class="sr-only">Toggle navigation</span>
                      <span class="icon-bar"></span>
                      <span class="icon-bar"></span>
                      <span class="icon-bar"></span>
                  </button>
                  <a class="navbar-brand" href="#">
                      <img src="App/core/resources/logo.png" width="194" height="40" alt="Adap.tv">
                  </a>
              </div>

              <div class="navbar-collapse collapse">
                  <ul class="nav navbar-nav">
                      <li><a class="active" href="#">Adap.tv Rewards Report</a></li>
                  </ul>
              </div>
          </div>
      </div>
    </script>

    <script
      type="text/ng-template"
      id="App/features/common/progressIndicator/progressIndicator.html"
    >
      <div id="progressOverlay" ng-switch="isLoading">
          <div ng-switch-when="true">
              <div class="dark-overlay"></div>
              <div ng-switch="showPercentageBar">
                  <div class="radial-progress" data-progress="{{ percentageLoaded }}" ng-switch-when="true">
                      <div class="circle">
                          <div class="mask full">
                              <div class="fill"></div>
                          </div>
                          <div class="mask half">
                              <div class="fill"></div>
                              <div class="fill fix"></div>
                          </div>
                          <div class="shadow"></div>
                      </div>
                      <div class="inset">
                          <div class="percentage">{{ percentageLoaded + "%" }}</div>
                      </div>
                  </div>
                  <div ng-switch-when="false">
                      <div class="animated-spinner">
                          <h4 class="spinner-text">Loading...</h4>
                          <div class="spinner">
                              <div class="bounce1"></div>
                              <div class="bounce2"></div>
                              <div class="bounce3"></div>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
      </div>
    </script>

    <script type="text/ng-template" id="App/features/rewardsReport/rewardsReportView.html">
      <div class="container">

          <div id="wrapper">
              <div id="leftFilterArea">
                  <generic-chart rows="vm.rewardsReportCharts.leftChartRows"></generic-chart>
              </div>
              <div id="mainArea">
                  <div>
                      <div class="page-header col-md-9">
                          <h2>Adap.tv Rewards Report</h2>
                          <h4>Who is rewarding who, when, how much, and why.</h4>
                      </div>
                      <div class="row">
                          <div class="col-md-12">
                              <generic-chart rows="vm.rewardsReportCharts.mainChartRows"></generic-chart>

                              <h4>Reward Chord diagram</h4>
                              <div id="chord"></div>

                              <div class="custom-csv-link-location" ng-show="vm.showDownloadCsv">
                                  <!-- TODO: possibly wrap this in a modal or find a way for auto download -->
                                  <label>Your CSV download link:</label>
                                  <span class="ui-grid-exporter-csv-link">&nbsp;</span>
                              </div>
                              <div class="gridStyle"
                                   ui-grid="vm.gridOptions"
                                   ui-grid-exporter>
                              </div>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
      </div>
    </script>

    <!-- ========== Vendor scripts ========== -->
    <script src="../fatal-encounters/vendor/jquery/dist/jquery.js"></script>
    <script src="../fatal-encounters/vendor/angular/angular.js"></script>
    <script src="../fatal-encounters/vendor/angular-route/angular-route.js"></script>
    <script src="../fatal-encounters/vendor/angular-resource/angular-resource.js"></script>
    <script src="../fatal-encounters/vendor/angular-sanitize/angular-sanitize.js"></script>
    <script src="../fatal-encounters/vendor/angular-strap/dist/angular-strap.js"></script>
    <script src="../fatal-encounters/vendor/angular-strap/dist/angular-strap.tpl.js"></script>
    <script src="../fatal-encounters/vendor/ng-grid/build/ng-grid.js"></script>
    <script src="../fatal-encounters/vendor/angular-ui-grid/ui-grid.js"></script>
    <script src="../fatal-encounters/vendor/angular-ui-router/release/angular-ui-router.js"></script>
    <script src="../fatal-encounters/vendor/momentjs/moment.js"></script>
    <script src="../fatal-encounters/vendor/angular-ui-select/dist/select.js"></script>
    <script src="../fatal-encounters/vendor/lodash/dist/lodash.js"></script>
    <script src="../fatal-encounters/vendor/d3/d3.js"></script>
    <script src="../fatal-encounters/vendor/crossfilter/crossfilter.js"></script>
    <script src="../fatal-encounters/vendor/dcjs/dc.js"></script>
    <script src="../fatal-encounters/vendor/angular-dc/dist/angular-dc.js"></script>
    <script src="../fatal-encounters/vendor/nvd3/nv.d3.js"></script>
    <script src="../fatal-encounters/vendor/angular-nvd3/dist/angular-nvd3.js"></script>
    <script src="../fatal-encounters/vendor/angular-local-storage/dist/angular-local-storage.js"></script>
    <script src="../fatal-encounters/vendor/adap-charts/NVD3Interfaces.js"></script>
    <script src="../fatal-encounters/vendor/adap-charts/chartsUtil.js"></script>
    <script src="vendor/adap-charts/chartBase.js"></script>
    <script src="../fatal-encounters/vendor/adap-charts/filterBarChart.js"></script>
    <script src="../fatal-encounters/vendor/adap-charts/filterLineChart.js"></script>
    <script src="vendor/adap-charts/filterRowChart.js"></script>
    <script src="../fatal-encounters/vendor/adap-charts/filterPieChart.js"></script>
    <script src="../fatal-encounters/vendor/adap-charts/filterGeoChoroplethChart.js"></script>
    <script src="../fatal-encounters/vendor/adap-charts/multiBarChart.js"></script>
    <script src="../fatal-encounters/vendor/adap-charts/pieChart.js"></script>
    <script src="../fatal-encounters/vendor/adap-charts/lineChart.js"></script>
    <script src="../fatal-encounters/vendor/adap-charts/simpleScalarChart.js"></script>
    <script src="../fatal-encounters/vendor/adap-charts/chartDirective.js"></script>

    <!-- ========== App scripts ========== -->
    <script src="App/core/app.js"></script>
    <script src="App/core/config.js"></script>

    <!-- ========== Common feature scripts ========== -->
    <script src="App/features/common/progressIndicator/progressIndicator.js"></script>

    <!-- ========== Core scripts ========== -->
    <script src="App/core/models/RewardsLoader.js"></script>
    <script src="App/core/models/RewardsKeyMetrics.js"></script>
    <script src="App/core/services/dataAccess.js"></script>
    <script src="App/core/services/userData.js"></script>

    <!-- ========== Feature scripts ========== -->
    <script src="App/features/layout/layoutCtrl.js"></script>
    <script src="App/features/rewardsReport/rewardsReportCharts.js"></script>
    <script src="App/features/rewardsReport/rewardsReportCtrl.js"></script>
  </body>
</html>
