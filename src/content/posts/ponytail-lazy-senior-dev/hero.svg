<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>A seven-rung ladder where each of the top six rungs branches off to a stop marker, and only the bottom rung leads to a small block of code, surrounded by faint outlines of code that was never written</title>
  <defs>
    <g id="stop">
      <line x1="0" y1="0" x2="130" y2="0" stroke="#006a90" stroke-width="6" stroke-linecap="round"/>
      <path d="M130 -14 L152 0 L130 14 z" fill="#006a90"/>
      <circle cx="188" cy="0" r="22" fill="#deeef5" stroke="#006a90" stroke-width="6"/>
      <line x1="176" y1="0" x2="200" y2="0" stroke="#006a90" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g id="ghost">
      <rect x="0" y="0" width="150" height="100" rx="10" fill="none" stroke="#d9dfe3" stroke-width="4"/>
      <g stroke="#deeef5" stroke-width="8" stroke-linecap="round">
        <line x1="22" y1="28" x2="90" y2="28"/>
        <line x1="40" y1="52" x2="128" y2="52"/>
        <line x1="40" y1="76" x2="102" y2="76"/>
      </g>
    </g>
  </defs>
  <rect width="1500" height="600" fill="#fafcfe"/>

  <!-- flanks: ghost outlines of code never written (non-essential continuation) -->
  <use href="#ghost" x="60" y="70"/>
  <use href="#ghost" x="110" y="240"/>
  <use href="#ghost" x="50" y="410"/>
  <use href="#ghost" x="1280" y="90"/>
  <use href="#ghost" x="1240" y="260"/>
  <use href="#ghost" x="1300" y="430"/>

  <!-- ladder rails -->
  <g stroke="#11171d" stroke-width="14" stroke-linecap="round">
    <line x1="570" y1="40" x2="570" y2="515"/>
    <line x1="710" y1="40" x2="710" y2="515"/>
  </g>
  <!-- rungs 1-6 (exits) -->
  <g stroke="#11171d" stroke-width="10" stroke-linecap="round">
    <line x1="570" y1="75" x2="710" y2="75"/>
    <line x1="570" y1="143" x2="710" y2="143"/>
    <line x1="570" y1="211" x2="710" y2="211"/>
    <line x1="570" y1="279" x2="710" y2="279"/>
    <line x1="570" y1="347" x2="710" y2="347"/>
    <line x1="570" y1="415" x2="710" y2="415"/>
  </g>
  <!-- rung 7 -->
  <line x1="570" y1="483" x2="710" y2="483" stroke="#f0b35a" stroke-width="12" stroke-linecap="round"/>

  <!-- exits off each rung -->
  <use href="#stop" x="730" y="75"/>
  <use href="#stop" x="730" y="143"/>
  <use href="#stop" x="730" y="211"/>
  <use href="#stop" x="730" y="279"/>
  <use href="#stop" x="730" y="347"/>
  <use href="#stop" x="730" y="415"/>

  <!-- rung labels, left of the ladder -->
  <g font-family="IBM Plex Sans" font-size="26" fill="#555f69" text-anchor="end">
    <text x="540" y="84">needed?</text>
    <text x="540" y="152">in the codebase?</text>
    <text x="540" y="220">stdlib?</text>
    <text x="540" y="288">platform?</text>
    <text x="540" y="356">installed dep?</text>
    <text x="540" y="424">one line?</text>
  </g>

  <!-- rung 7 leads to a small block of code -->
  <line x1="730" y1="483" x2="900" y2="483" stroke="#f0b35a" stroke-width="6" stroke-linecap="round"/>
  <path d="M900 469 L922 483 L900 497 z" fill="#f0b35a"/>
  <g transform="translate(935 438)">
    <rect x="0" y="0" width="140" height="90" rx="10" fill="#fafcfe" stroke="#11171d" stroke-width="5"/>
    <g stroke="#f0b35a" stroke-width="8" stroke-linecap="round">
      <line x1="20" y1="26" x2="84" y2="26"/>
      <line x1="38" y1="46" x2="120" y2="46"/>
      <line x1="38" y1="66" x2="94" y2="66"/>
    </g>
  </g>
  <text x="1005" y="567" font-family="IBM Plex Sans" font-size="26" fill="#555f69" text-anchor="middle">minimum code</text>
</svg>
