<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="prv-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
  </defs>

  <!-- commit timeline of the merged PR -->
  <text x="40" y="34" fill="currentColor" font-weight="600">merged PR history</text>
  <line x1="40" y1="80" x2="600" y2="80" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="90" cy="80" r="5" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="160" cy="80" r="5" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="230" cy="80" r="5" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="300" cy="80" r="5" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="500" cy="80" r="5" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="570" cy="80" r="5" fill="currentColor" fill-opacity="0.35"/>

  <!-- issue N commit and the step back -->
  <circle cx="430" cy="80" r="7" fill="#f0b35a"/>
  <text x="430" y="60" fill="currentColor" fill-opacity="0.85" text-anchor="middle" font-size="12">issue N: commit c</text>
  <path d="M424 46 Q392 24 364 44" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#prv-fg)"/>
  <circle cx="360" cy="80" r="8" fill="#deeef5" stroke="#006a90" stroke-width="2"/>
  <text x="360" y="108" fill="currentColor" text-anchor="middle" font-weight="600" font-size="12">checkout c − 1</text>

  <!-- three lenses examine the same snapshot, cold -->
  <line x1="150" y1="186" x2="352" y2="90" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <line x1="320" y1="182" x2="358" y2="92" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <line x1="490" y1="186" x2="368" y2="90" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>

  <circle cx="140" cy="212" r="28" fill="#deeef5" fill-opacity="0.6" stroke="#006a90" stroke-width="2.5"/>
  <line x1="160" y1="232" x2="176" y2="248" stroke="#006a90" stroke-width="5" stroke-linecap="round"/>
  <text x="140" y="278" fill="currentColor" text-anchor="middle" font-weight="600">Ponytail</text>

  <circle cx="320" cy="212" r="28" fill="#deeef5" fill-opacity="0.6" stroke="#006a90" stroke-width="2.5"/>
  <line x1="340" y1="232" x2="356" y2="248" stroke="#006a90" stroke-width="5" stroke-linecap="round"/>
  <text x="320" y="278" fill="currentColor" text-anchor="middle" font-weight="600">Superpowers</text>

  <circle cx="500" cy="212" r="28" fill="#deeef5" fill-opacity="0.6" stroke="#006a90" stroke-width="2.5"/>
  <line x1="520" y1="232" x2="536" y2="248" stroke="#006a90" stroke-width="5" stroke-linecap="round"/>
  <text x="500" y="278" fill="currentColor" text-anchor="middle" font-weight="600">Generic AI</text>

  <text x="320" y="304" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">run cold on the same snapshot, same model — no hint of the finding</text>

  <!-- compare against what the record shows -->
  <line x1="320" y1="314" x2="320" y2="338" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#prv-fg)"/>
  <text x="320" y="360" fill="currentColor" text-anchor="middle" font-weight="600">compare with the record</text>

  <rect x="120" y="376" width="180" height="66" rx="5" fill="#fafcfe" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="134" y1="394" x2="286" y2="394" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="134" y1="408" x2="266" y2="408" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="134" y1="422" x2="278" y2="422" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <text x="210" y="462" fill="currentColor" fill-opacity="0.85" text-anchor="middle" font-size="12">what generic AI caught then</text>

  <rect x="340" y="376" width="180" height="66" rx="5" fill="#fafcfe" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="354" y1="394" x2="506" y2="394" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="354" y1="408" x2="486" y2="408" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="354" y1="422" x2="498" y2="422" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <text x="430" y="462" fill="currentColor" fill-opacity="0.85" text-anchor="middle" font-size="12">what humans caught then</text>
</svg>
