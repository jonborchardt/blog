<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="ladv-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
    <marker id="ladv-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0b35a"/></marker>
  </defs>

  <!-- rails -->
  <line x1="200" y1="40" x2="200" y2="540" stroke="#006a90" stroke-width="5" stroke-linecap="round"/>
  <line x1="280" y1="40" x2="280" y2="540" stroke="#006a90" stroke-width="5" stroke-linecap="round"/>

  <!-- rung 1 -->
  <line x1="200" y1="80" x2="280" y2="80" stroke="#006a90" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="200" cy="80" r="13" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="200" y="85" fill="#11171d" text-anchor="middle" font-size="12" font-weight="600">1</text>
  <text x="175" y="84" fill="currentColor" text-anchor="end" font-weight="600">needs to exist?</text>
  <path d="M287 82 Q340 88 378 92" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#ladv-fg)"/>
  <text x="332" y="76" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11">no</text>
  <text x="390" y="97" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">skip it, say so in one line</text>

  <!-- rung 2 -->
  <line x1="200" y1="152" x2="280" y2="152" stroke="#006a90" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="200" cy="152" r="13" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="200" y="157" fill="#11171d" text-anchor="middle" font-size="12" font-weight="600">2</text>
  <text x="175" y="156" fill="currentColor" text-anchor="end" font-weight="600">already in the codebase?</text>
  <path d="M287 154 Q340 160 378 164" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#ladv-fg)"/>
  <text x="332" y="148" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11">yes</text>
  <text x="390" y="169" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">reuse it</text>

  <!-- rung 3 -->
  <line x1="200" y1="224" x2="280" y2="224" stroke="#006a90" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="200" cy="224" r="13" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="200" y="229" fill="#11171d" text-anchor="middle" font-size="12" font-weight="600">3</text>
  <text x="175" y="228" fill="currentColor" text-anchor="end" font-weight="600">stdlib does it?</text>
  <path d="M287 226 Q340 232 378 236" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#ladv-fg)"/>
  <text x="332" y="220" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11">yes</text>
  <text x="390" y="241" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">use stdlib</text>

  <!-- rung 4 -->
  <line x1="200" y1="296" x2="280" y2="296" stroke="#006a90" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="200" cy="296" r="13" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="200" y="301" fill="#11171d" text-anchor="middle" font-size="12" font-weight="600">4</text>
  <text x="175" y="300" fill="currentColor" text-anchor="end" font-weight="600">platform does it natively?</text>
  <path d="M287 298 Q340 304 378 308" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#ladv-fg)"/>
  <text x="332" y="292" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11">yes</text>
  <text x="390" y="313" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">use the platform</text>

  <!-- rung 5 -->
  <line x1="200" y1="368" x2="280" y2="368" stroke="#006a90" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="200" cy="368" r="13" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="200" y="373" fill="#11171d" text-anchor="middle" font-size="12" font-weight="600">5</text>
  <text x="175" y="372" fill="currentColor" text-anchor="end" font-weight="600">installed dependency does it?</text>
  <path d="M287 370 Q340 376 378 380" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#ladv-fg)"/>
  <text x="332" y="364" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11">yes</text>
  <text x="390" y="385" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">use it</text>

  <!-- rung 6 -->
  <line x1="200" y1="440" x2="280" y2="440" stroke="#006a90" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="200" cy="440" r="13" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="200" y="445" fill="#11171d" text-anchor="middle" font-size="12" font-weight="600">6</text>
  <text x="175" y="444" fill="currentColor" text-anchor="end" font-weight="600">can it be one line?</text>
  <path d="M287 442 Q340 448 378 452" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#ladv-fg)"/>
  <text x="332" y="436" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11">yes</text>
  <text x="390" y="457" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">write the one line</text>

  <!-- rung 7 -->
  <line x1="200" y1="512" x2="280" y2="512" stroke="#006a90" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="200" cy="512" r="13" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="200" y="517" fill="#11171d" text-anchor="middle" font-size="12" font-weight="600">7</text>
  <text x="175" y="516" fill="currentColor" text-anchor="end" font-weight="600">nothing held —</text>

  <!-- code sheet at the foot of the ladder -->
  <path d="M240 540 L240 556" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#ladv-fg)"/>
  <rect x="180" y="560" width="120" height="52" rx="5" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <line x1="192" y1="574" x2="268" y2="574" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="192" y1="586" x2="288" y2="586" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="192" y1="598" x2="248" y2="598" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <text x="312" y="582" fill="currentColor" font-weight="600">minimum code that works</text>
  <path d="M300 604 Q330 622 356 626" fill="none" stroke="#f0b35a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ladv-hi)"/>
  <text x="366" y="631" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">ponytail: comment names the ceiling</text>
</svg>
