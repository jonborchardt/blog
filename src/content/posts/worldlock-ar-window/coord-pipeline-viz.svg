<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="cpv-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
    <marker id="cpv-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#006a90"/></marker>
    <marker id="cpv-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0b35a"/></marker>
  </defs>

  <!-- input from the pose and city list -->
  <text x="150" y="36" fill="currentColor" font-weight="600">lat / lon / alt from Geospatial pose and city list</text>
  <line x1="245" y1="44" x2="249" y2="84" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#cpv-fg)"/>

  <text x="26" y="64" fill="currentColor" font-weight="600" font-size="12">64-bit doubles</text>

  <!-- the Earth -->
  <circle cx="40" cy="400" r="300" fill="#deeef5" stroke="#006a90" stroke-width="2"/>
  <circle cx="40" cy="400" r="4" fill="#11171d"/>
  <text x="52" y="404" fill="#11171d" font-size="12">Earth centre</text>

  <!-- ECEF: centre to phone -->
  <line x1="58" y1="384" x2="238" y2="200" stroke="#006a90" stroke-width="2" marker-end="url(#cpv-b)"/>
  <text x="170" y="286" fill="#11171d" font-weight="600" font-size="12">ECEF — about</text>
  <text x="170" y="303" fill="#11171d" font-weight="600" font-size="12">6.4 million m</text>
  <text x="170" y="320" fill="#11171d" font-weight="600" font-size="12">from centre</text>

  <!-- phone on the surface, inside the render-origin bubble -->
  <rect x="238" y="146" width="26" height="46" rx="5" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <circle cx="251" cy="165" r="75" fill="none" stroke="#006a90" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="336" y="140" fill="currentColor" font-weight="600" font-size="12">ENU relative to the render origin</text>
  <text x="336" y="157" fill="currentColor" font-weight="600" font-size="12">— metres to a few thousand km</text>

  <!-- the one cast: doubles into the float screen -->
  <path d="M312 218 Q348 242 362 276" fill="none" stroke="#f0b35a" stroke-width="2" marker-end="url(#cpv-hi)"/>

  <!-- the phone screen, enlarged -->
  <rect x="352" y="280" width="268" height="180" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="486" cy="291" r="2.5" fill="currentColor" fill-opacity="0.4"/>
  <text x="368" y="302" fill="currentColor" font-weight="600" font-size="12">32-bit floats</text>
  <text x="486" y="330" fill="currentColor" text-anchor="middle" font-weight="600">GL vertices and uniforms</text>
  <text x="486" y="348" fill="currentColor" text-anchor="middle" font-weight="600">— the one cast</text>
  <line x1="486" y1="358" x2="486" y2="378" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#cpv-fg)"/>
  <rect x="426" y="382" width="120" height="44" rx="5" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <line x1="438" y1="396" x2="514" y2="396" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="438" y1="408" x2="534" y2="408" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="438" y1="418" x2="490" y2="418" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <text x="486" y="448" fill="currentColor" text-anchor="middle" font-weight="600" font-size="12">shaders</text>
</svg>
