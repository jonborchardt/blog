<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="system-ui, sans-serif" font-size="13">
  <!-- Left panel: tessellated sphere near the camera -->
  <text x="160" y="24" fill="currentColor" text-anchor="middle" font-weight="600">Sphere as a mesh</text>
  <g fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5">
    <polyline points="20,250 70,236 130,228 190,228 250,236 300,250"/>
    <polyline points="20,250 60,278 130,290 190,290 260,278 300,250"/>
    <line x1="70" y1="236" x2="60" y2="278"/><line x1="130" y1="228" x2="130" y2="290"/><line x1="190" y1="228" x2="190" y2="290"/><line x1="250" y1="236" x2="260" y2="278"/>
    <line x1="70" y1="236" x2="130" y2="290"/><line x1="130" y1="228" x2="190" y2="290"/><line x1="190" y1="228" x2="260" y2="278"/>
  </g>
  <!-- true curve for contrast, dashed -->
  <path d="M20 250 Q160 200 300 250" fill="none" stroke="#006a90" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- camera -->
  <g transform="translate(160 150)">
    <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#006a90"/>
    <circle cx="0" cy="0" r="4" fill="currentColor" fill-opacity="0.9"/>
  </g>
  <text x="160" y="130" fill="currentColor" text-anchor="middle">camera at the surface</text>
  <!-- jittering vertices -->
  <g fill="#f0b35a">
    <circle cx="130" cy="228" r="4"/><circle cx="190" cy="228" r="4"/><circle cx="130" cy="290" r="4"/>
  </g>
  <text x="160" y="80" fill="currentColor" fill-opacity="0.75" text-anchor="middle">6.4 million m from centre,</text>
  <text x="160" y="98" fill="currentColor" fill-opacity="0.75" text-anchor="middle">vertices land on a half-metre float grid</text>
  <text x="160" y="316" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">flat facets + jittering vertices</text>

  <line x1="320" y1="20" x2="320" y2="320" stroke="currentColor" stroke-opacity="0.2"/>

  <!-- Right panel: per-fragment ray-cast -->
  <text x="480" y="24" fill="currentColor" text-anchor="middle" font-weight="600">Sphere as a ray-cast</text>
  <path d="M340 250 Q480 200 620 250" fill="none" stroke="#006a90" stroke-width="3"/>
  <rect x="420" y="170" width="120" height="30" rx="2" fill="#006a90" fill-opacity="0.12" stroke="#006a90" stroke-width="1"/>
  <text x="546" y="189" fill="currentColor" font-size="12">fullscreen triangle</text>
  <g transform="translate(480 130)">
    <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#006a90"/>
    <circle cx="0" cy="0" r="4" fill="currentColor" fill-opacity="0.9"/>
  </g>
  <!-- one ray per fragment, through the fullscreen triangle, hitting the sphere -->
  <g stroke="currentColor" stroke-opacity="0.5" stroke-width="1">
    <line x1="480" y1="138" x2="360" y2="243"/>
    <line x1="480" y1="138" x2="420" y2="232"/>
    <line x1="480" y1="138" x2="480" y2="225"/>
    <line x1="480" y1="138" x2="540" y2="232"/>
    <line x1="480" y1="138" x2="600" y2="243"/>
  </g>
  <g fill="#006a90">
    <circle cx="360" cy="243" r="3.5"/><circle cx="420" cy="232" r="3.5"/><circle cx="480" cy="225" r="3.5"/><circle cx="540" cy="232" r="3.5"/><circle cx="600" cy="243" r="3.5"/>
  </g>
  <text x="480" y="80" fill="currentColor" fill-opacity="0.75" text-anchor="middle">every pixel solves the ray–sphere quadratic</text>
  <text x="480" y="98" fill="currentColor" fill-opacity="0.75" text-anchor="middle">in the fragment shader — analytic at any distance</text>
  <text x="480" y="316" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">no vertices, nothing to jitter</text>
</svg>
