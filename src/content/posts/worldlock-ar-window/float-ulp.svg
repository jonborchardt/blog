<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="system-ui, sans-serif" font-size="13">
  <!-- log-log axes: x = distance from origin 1 m .. 10^7 m (7 decades, 70 px each), y = float32 spacing 10^-7 .. 1 m -->
  <g stroke="currentColor" stroke-opacity="0.15" stroke-width="1">
    <line x1="80" y1="40" x2="80" y2="320"/><line x1="150" y1="40" x2="150" y2="320"/><line x1="220" y1="40" x2="220" y2="320"/><line x1="290" y1="40" x2="290" y2="320"/><line x1="360" y1="40" x2="360" y2="320"/><line x1="430" y1="40" x2="430" y2="320"/><line x1="500" y1="40" x2="500" y2="320"/><line x1="570" y1="40" x2="570" y2="320"/>
    <line x1="80" y1="40" x2="570" y2="40"/><line x1="80" y1="80" x2="570" y2="80"/><line x1="80" y1="120" x2="570" y2="120"/><line x1="80" y1="160" x2="570" y2="160"/><line x1="80" y1="200" x2="570" y2="200"/><line x1="80" y1="240" x2="570" y2="240"/><line x1="80" y1="280" x2="570" y2="280"/><line x1="80" y1="320" x2="570" y2="320"/>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <line x1="80" y1="320" x2="570" y2="320"/><line x1="80" y1="40" x2="80" y2="320"/>
  </g>
  <!-- y tick labels (metres) -->
  <g fill="currentColor" fill-opacity="0.75" text-anchor="end">
    <text x="72" y="324">0.1 µm</text><text x="72" y="284">1 µm</text><text x="72" y="244">10 µm</text><text x="72" y="204">0.1 mm</text><text x="72" y="164">1 mm</text><text x="72" y="124">1 cm</text><text x="72" y="84">10 cm</text><text x="72" y="44">1 m</text>
  </g>
  <!-- x tick labels -->
  <g fill="currentColor" fill-opacity="0.75" text-anchor="middle">
    <text x="80" y="340">1 m</text><text x="150" y="340">10 m</text><text x="220" y="340">100 m</text><text x="290" y="340">1 km</text><text x="360" y="340">10 km</text><text x="430" y="340">100 km</text><text x="500" y="340">1,000 km</text><text x="570" y="340">10,000 km</text>
  </g>
  <text x="325" y="368" fill="currentColor" text-anchor="middle">distance of a coordinate from the render origin</text>
  <text transform="translate(18 180) rotate(-90)" fill="currentColor" text-anchor="middle">smallest step a 32-bit float can take</text>
  <!-- float32 spacing doubles at every power of two; plotted at decade points: 1.2e-7, 9.5e-7, 7.6e-6, 6.1e-5, 9.8e-4, 7.8e-3, 0.0625 m, and 0.5 m at 6,371 km -->
  <polyline fill="none" stroke="#006a90" stroke-width="3" stroke-linejoin="round" points="80,318 150,281 220,245 290,209 360,160 430,124 500,88 556,52"/>
  <circle cx="80" cy="318" r="5" fill="#006a90"/>
  <circle cx="556" cy="52" r="5" fill="#006a90"/>
  <text x="100" y="284" fill="currentColor">render origin: near you</text>
  <text x="100" y="300" fill="currentColor" fill-opacity="0.75">step ≈ 0.1 µm — millimetre precision is free</text>
  <text x="548" y="26" fill="currentColor" text-anchor="end">Earth centre: 6,371 km away</text>
  <text x="548" y="70" fill="currentColor" fill-opacity="0.75" text-anchor="end">step = 0.5 m — a few ops later, geometry jitters by metres</text>
</svg>
