<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>A phone screen framing a dusk skyline: a glowing AR tower labelled Tacoma 42.4 km rises over the horizon, the night side of the Earth curves overhead with city lights, and a white dash marks the ISS</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1320"/>
      <stop offset="0.7" stop-color="#1c2a45"/>
      <stop offset="1" stop-color="#5a3f4a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6f9f" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fc4f5"/>
    </linearGradient>
    <clipPath id="screen"><rect x="330" y="40" width="540" height="550" rx="36"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="#2b3340"/>
  <!-- faint outside-the-phone horizon so the phone reads as a window -->
  <g opacity="0.25">
    <path d="M0 470 L1200 470 L1200 630 L0 630 z" fill="#0d1320"/>
    <path d="M0 470 L60 470 L60 430 L110 430 L110 470 L180 470 L180 400 L230 400 L230 470 L300 470 L300 445 L330 445 M870 470 L900 440 L940 440 L940 470 L1010 470 L1010 410 L1050 410 L1050 470 L1120 470 L1120 435 L1160 435 L1160 470 L1200 470" fill="none" stroke="#f7f8fa" stroke-width="3"/>
  </g>
  <!-- phone -->
  <rect x="316" y="26" width="568" height="578" rx="48" fill="#0d1320" stroke="#f7f8fa" stroke-width="4"/>
  <g clip-path="url(#screen)">
    <rect x="330" y="40" width="540" height="550" fill="url(#sky)"/>
    <!-- Earth's night side curving overhead -->
    <path d="M330 40 L330 165 A780 780 0 0 1 870 165 L870 40 z" fill="#0b1a2b"/>
    <path d="M330 165 A780 780 0 0 1 870 165" fill="none" stroke="#2f6f9f" stroke-width="3"/>
    <g fill="#f0b35a">
      <circle cx="450" cy="120" r="2.5"/><circle cx="470" cy="128" r="2"/><circle cx="520" cy="110" r="3"/><circle cx="560" cy="140" r="2"/>
      <circle cx="640" cy="118" r="2.5"/><circle cx="700" cy="132" r="2"/><circle cx="740" cy="112" r="3"/><circle cx="780" cy="140" r="2"/>
      <circle cx="600" cy="150" r="2"/><circle cx="500" cy="145" r="2"/><circle cx="820" cy="128" r="2"/>
    </g>
    <!-- ISS dash + trail -->
    <path d="M400 235 L470 220" stroke="#f7f8fa" stroke-width="3" stroke-dasharray="14 8" opacity="0.5"/>
    <rect x="470" y="212" width="34" height="8" rx="2" transform="rotate(-12 487 216)" fill="#f7f8fa"/>
    <text x="512" y="204" font-family="IBM Plex Sans" font-size="16" fill="#f7f8fa">ISS</text>
    <!-- Tacoma tower -->
    <rect x="590" y="240" width="20" height="270" fill="url(#beam)"/>
    <rect x="596" y="240" width="8" height="270" fill="#bfe3ff"/>
    <rect x="524" y="250" width="152" height="34" rx="6" fill="#0d1320" stroke="#7fc4f5" stroke-width="2"/>
    <text x="600" y="274" font-family="IBM Plex Sans" font-size="18" font-weight="700" fill="#f7f8fa" text-anchor="middle">Tacoma 42.4 km</text>
    <!-- Seattle skyline silhouette + ground -->
    <path d="M330 510 L370 510 L370 470 L400 470 L400 510 L430 510 L430 440 L450 440 L450 510 L480 510 L480 480 L500 480 L500 430 L510 430 L510 510 L560 510 L560 460 L580 460 L580 510 L640 510 L640 455 L665 455 L665 400 L672 400 L672 455 L690 455 L690 510 L730 510 L730 470 L760 470 L760 510 L790 510 L790 445 L815 445 L815 510 L870 510 L870 590 L330 590 z" fill="#0d1320"/>
    <!-- a few lit windows -->
    <g fill="#f0b35a" opacity="0.8">
      <rect x="436" y="455" width="4" height="6"/><rect x="503" y="445" width="4" height="6"/><rect x="565" y="470" width="4" height="6"/><rect x="795" y="460" width="4" height="6"/><rect x="740" y="480" width="4" height="6"/>
    </g>
    <!-- HUD corners -->
    <g stroke="#7fc4f5" stroke-width="3" fill="none" opacity="0.7">
      <path d="M350 80 L350 60 L370 60"/><path d="M850 80 L850 60 L830 60"/>
      <path d="M350 550 L350 570 L370 570"/><path d="M850 550 L850 570 L830 570"/>
    </g>
  </g>
</svg>
