<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>A phone held up against the Seattle skyline at dusk, its screen showing an AR tower labelled Tacoma 42.4 km, the night side of the Earth curving overhead with city lights, and a white dash marking the ISS</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11171d"/>
      <stop offset="0.55" stop-color="#006a90"/>
      <stop offset="0.95" stop-color="#f0b35a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#006a90" stop-opacity="0"/>
      <stop offset="1" stop-color="#deeef5"/>
    </linearGradient>
    <clipPath id="screen"><rect x="496" y="40" width="508" height="528" rx="30"/></clipPath>
  </defs>
  <!-- the real world at dusk, full canvas -->
  <rect width="1500" height="600" fill="#11171d"/>
  <rect width="1500" height="600" fill="url(#sky)" opacity="0.3"/>
  <!-- stars in the flanks -->
  <g fill="#fafcfe" opacity="0.5">
    <circle cx="120" cy="80" r="1.8"/><circle cx="250" cy="150" r="1.4"/><circle cx="380" cy="70" r="1.6"/>
    <circle cx="60" cy="290" r="1.4"/><circle cx="320" cy="220" r="1.2"/>
    <circle cx="1120" cy="110" r="1.6"/><circle cx="1260" cy="190" r="1.4"/><circle cx="1380" cy="80" r="1.8"/>
    <circle cx="1450" cy="260" r="1.2"/><circle cx="1200" cy="40" r="1.2"/>
  </g>
  <!-- faint ISS trail crossing the whole sky, continuing behind the phone -->
  <g stroke="#fafcfe" stroke-width="3" stroke-dasharray="14 10" opacity="0.28">
    <path d="M60 355 L470 269"/>
    <path d="M1030 151 L1440 65"/>
  </g>
  <!-- real skyline silhouette, full width, same baseline as inside the screen -->
  <path d="M0 520 L50 520 L50 460 L90 460 L90 520 L150 520 L150 430 L195 430 L195 520 L260 520 L260 480 L300 480 L300 520 L350 520 L350 445 L390 445 L390 520 L440 520 L440 475 L480 475 L480 520 L1020 520 L1020 470 L1060 470 L1060 520 L1120 520 L1120 435 L1165 435 L1165 520 L1230 520 L1230 480 L1270 480 L1270 520 L1330 520 L1330 450 L1375 450 L1375 520 L1440 520 L1440 490 L1500 490 L1500 600 L0 600 z" fill="#11171d"/>
  <g fill="#f0b35a" opacity="0.4">
    <rect x="160" y="450" width="4" height="6"/><rect x="360" y="465" width="4" height="6"/><rect x="70" y="480" width="4" height="6"/>
    <rect x="1135" y="455" width="4" height="6"/><rect x="1345" y="470" width="4" height="6"/><rect x="1245" y="495" width="4" height="6"/>
  </g>
  <!-- the phone: an AR window on the same scene -->
  <rect x="480" y="24" width="540" height="560" rx="46" fill="#11171d" stroke="#d9dfe3" stroke-width="4"/>
  <g clip-path="url(#screen)">
    <rect x="496" y="40" width="508" height="528" fill="url(#sky)"/>
    <!-- the night side of the Earth curving overhead -->
    <path d="M496 40 L496 170 A760 760 0 0 1 1004 170 L1004 40 z" fill="#11171d"/>
    <path d="M496 170 A760 760 0 0 1 1004 170" fill="none" stroke="#deeef5" stroke-width="2.5"/>
    <g fill="#f0b35a">
      <circle cx="560" cy="140" r="2.5"/><circle cx="600" cy="126" r="2"/><circle cx="650" cy="112" r="3"/><circle cx="700" cy="130" r="2"/>
      <circle cx="760" cy="108" r="2.5"/><circle cx="820" cy="122" r="2"/><circle cx="870" cy="134" r="3"/><circle cx="920" cy="146" r="2"/>
      <circle cx="740" cy="145" r="2"/><circle cx="630" cy="150" r="2"/><circle cx="960" cy="158" r="2"/>
    </g>
    <!-- the ISS, bright inside the window -->
    <path d="M512 260 L636 234" stroke="#fafcfe" stroke-width="3" stroke-dasharray="14 8" opacity="0.55"/>
    <rect x="638" y="226" width="36" height="8" rx="2" transform="rotate(-12 656 230)" fill="#fafcfe"/>
    <text x="684" y="222" font-family="IBM Plex Sans" font-size="16" fill="#fafcfe">ISS</text>
    <!-- the Tacoma tower -->
    <rect x="840" y="250" width="20" height="270" fill="url(#beam)"/>
    <rect x="846" y="250" width="8" height="270" fill="#deeef5"/>
    <rect x="768" y="262" width="164" height="36" rx="6" fill="#11171d" stroke="#deeef5" stroke-width="2"/>
    <text x="850" y="287" font-family="IBM Plex Sans" font-size="18" font-weight="700" fill="#fafcfe" text-anchor="middle">Tacoma 42.4 km</text>
    <!-- the same skyline, seen through the screen -->
    <path d="M496 520 L530 520 L530 470 L560 470 L560 520 L590 520 L590 440 L612 440 L612 520 L640 520 L640 480 L658 480 L658 430 L668 430 L668 520 L700 520 L700 460 L720 460 L720 520 L742 520 L742 455 L760 455 L760 400 L767 400 L767 455 L784 455 L784 520 L816 520 L816 470 L846 470 L846 520 L880 520 L880 445 L905 445 L905 520 L940 520 L940 485 L965 485 L965 520 L1004 520 L1004 568 L496 568 z" fill="#11171d"/>
    <g fill="#f0b35a" opacity="0.8">
      <rect x="596" y="455" width="4" height="6"/><rect x="661" y="445" width="4" height="6"/><rect x="726" y="472" width="4" height="6"/>
      <rect x="886" y="460" width="4" height="6"/><rect x="820" y="480" width="4" height="6"/><rect x="945" y="495" width="4" height="6"/>
    </g>
    <!-- HUD corners -->
    <g stroke="#deeef5" stroke-width="3" fill="none" opacity="0.7">
      <path d="M516 96 L516 76 L536 76"/><path d="M984 96 L984 76 L964 76"/>
      <path d="M516 512 L516 532 L536 532"/><path d="M984 512 L984 532 L964 532"/>
    </g>
  </g>
</svg>
