<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="sbpv-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
  </defs>

  <!-- command sheet -->
  <rect x="280" y="14" width="80" height="56" rx="4" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <line x1="290" y1="28" x2="350" y2="28" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="290" y1="38" x2="336" y2="38" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="290" y1="48" x2="350" y2="48" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="290" y1="58" x2="328" y2="58" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <text x="372" y="46" fill="currentColor" font-weight="600">PIC command stream</text>

  <!-- feeds both renders -->
  <path d="M276 44 Q180 60 140 124" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#sbpv-fg)"/>
  <path d="M364 52 Q460 64 480 108" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#sbpv-fg)"/>
  <text x="480" y="120" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11" font-style="italic">commands in stream order</text>

  <!-- phase 1: small native grid -->
  <text x="138" y="142" fill="currentColor" text-anchor="middle" font-weight="600">Phase 1: render at 1x</text>
  <rect x="90" y="156" width="96" height="80" fill="#fafcfe" stroke="#555f69" stroke-opacity="0.6"/>
  <path d="M106 156 V236 M122 156 V236 M138 156 V236 M154 156 V236 M170 156 V236 M90 172 H186 M90 188 H186 M90 204 H186 M90 220 H186" stroke="#555f69" stroke-opacity="0.3" fill="none"/>
  <path d="M90 156 H170 V172 H154 V188 H138 V204 H122 V220 H106 V236 H90 Z" fill="#deeef5"/>
  <rect x="170" y="156" width="16" height="16" fill="#006a90"/>
  <rect x="154" y="172" width="16" height="16" fill="#006a90"/>
  <rect x="138" y="188" width="16" height="16" fill="#006a90"/>
  <rect x="122" y="204" width="16" height="16" fill="#006a90"/>
  <rect x="106" y="220" width="16" height="16" fill="#006a90"/>
  <text x="138" y="258" fill="currentColor" text-anchor="middle" font-size="12">expected pixel count</text>
  <text x="138" y="274" fill="currentColor" text-anchor="middle" font-size="12">+ fill mask per FILL</text>

  <!-- phase 2: big scaled grid -->
  <text x="480" y="138" fill="currentColor" text-anchor="middle" font-weight="600">Phase 2: render at Nx</text>
  <rect x="390" y="146" width="180" height="160" fill="#fafcfe" stroke="#555f69" stroke-opacity="0.6"/>
  <path d="M410 146 V306 M430 146 V306 M450 146 V306 M470 146 V306 M490 146 V306 M510 146 V306 M530 146 V306 M550 146 V306 M390 166 H570 M390 186 H570 M390 206 H570 M390 226 H570 M390 246 H570 M390 266 H570 M390 286 H570" stroke="#555f69" stroke-opacity="0.3" fill="none"/>
  <path d="M390 146 H550 V166 H530 V186 H510 V206 H490 V226 H470 V246 H450 V266 H430 V286 H410 V306 H390 Z" fill="#deeef5"/>
  <rect x="550" y="146" width="20" height="20" fill="#006a90"/>
  <rect x="530" y="166" width="20" height="20" fill="#006a90"/>
  <rect x="510" y="186" width="20" height="20" fill="#006a90"/>
  <rect x="490" y="206" width="20" height="20" fill="none" stroke="#555f69" stroke-dasharray="3 2" stroke-width="1.5"/>
  <rect x="470" y="226" width="20" height="20" fill="#006a90"/>
  <rect x="450" y="246" width="20" height="20" fill="#006a90"/>
  <rect x="430" y="266" width="20" height="20" fill="#006a90"/>
  <rect x="410" y="286" width="20" height="20" fill="#006a90"/>

  <!-- feature callouts -->
  <text x="290" y="192" fill="currentColor" text-anchor="middle" font-weight="600">guarded flood fill</text>
  <path d="M340 186 Q370 178 392 172" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#sbpv-fg)"/>
  <text x="425" y="336" fill="currentColor" text-anchor="middle" font-weight="600">snap endpoints</text>
  <line x1="420" y1="322" x2="420" y2="310" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <text x="500" y="358" fill="currentColor" text-anchor="middle" font-weight="600">close diagonal micro-gaps</text>
  <line x1="500" y1="346" x2="500" y2="230" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>

  <!-- both sides feed the oracle gauge -->
  <path d="M138 282 V468 H256" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#sbpv-fg)"/>
  <path d="M500 366 V468 H384" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#sbpv-fg)"/>

  <!-- oracle gauge -->
  <text x="320" y="400" fill="currentColor" text-anchor="middle" font-weight="600">fill exceeds native x N^2 x 5</text>
  <text x="320" y="417" fill="currentColor" text-anchor="middle" font-weight="600">or 40% of screen?</text>
  <path d="M265 500 A55 55 0 0 1 375 500" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="4"/>
  <path d="M347.5 452.4 A55 55 0 0 1 375 500" fill="none" stroke="#f0b35a" stroke-width="5"/>
  <line x1="255" y1="500" x2="385" y2="500" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="320" y1="500" x2="358" y2="478" stroke="#006a90" stroke-width="3" stroke-linecap="round"/>
  <circle cx="320" cy="500" r="5" fill="#006a90"/>

  <!-- verdicts -->
  <text x="320" y="540" fill="currentColor" fill-opacity="0.85" text-anchor="middle" font-size="12" font-style="italic">no &#8594; keep the fill, undershoots pass through</text>
  <text x="320" y="558" fill="currentColor" fill-opacity="0.85" text-anchor="middle" font-size="12" font-style="italic">yes &#8594; roll back mid-fill</text>
  <text x="320" y="576" fill="currentColor" fill-opacity="0.85" text-anchor="middle" font-size="12" font-style="italic">zero pixels, native count non-zero &#8594; blit native mask scaled</text>

  <!-- dither band -->
  <line x1="320" y1="588" x2="320" y2="606" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#sbpv-fg)"/>
  <rect x="170" y="610" width="300" height="28" rx="4" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <rect x="178" y="613" width="7" height="7" fill="#006a90" fill-opacity="0.55"/>
  <rect x="185" y="624" width="7" height="7" fill="#006a90" fill-opacity="0.55"/>
  <rect x="192" y="613" width="7" height="7" fill="#006a90" fill-opacity="0.5"/>
  <rect x="199" y="624" width="7" height="7" fill="#006a90" fill-opacity="0.5"/>
  <rect x="210" y="613" width="7" height="7" fill="#006a90" fill-opacity="0.45"/>
  <rect x="217" y="624" width="7" height="7" fill="#006a90" fill-opacity="0.45"/>
  <rect x="232" y="613" width="7" height="7" fill="#006a90" fill-opacity="0.4"/>
  <rect x="243" y="624" width="7" height="7" fill="#006a90" fill-opacity="0.35"/>
  <rect x="258" y="613" width="7" height="7" fill="#006a90" fill-opacity="0.3"/>
  <rect x="273" y="624" width="7" height="7" fill="#006a90" fill-opacity="0.25"/>
  <rect x="292" y="613" width="7" height="7" fill="#006a90" fill-opacity="0.2"/>
  <rect x="313" y="624" width="7" height="7" fill="#006a90" fill-opacity="0.15"/>
  <rect x="338" y="613" width="7" height="7" fill="#006a90" fill-opacity="0.1"/>
  <rect x="368" y="624" width="7" height="7" fill="#006a90" fill-opacity="0.07"/>
  <rect x="402" y="613" width="7" height="7" fill="#006a90" fill-opacity="0.05"/>
  <text x="320" y="662" fill="currentColor" text-anchor="middle" font-weight="600">dither-to-RGBA blend</text>
</svg>
