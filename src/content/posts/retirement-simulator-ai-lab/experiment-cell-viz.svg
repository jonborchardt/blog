<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="ecv-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
  </defs>

  <!-- left sheet: experiments.json -->
  <text x="180" y="24" fill="currentColor" text-anchor="middle" font-weight="600">experiments.json</text>
  <text x="180" y="40" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">one row per strategy, committed</text>
  <rect x="125" y="48" width="110" height="76" rx="4" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <line x1="137" y1="64" x2="197" y2="64" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="137" y1="78" x2="217" y2="78" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="137" y1="92" x2="187" y2="92" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="137" y1="106" x2="207" y2="106" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

  <!-- right sheet: dataset, with padlock -->
  <text x="460" y="24" fill="currentColor" text-anchor="middle" font-weight="600">dataset: gitignored personal config</text>
  <text x="460" y="40" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">or committed synthetic one</text>
  <rect x="405" y="48" width="110" height="76" rx="4" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <line x1="417" y1="64" x2="497" y2="64" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="417" y1="112" x2="477" y2="112" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <path d="M452 84 V77 a8 8 0 0 1 16 0 V84" fill="none" stroke="#006a90" stroke-width="2"/>
  <rect x="446" y="84" width="28" height="19" rx="3" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>

  <!-- both pour into the funnel -->
  <line x1="180" y1="128" x2="180" y2="160" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#ecv-fg)"/>
  <line x1="460" y1="128" x2="460" y2="160" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#ecv-fg)"/>

  <!-- validation funnel -->
  <path d="M120 166 L520 166 L350 246 L350 280 L290 280 L290 246 Z" fill="#deeef5" stroke="#006a90" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="362" y="252" fill="currentColor" font-weight="600">validate: no micro-caps,</text>
  <text x="362" y="268" fill="currentColor" font-weight="600">livable guardrails,</text>
  <text x="362" y="284" fill="currentColor" fill-opacity="0.75" font-size="12">no personal numbers in committed rows</text>
  <line x1="320" y1="284" x2="320" y2="421" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#ecv-fg)"/>

  <!-- history rail joins at the run -->
  <text x="142" y="396" fill="currentColor" text-anchor="middle" font-weight="600">history 1928-2025</text>
  <text x="142" y="412" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">committed</text>
  <line x1="40" y1="430" x2="245" y2="430" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="55" cy="430" r="3" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="85" cy="430" r="3" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="115" cy="430" r="3" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="145" cy="430" r="3" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="175" cy="430" r="3" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="205" cy="430" r="3" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="235" cy="430" r="3" fill="currentColor" fill-opacity="0.35"/>
  <text x="55" y="450" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11">1928</text>
  <text x="235" y="450" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11">2025</text>
  <line x1="250" y1="430" x2="309" y2="430" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#ecv-fg)"/>

  <!-- the replay fan: one path per start year -->
  <circle cx="320" cy="430" r="5" fill="#006a90"/>
  <path d="M320 430 Q470 415 610 350" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M320 430 Q470 420 610 378" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M320 430 Q470 424 610 400" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M320 430 Q470 428 610 415" fill="none" stroke="#006a90" stroke-width="2.5"/>
  <path d="M320 430 Q470 438 610 448" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M320 430 Q470 446 610 472" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M320 430 Q470 456 610 495" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="450" y="520" fill="currentColor" text-anchor="middle" font-weight="600">replay every start year</text>
  <text x="450" y="537" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">x retire age x claim age</text>
  <line x1="450" y1="546" x2="450" y2="562" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#ecv-fg)"/>

  <!-- the results grid, one scored cell lit -->
  <rect x="366" y="566" width="168" height="78" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="408" y1="566" x2="408" y2="644" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="450" y1="566" x2="450" y2="644" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="492" y1="566" x2="492" y2="644" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="366" y1="592" x2="534" y2="592" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="366" y1="618" x2="534" y2="618" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="450" y="592" width="42" height="26" fill="#f0b35a"/>
  <text x="450" y="668" fill="currentColor" text-anchor="middle" font-size="12">cell: survival %,</text>
  <text x="450" y="684" fill="currentColor" text-anchor="middle" font-size="12">median and worst-case terminal wealth</text>
</svg>
