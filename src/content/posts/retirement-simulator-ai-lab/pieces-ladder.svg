<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" font-family="system-ui, sans-serif" font-size="13">
  <!-- y = success % across 98 start years, 70..100 (70% at y=242, 6 px per pt); waterfall of the plan's pieces -->
  <g stroke="currentColor" stroke-opacity="0.15" stroke-width="1">
    <line x1="80" y1="212" x2="620" y2="212"/><line x1="80" y1="182" x2="620" y2="182"/><line x1="80" y1="122" x2="620" y2="122"/><line x1="80" y1="92" x2="620" y2="92"/><line x1="80" y1="62" x2="620" y2="62"/>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <line x1="80" y1="242" x2="620" y2="242"/><line x1="80" y1="62" x2="80" y2="242"/>
  </g>
  <!-- y tick labels -->
  <g fill="currentColor" fill-opacity="0.75" text-anchor="end">
    <text x="72" y="246">70%</text><text x="72" y="216">75%</text><text x="72" y="186">80%</text><text x="72" y="156">85%</text><text x="72" y="126">90%</text><text x="72" y="96">95%</text><text x="72" y="66">100%</text>
  </g>
  <!-- 85% target line -->
  <line x1="80" y1="152" x2="620" y2="152" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="614" y="147" fill="currentColor" fill-opacity="0.8" text-anchor="end">85% target</text>
  <!-- taper-alone marker -->
  <line x1="490" y1="92.6" x2="620" y2="92.6" stroke="#f0b35a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="484" y="96" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="11">taper alone: 94.9%</text>
  <!-- connectors between steps -->
  <g stroke="currentColor" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 3">
    <line x1="175" y1="203" x2="210" y2="203"/>
    <line x1="280" y1="190.4" x2="315" y2="190.4"/>
    <line x1="385" y1="118.4" x2="420" y2="118.4"/>
    <line x1="490" y1="68" x2="530" y2="68"/>
  </g>
  <!-- bars: endpoints in primary, increments in the gold highlight -->
  <rect x="105" y="203" width="70" height="39" fill="#006a90" fill-opacity="0.55"/>
  <rect x="210" y="190.4" width="70" height="12.6" fill="#f0b35a" fill-opacity="0.75"/>
  <rect x="315" y="118.4" width="70" height="72" fill="#f0b35a" fill-opacity="0.75"/>
  <rect x="420" y="68" width="70" height="50.4" fill="#f0b35a" fill-opacity="0.75"/>
  <rect x="530" y="68" width="70" height="174" fill="#006a90" fill-opacity="0.55"/>
  <!-- value labels -->
  <g fill="currentColor" text-anchor="middle">
    <text x="140" y="197">76.5%</text>
    <text x="245" y="184.4">+2</text>
    <text x="350" y="112.4">+12</text>
    <text x="455" y="62">+8</text>
    <text x="565" y="62">99.0%</text>
  </g>
  <!-- x labels -->
  <g fill="currentColor" fill-opacity="0.85" text-anchor="middle" font-size="12">
    <text x="140" y="260">baseline</text><text x="140" y="274">100% stock</text>
    <text x="245" y="260">+ spending</text><text x="245" y="274">guardrail</text>
    <text x="350" y="260">+ gold as</text><text x="350" y="274">the asset</text>
    <text x="455" y="260">+ window</text><text x="455" y="274">timing</text>
    <text x="565" y="260">the plan</text><text x="565" y="274">(ratchet: +0, free)</text>
  </g>
  <text x="350" y="298" fill="currentColor" fill-opacity="0.7" text-anchor="middle" font-size="11">success % across 98 historical start years at the frontier age · noise floor ±1–2 pts (1 pt = one cohort) · axis starts at 70%</text>
</svg>
