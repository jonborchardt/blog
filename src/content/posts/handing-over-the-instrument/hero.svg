<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>Sound waves meeting a dashed boundary and continuing on the far side as rows of numbers</title>

  <rect x="0" y="0" width="1500" height="600" fill="#fafcfe" />

  <path
    d="M50 0V600 M100 0V600 M150 0V600 M200 0V600 M250 0V600 M300 0V600 M350 0V600 M400 0V600 M450 0V600 M500 0V600 M550 0V600 M600 0V600 M650 0V600 M700 0V600 M750 0V600 M800 0V600 M850 0V600 M900 0V600 M950 0V600 M1000 0V600 M1050 0V600 M1100 0V600 M1150 0V600 M1200 0V600 M1250 0V600 M1300 0V600 M1350 0V600 M1400 0V600 M1450 0V600"
    stroke="#d9dfe3" stroke-width="1" opacity="0.55" />

  <!-- left flank: the sound arriving from off frame -->
  <g fill="none" stroke="#006a90" stroke-width="5" stroke-linecap="round" opacity="0.3">
    <path d="M110 216A130 130 0 0 1 110 384" />
    <path d="M180 240A100 100 0 0 1 180 360" />
  </g>

  <!-- the speaker -->
  <path d="M300 250L360 196V404L300 350Z" fill="#deeef5" stroke="#006a90" stroke-width="6" stroke-linejoin="round" />
  <g fill="none" stroke="#006a90" stroke-width="6" stroke-linecap="round">
    <path d="M392 244A62 62 0 0 1 392 356" />
    <path d="M436 214A96 96 0 0 1 436 386" />
    <path d="M480 186A130 130 0 0 1 480 414" />
  </g>

  <!-- the boundary: nothing audible crosses it -->
  <path d="M600 96V504" stroke="#f0b35a" stroke-width="8" stroke-dasharray="26 20" stroke-linecap="round" />

  <!-- the far side: the same thing as rows of numbers -->
  <g fill="#006a90">
    <rect x="680" y="176" width="180" height="16" rx="8" />
    <rect x="884" y="176" width="96" height="16" rx="8" opacity="0.45" />
    <rect x="1002" y="176" width="140" height="16" rx="8" opacity="0.45" />

    <rect x="680" y="228" width="140" height="16" rx="8" />
    <rect x="844" y="228" width="128" height="16" rx="8" opacity="0.45" />
    <rect x="996" y="228" width="84" height="16" rx="8" opacity="0.45" />

    <rect x="680" y="280" width="196" height="16" rx="8" />
    <rect x="900" y="280" width="72" height="16" rx="8" opacity="0.45" />
    <rect x="996" y="280" width="152" height="16" rx="8" opacity="0.45" />

    <rect x="680" y="332" width="116" height="16" rx="8" />
    <rect x="820" y="332" width="144" height="16" rx="8" opacity="0.45" />
    <rect x="988" y="332" width="100" height="16" rx="8" opacity="0.45" />

    <rect x="680" y="384" width="164" height="16" rx="8" />
    <rect x="868" y="384" width="88" height="16" rx="8" opacity="0.45" />
    <rect x="980" y="384" width="132" height="16" rx="8" opacity="0.45" />
  </g>

  <!-- right flank: the table carries on past the frame -->
  <g fill="#006a90">
    <rect x="1200" y="176" width="150" height="16" rx="8" opacity="0.3" />
    <rect x="1200" y="228" width="196" height="16" rx="8" opacity="0.24" />
    <rect x="1200" y="280" width="120" height="16" rx="8" opacity="0.18" />
    <rect x="1200" y="332" width="172" height="16" rx="8" opacity="0.13" />
    <rect x="1200" y="384" width="138" height="16" rx="8" opacity="0.09" />
  </g>
</svg>
