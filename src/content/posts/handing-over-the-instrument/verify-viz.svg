<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="vfy-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6" />
    </marker>
    <marker id="vfy-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0b35a" />
    </marker>
  </defs>

  <text x="10" y="20" font-size="12" fill="currentColor" fill-opacity="0.75">THE CHAIN</text>

  <!-- stages -->
  <g>
    <rect x="10" y="34" width="84" height="30" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
    <rect x="106" y="34" width="84" height="30" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
    <rect x="202" y="34" width="100" height="30" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5" stroke-dasharray="5 3" />
    <rect x="314" y="34" width="84" height="30" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
    <rect x="410" y="34" width="100" height="30" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5" stroke-dasharray="5 3" />
    <rect x="522" y="34" width="84" height="30" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  </g>
  <g font-size="12" fill="#11171d" text-anchor="middle">
    <text x="52" y="54">the plan</text>
    <text x="148" y="54">render</text>
    <text x="252" y="54">check</text>
    <text x="356" y="54">render</text>
    <text x="460" y="54">analyse</text>
    <text x="564" y="54">verdict</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <path d="M94 49H104" /><path d="M190 49H200" /><path d="M302 49H312" /><path d="M398 49H408" /><path d="M510 49H520" />
  </g>
  <g font-size="11" fill="currentColor" fill-opacity="0.75" text-anchor="middle">
    <text x="148" y="80">before</text>
    <text x="356" y="80">after</text>
  </g>
  <text x="10" y="104" font-size="11" fill="currentColor" fill-opacity="0.75">The two dashed stages need a browser open: the audio engine is Web Audio, so Node never makes a sound.</text>

  <line x1="10" y1="120" x2="630" y2="120" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" />

  <!-- trace 1: pass -->
  <text x="10" y="146" font-size="12" fill="currentColor">"much sparser"</text>
  <text x="10" y="162" font-size="11" fill="currentColor" fill-opacity="0.75">one measurable axis</text>
  <rect x="150" y="132" width="150" height="26" rx="5" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="225" y="150" font-size="12" text-anchor="middle" fill="#11171d">density</text>
  <path d="M306 145H336" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" fill="none" marker-end="url(#vfy-fg)" />
  <text x="346" y="150" font-size="12" fill="currentColor">onsets 3.94 to 1.94 per second</text>
  <text x="346" y="168" font-size="12" fill="currentColor" fill-opacity="0.75">verified</text>

  <!-- trace 2: fail -->
  <line x1="10" y1="188" x2="630" y2="188" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" />
  <text x="10" y="214" font-size="12" fill="currentColor">"punchier"</text>
  <text x="10" y="230" font-size="11" fill="currentColor" fill-opacity="0.75">four axes</text>
  <rect x="150" y="200" width="150" height="26" rx="5" fill="none" stroke="#f0b35a" stroke-width="2" />
  <text x="225" y="218" font-size="12" text-anchor="middle" fill="currentColor">articulation</text>
  <path d="M306 213H336" stroke="#f0b35a" stroke-width="2" fill="none" marker-end="url(#vfy-warm)" />
  <text x="346" y="218" font-size="12" fill="currentColor">crest 5.11 to 4.27</text>
  <text x="346" y="236" font-size="12" fill="currentColor" fill-opacity="0.75">NOT verified</text>

  <rect x="150" y="246" width="150" height="26" rx="5" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="225" y="264" font-size="12" text-anchor="middle" fill="#11171d">drive</text>
  <path d="M225 246V236" stroke="#f0b35a" stroke-width="2" fill="none" marker-end="url(#vfy-warm)" />
  <text x="346" y="264" font-size="12" fill="currentColor" fill-opacity="0.75">moved the onsets that crest measures</text>
  <text x="10" y="292" font-size="11" fill="currentColor" fill-opacity="0.75">The word asked for four things at once, and three of the four get no clean verdict.</text>
</svg>
