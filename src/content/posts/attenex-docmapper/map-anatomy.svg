<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="dmap-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
    <marker id="dmap-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0b35a"/></marker>
  </defs>

  <!-- concept compass ring: a partial arc, as it appears on screen -->
  <path d="M336.9 148.8 A 135 135 0 1 0 163.8 321.9" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- compass concepts, with pointers to where their spines lie -->
  <text x="249" y="48" fill="currentColor" text-anchor="middle" font-weight="600">stone</text>
  <line x1="247" y1="55" x2="245" y2="66" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="123" y="74" fill="currentColor" text-anchor="end" font-weight="600">ring</text>
  <line x1="128" y1="78" x2="136" y2="86" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="61" y="168" fill="#f0b35a" text-anchor="end" font-weight="600">carat</text>
  <line x1="66" y1="167" x2="79" y2="167" stroke="#f0b35a" stroke-width="1.5"/>
  <text x="86" y="287" fill="currentColor" text-anchor="end" font-weight="600">parking</text>
  <line x1="91" y1="282" x2="101" y2="275" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- spines: lines of clusters sharing one concept, running inward -->
  <line x1="243" y1="72" x2="229" y2="192" stroke="currentColor" stroke-opacity="0.8" stroke-width="3"/>
  <line x1="139" y1="91" x2="217" y2="194" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5"/>
  <line x1="85" y1="168" x2="212" y2="202" stroke="#f0b35a" stroke-width="1.5"/>
  <line x1="106" y1="268" x2="214" y2="228" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- clusters: each a ring of documents -->
  <g fill="none" stroke="#006a90" stroke-width="1.5">
    <circle cx="239" cy="107" r="12"/>
    <circle cx="234" cy="145" r="12"/>
    <circle cx="162" cy="121" r="12"/>
    <circle cx="186" cy="154" r="12"/>
    <circle cx="123" cy="178" r="12"/>
    <circle cx="166" cy="189" r="12"/>
    <circle cx="143" cy="254" r="12"/>
    <circle cx="180" cy="240" r="12"/>
    <circle cx="240" cy="235" r="12"/>
    <circle cx="221" cy="209" r="12"/>
  </g>
  <g fill="#006a90" fill-opacity="0.75">
    <circle cx="236" cy="104" r="2.2"/><circle cx="243" cy="107" r="2.2"/><circle cx="238" cy="112" r="2.2"/>
    <circle cx="231" cy="142" r="2.2"/><circle cx="238" cy="145" r="2.2"/><circle cx="233" cy="150" r="2.2"/>
    <circle cx="159" cy="118" r="2.2"/><circle cx="166" cy="121" r="2.2"/><circle cx="161" cy="126" r="2.2"/>
    <circle cx="183" cy="151" r="2.2"/><circle cx="190" cy="154" r="2.2"/><circle cx="185" cy="159" r="2.2"/>
    <circle cx="120" cy="175" r="2.2"/><circle cx="127" cy="178" r="2.2"/><circle cx="122" cy="183" r="2.2"/>
    <circle cx="163" cy="186" r="2.2"/><circle cx="170" cy="189" r="2.2"/><circle cx="165" cy="194" r="2.2"/>
    <circle cx="140" cy="251" r="2.2"/><circle cx="147" cy="254" r="2.2"/><circle cx="142" cy="259" r="2.2"/>
    <circle cx="177" cy="237" r="2.2"/><circle cx="184" cy="240" r="2.2"/><circle cx="179" cy="245" r="2.2"/>
    <circle cx="237" cy="232" r="2.2"/><circle cx="244" cy="235" r="2.2"/><circle cx="239" cy="240" r="2.2"/>
    <circle cx="218" cy="206" r="2.2"/><circle cx="225" cy="209" r="2.2"/><circle cx="220" cy="214" r="2.2"/>
  </g>

  <!-- callouts for the map -->
  <text x="372" y="76" fill="currentColor" font-weight="600">concept compass</text>
  <text x="372" y="93" fill="currentColor" fill-opacity="0.85" font-size="12">the top concepts of the longest</text>
  <text x="372" y="108" fill="currentColor" fill-opacity="0.85" font-size="12">spines, set where those spines point</text>
  <path d="M368 84 Q 336 90 310 96" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#dmap-fg)"/>

  <text x="372" y="160" fill="currentColor" font-weight="600">a spine</text>
  <text x="372" y="177" fill="currentColor" fill-opacity="0.85" font-size="12">a line of clusters that all share</text>
  <text x="372" y="192" fill="currentColor" fill-opacity="0.85" font-size="12">one concept</text>
  <path d="M368 168 Q 316 152 246 128" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#dmap-fg)"/>

  <text x="372" y="244" fill="currentColor" font-weight="600">a cluster</text>
  <text x="372" y="261" fill="currentColor" fill-opacity="0.85" font-size="12">documents grouped by how alike</text>
  <text x="372" y="276" fill="currentColor" fill-opacity="0.85" font-size="12">their concepts are</text>
  <path d="M368 252 Q 316 244 258 238" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#dmap-fg)"/>

  <!-- one cluster, magnified -->
  <path d="M249 243 Q 320 295 390 400" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dmap-fg)"/>
  <circle cx="455" cy="465" r="70" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <path d="M455 465 L467.0 465.0 L467.5 463.9 L467.8 462.7 L468.1 461.4 L468.2 460.0 L468.1 458.6 L468.0 457.2 L467.6 455.8 L467.1 454.3 L466.5 452.9 L465.7 451.5 L464.7 450.2 L463.6 448.9 L462.3 447.7 L460.9 446.6 L459.3 445.7 L457.7 444.9 L455.8 444.2 L453.9 443.7 L452.0 443.3 L449.9 443.2 L447.8 443.2 L445.7 443.5 L443.5 444.0 L441.4 444.6 L439.3 445.5 L437.2 446.7 L435.3 448.0 L433.4 449.5 L431.7 451.3 L430.0 453.2 L428.6 455.3 L427.3 457.6 L426.3 460.0 L425.4 462.6 L424.8 465.3 L424.4 468.0 L424.3 470.9 L424.5 473.7 L424.9 476.6 L425.6 479.5 L426.6 482.4 L427.8 485.2 L429.4 487.9 L431.2 490.5 L433.2 492.9 L435.5 495.2 L438.1 497.3 L440.9 499.2 L443.8 500.8 L447.0 502.1 L450.3 503.2 L453.7 504.0 L457.3 504.5 L460.9 504.6 L464.6 504.5 L468.2 503.9 L471.9 503.1 L475.5 501.8 L479.0 500.3 L482.4 498.4 L485.7 496.2 L488.7 493.6 L491.6 490.8 L494.2 487.6 L496.6 484.2 L498.6 480.6 L500.3 476.7 L501.7 472.7 L502.8 468.5 L503.4 464.2 L503.6 459.8 L503.5 455.3 L502.9 450.9 L501.9 446.4 L500.5 442.0 L498.7 437.8 L496.5 433.6 L493.9 429.7 L490.9 425.9 L487.6 422.5 L483.9 419.3 L479.9 416.4 L475.7 413.9 L471.1 411.7 L466.4 410.0 L461.5 408.6 L456.4 407.8 L451.2 407.4 L445.9 407.4 L440.7 408.0" fill="none" stroke="#555f69" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="455" cy="465" r="5.5" fill="#11171d"/>
  <g fill="#555f69">
    <circle cx="466" cy="452" r="4.5"/>
    <circle cx="450" cy="443" r="4.5"/>
    <circle cx="430" cy="453" r="4.5"/>
    <circle cx="426" cy="480" r="4.5"/>
    <circle cx="446" cy="502" r="4.5"/>
    <circle cx="482" cy="498" r="4.5"/>
    <circle cx="503" cy="464" r="4.5"/>
    <circle cx="488" cy="422" r="4.5"/>
    <circle cx="440" cy="408" r="4.5"/>
  </g>

  <text x="34" y="404" fill="currentColor" font-weight="600">inside one cluster</text>
  <text x="34" y="428" fill="currentColor" fill-opacity="0.85" font-size="12">every dot is a single document, and its</text>
  <text x="34" y="443" fill="currentColor" fill-opacity="0.85" font-size="12">colour is the category it was marked with</text>
  <path d="M262 434 Q 322 438 378 448" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#dmap-fg)"/>

  <text x="34" y="490" fill="currentColor" fill-opacity="0.85" font-size="12">they spiral outward from the centre</text>
  <text x="34" y="505" fill="currentColor" fill-opacity="0.85" font-size="12">document, least similar last</text>
  <path d="M262 496 Q 330 500 392 490" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#dmap-fg)"/>
</svg>
