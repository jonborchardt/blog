<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="dloop-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
    <marker id="dloop-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0b35a"/></marker>
  </defs>

  <!-- ==== pass 1: everything in the main region ==== -->
  <circle cx="108" cy="82" r="62" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="none" stroke="#006a90" stroke-width="1.3">
    <circle cx="78" cy="55" r="9"/><circle cx="106" cy="44" r="9"/><circle cx="134" cy="58" r="9"/>
    <circle cx="66" cy="84" r="9"/><circle cx="95" cy="76" r="9"/><circle cx="124" cy="86" r="9"/>
    <circle cx="80" cy="112" r="9"/><circle cx="108" cy="106" r="9"/><circle cx="138" cy="112" r="9"/>
    <circle cx="98" cy="130" r="9"/>
  </g>
  <g fill="#006a90" fill-opacity="0.7">
    <circle cx="78" cy="55" r="2"/><circle cx="106" cy="44" r="2"/><circle cx="134" cy="58" r="2"/>
    <circle cx="66" cy="84" r="2"/><circle cx="95" cy="76" r="2"/><circle cx="124" cy="86" r="2"/>
    <circle cx="80" cy="112" r="2"/><circle cx="108" cy="106" r="2"/><circle cx="138" cy="112" r="2"/>
    <circle cx="98" cy="130" r="2"/>
  </g>

  <!-- empty trays -->
  <g stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <path d="M196 48 L246 48 L240 60 L202 60 z"/>
    <path d="M196 76 L246 76 L240 88 L202 88 z"/>
    <path d="M196 104 L246 104 L240 116 L202 116 z"/>
  </g>

  <text x="272" y="72" fill="currentColor" font-weight="600">open the assignment</text>
  <text x="272" y="91" fill="currentColor" fill-opacity="0.85" font-size="12">every document is unmarked and sits in the</text>
  <text x="272" y="106" fill="currentColor" fill-opacity="0.85" font-size="12">main region, clustered by concept</text>

  <path d="M108 148 L108 172" fill="none" stroke="#f0b35a" stroke-width="2" marker-end="url(#dloop-hi)"/>
  <text x="126" y="158" fill="currentColor" font-size="12" font-style="italic">mark the clusters you can judge in seconds,</text>
  <text x="126" y="172" fill="currentColor" font-size="12" font-style="italic">then press Sweep</text>

  <!-- ==== pass 2: marked clusters gone to the trays ==== -->
  <circle cx="108" cy="252" r="62" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="none" stroke="#006a90" stroke-width="1.3">
    <circle cx="95" cy="224" r="9"/><circle cx="128" cy="238" r="9"/>
    <circle cx="76" cy="252" r="9"/><circle cx="112" cy="266" r="9"/>
    <circle cx="90" cy="286" r="9"/>
  </g>
  <g fill="#006a90" fill-opacity="0.7">
    <circle cx="95" cy="224" r="2"/><circle cx="128" cy="238" r="2"/>
    <circle cx="76" cy="252" r="2"/><circle cx="112" cy="266" r="2"/>
    <circle cx="90" cy="286" r="2"/>
  </g>

  <!-- trays now holding documents -->
  <g stroke="#006a90" stroke-width="1.5" fill="#deeef5">
    <path d="M196 218 L246 218 L240 230 L202 230 z"/>
    <path d="M196 246 L246 246 L240 258 L202 258 z"/>
    <path d="M196 274 L246 274 L240 286 L202 286 z"/>
  </g>
  <g fill="#11171d">
    <circle cx="209" cy="224" r="2"/><circle cx="218" cy="224" r="2"/><circle cx="227" cy="224" r="2"/><circle cx="236" cy="224" r="2"/>
    <circle cx="209" cy="252" r="2"/><circle cx="218" cy="252" r="2"/><circle cx="227" cy="252" r="2"/>
    <circle cx="209" cy="280" r="2"/><circle cx="218" cy="280" r="2"/><circle cx="227" cy="280" r="2"/><circle cx="236" cy="280" r="2"/>
  </g>

  <text x="272" y="242" fill="currentColor" font-weight="600">the trays take the decided documents</text>
  <text x="272" y="261" fill="currentColor" fill-opacity="0.85" font-size="12">whole clusters leave the main region at once,</text>
  <text x="272" y="276" fill="currentColor" fill-opacity="0.85" font-size="12">still there on the right if you need them back</text>

  <path d="M108 318 L108 342" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#dloop-fg)"/>
  <text x="126" y="328" fill="currentColor" font-size="12" font-style="italic">press Recluster: the survivors are laid out</text>
  <text x="126" y="342" fill="currentColor" font-size="12" font-style="italic">again from scratch</text>

  <!-- ==== pass 3: a smaller, harder map ==== -->
  <circle cx="108" cy="416" r="62" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="none" stroke="#006a90" stroke-width="1.3">
    <circle cx="92" cy="400" r="9"/><circle cx="122" cy="410" r="9"/><circle cx="100" cy="432" r="9"/>
  </g>
  <g fill="#006a90" fill-opacity="0.7">
    <circle cx="92" cy="400" r="2"/><circle cx="122" cy="410" r="2"/><circle cx="100" cy="432" r="2"/>
  </g>

  <g stroke="#006a90" stroke-width="1.5" fill="#deeef5">
    <path d="M196 382 L246 382 L240 394 L202 394 z"/>
    <path d="M196 410 L246 410 L240 422 L202 422 z"/>
    <path d="M196 438 L246 438 L240 450 L202 450 z"/>
  </g>
  <g fill="#11171d">
    <circle cx="209" cy="388" r="2"/><circle cx="218" cy="388" r="2"/><circle cx="227" cy="388" r="2"/><circle cx="236" cy="388" r="2"/>
    <circle cx="205" cy="416" r="2"/><circle cx="214" cy="416" r="2"/><circle cx="223" cy="416" r="2"/><circle cx="232" cy="416" r="2"/><circle cx="238" cy="416" r="2"/>
    <circle cx="205" cy="444" r="2"/><circle cx="214" cy="444" r="2"/><circle cx="223" cy="444" r="2"/><circle cx="232" cy="444" r="2"/><circle cx="238" cy="444" r="2"/>
  </g>

  <text x="272" y="406" fill="currentColor" font-weight="600">a smaller map, of harder documents</text>
  <text x="272" y="425" fill="currentColor" fill-opacity="0.85" font-size="12">what is left re-forms into new clusters, and the</text>
  <text x="272" y="440" fill="currentColor" fill-opacity="0.85" font-size="12">loop runs again until nothing obvious remains</text>
</svg>
