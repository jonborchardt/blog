<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" font-family="system-ui, sans-serif" font-size="13">
  <!-- Two panels. Native cell grid 6 x 4, cell = 44 px. The line command runs from cell (0,3) to (5,0);
       its rasterised cells are (0,3) (1,2) (2,2) (3,1) (4,1) (5,0). -->
  <defs>
    <g id="grid" stroke="currentColor" stroke-opacity="0.2" fill="none">
      <rect x="0" y="0" width="264" height="176"/>
      <line x1="44" y1="0" x2="44" y2="176"/><line x1="88" y1="0" x2="88" y2="176"/><line x1="132" y1="0" x2="132" y2="176"/><line x1="176" y1="0" x2="176" y2="176"/><line x1="220" y1="0" x2="220" y2="176"/>
      <line x1="0" y1="44" x2="264" y2="44"/><line x1="0" y1="88" x2="264" y2="88"/><line x1="0" y1="132" x2="264" y2="132"/>
    </g>
    <g id="cells" fill="#deeef5">
      <rect x="0" y="132" width="44" height="44"/><rect x="44" y="88" width="44" height="44"/><rect x="88" y="88" width="44" height="44"/>
      <rect x="132" y="44" width="44" height="44"/><rect x="176" y="44" width="44" height="44"/><rect x="220" y="0" width="44" height="44"/>
    </g>
  </defs>

  <!-- left: block expansion, anchors at cell centres -->
  <g transform="translate(30 24)">
    <use href="#cells"/>
    <use href="#grid"/>
    <!-- the geometry the artist drew, faint -->
    <line x1="22" y1="154" x2="242" y2="22" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 4"/>
    <!-- centre-to-centre stroke -->
    <polyline fill="none" stroke="#555f69" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" points="22,154 66,110 110,110 154,66 198,66 242,22"/>
    <g fill="#555f69">
      <circle cx="22" cy="154" r="5"/><circle cx="66" cy="110" r="5"/><circle cx="110" cy="110" r="5"/><circle cx="154" cy="66" r="5"/><circle cx="198" cy="66" r="5"/><circle cx="242" cy="22" r="5"/>
    </g>
  </g>
  <text x="162" y="222" fill="currentColor" text-anchor="middle">anchor at every cell centre</text>
  <text x="162" y="240" fill="currentColor" fill-opacity="0.7" text-anchor="middle">stroke follows the cell mask: a staircase</text>

  <!-- right: anchors projected onto the command's segment -->
  <g transform="translate(346 24)">
    <use href="#cells"/>
    <use href="#grid"/>
    <!-- cell centres, ghosted, with projection ticks -->
    <g stroke="#006a90" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 3">
      <line x1="66" y1="110" x2="73.7" y2="122.9"/><line x1="110" y1="110" x2="106.1" y2="103.5"/><line x1="154" y1="66" x2="157.9" y2="72.5"/><line x1="198" y1="66" x2="190.3" y2="53.1"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-opacity="0.35">
      <circle cx="66" cy="110" r="4"/><circle cx="110" cy="110" r="4"/><circle cx="154" cy="66" r="4"/><circle cx="198" cy="66" r="4"/>
    </g>
    <!-- anchor-to-anchor stroke sits on the true segment -->
    <line x1="22" y1="154" x2="242" y2="22" stroke="#006a90" stroke-width="5" stroke-linecap="round"/>
    <g fill="#006a90" stroke="#fafcfe" stroke-width="1.5">
      <circle cx="22" cy="154" r="5"/><circle cx="73.7" cy="122.9" r="5"/><circle cx="106.1" cy="103.5" r="5"/><circle cx="157.9" cy="72.5" r="5"/><circle cx="190.3" cy="53.1" r="5"/><circle cx="242" cy="22" r="5"/>
    </g>
  </g>
  <text x="478" y="222" fill="currentColor" text-anchor="middle">anchor projected onto the segment</text>
  <text x="478" y="240" fill="currentColor" fill-opacity="0.7" text-anchor="middle">stroke follows the geometry: a clean diagonal</text>
</svg>
