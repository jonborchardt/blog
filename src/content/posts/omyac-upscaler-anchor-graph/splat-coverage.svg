<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, sans-serif" font-size="13">
  <!-- share of one native cell's upscaled territory (s x s px) covered by the 3 x 3 isolated-pixel splat: min(1, 9 / s^2) -->
  <g stroke="currentColor" stroke-opacity="0.15">
    <line x1="80" y1="50" x2="600" y2="50"/><line x1="80" y1="100" x2="600" y2="100"/><line x1="80" y1="150" x2="600" y2="150"/><line x1="80" y1="200" x2="600" y2="200"/>
  </g>
  <line x1="80" y1="250" x2="600" y2="250" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="80" y1="50" x2="80" y2="250" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <g fill="currentColor" fill-opacity="0.75" text-anchor="end">
    <text x="72" y="254">0%</text><text x="72" y="204">25%</text><text x="72" y="154">50%</text><text x="72" y="104">75%</text><text x="72" y="54">100%</text>
  </g>

  <!-- bars: 2x, 3x, 4x, 5x, 6x -->
  <g fill="#006a90">
    <rect x="102" y="50" width="60" height="200"/>
    <rect x="206" y="50" width="60" height="200"/>
    <rect x="310" y="138" width="60" height="112"/>
    <rect x="414" y="178" width="60" height="72"/>
  </g>
  <rect x="518" y="200" width="60" height="50" fill="#f0b35a"/>

  <!-- the 3x3 splat drawn inside a cell of each size, for scale (1 px = 4 units) -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.5">
    <rect x="128" y="20" width="8" height="8"/><rect x="230" y="14" width="12" height="12"/><rect x="332" y="10" width="16" height="16"/><rect x="434" y="6" width="20" height="20"/><rect x="536" y="2" width="24" height="24"/>
  </g>
  <g fill="#006a90" fill-opacity="0.85">
    <rect x="126" y="18" width="12" height="12"/><rect x="230" y="14" width="12" height="12"/><rect x="334" y="12" width="12" height="12"/><rect x="438" y="10" width="12" height="12"/><rect x="542" y="8" width="12" height="12"/>
  </g>

  <g fill="currentColor" text-anchor="middle" font-weight="700">
    <text x="132" y="44">100%</text><text x="236" y="44">100%</text><text x="340" y="132">56%</text><text x="444" y="172">36%</text><text x="548" y="194">25%</text>
  </g>
  <g fill="currentColor" fill-opacity="0.75" text-anchor="middle">
    <text x="132" y="270">2×</text><text x="236" y="270">3×</text><text x="340" y="270">4×</text><text x="444" y="270">5×</text><text x="548" y="270">6×</text>
  </g>
  <text x="340" y="292" fill="currentColor" text-anchor="middle">upscale factor (one native cell becomes s × s pixels)</text>
  <text transform="translate(18 150) rotate(-90)" fill="currentColor" text-anchor="middle">cell territory covered by a 3×3 splat</text>
</svg>
