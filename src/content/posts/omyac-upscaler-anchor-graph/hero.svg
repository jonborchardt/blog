<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>A grid of native pixel cells split down the middle: on the left a stair-stepped block line, on the right the same cells with anchor dots projected onto a smooth diagonal stroke</title>
  <rect width="1500" height="600" fill="#fafcfe"/>
  <!-- cell grid, 60 px cells, 25 x 10 -->
  <g stroke="#d9dfe3" stroke-width="2">
    <path d="M60 0V600M120 0V600M180 0V600M240 0V600M300 0V600M360 0V600M420 0V600M480 0V600M540 0V600M600 0V600M660 0V600M720 0V600M780 0V600M840 0V600M900 0V600M960 0V600M1020 0V600M1080 0V600M1140 0V600M1200 0V600M1260 0V600M1320 0V600M1380 0V600M1440 0V600"/>
    <path d="M0 60H1500M0 120H1500M0 180H1500M0 240H1500M0 300H1500M0 360H1500M0 420H1500M0 480H1500M0 540H1500"/>
  </g>
  <!-- one line command spanning the canvas: true line through cell centres (30,510) -> (1470,30), slope -1/3 -->
  <!-- cells the command rasterised, shaded on both halves (staircase: 1 row up every 3 cols) -->
  <g fill="#deeef5">
    <rect x="0" y="480" width="180" height="60"/>
    <rect x="180" y="420" width="180" height="60"/>
    <rect x="360" y="360" width="180" height="60"/>
    <rect x="540" y="300" width="180" height="60"/>
    <rect x="720" y="240" width="180" height="60"/>
    <rect x="900" y="180" width="180" height="60"/>
    <rect x="1080" y="120" width="180" height="60"/>
    <rect x="1260" y="60" width="180" height="60"/>
    <rect x="1440" y="0" width="60" height="60"/>
  </g>
  <!-- left half: block-expanded staircase, ink grey -->
  <g fill="#555f69">
    <rect x="0" y="500" width="200" height="20"/>
    <rect x="180" y="440" width="200" height="20"/>
    <rect x="360" y="380" width="200" height="20"/>
    <rect x="540" y="320" width="180" height="20"/>
    <rect x="180" y="440" width="20" height="80"/>
    <rect x="360" y="380" width="20" height="80"/>
    <rect x="540" y="320" width="20" height="80"/>
  </g>
  <!-- divider -->
  <rect x="716" y="0" width="8" height="600" fill="#11171d"/>
  <!-- right half: anchors projected onto the true segment, joined by one clean stroke -->
  <line x1="750" y1="270" x2="1470" y2="30" stroke="#006a90" stroke-width="20" stroke-linecap="round"/>
  <g fill="#f0b35a" stroke="#11171d" stroke-width="4">
    <circle cx="810" cy="250" r="13"/><circle cx="870" cy="230" r="13"/><circle cx="930" cy="210" r="13"/><circle cx="990" cy="190" r="13"/><circle cx="1050" cy="170" r="13"/><circle cx="1110" cy="150" r="13"/><circle cx="1170" cy="130" r="13"/>
    <!-- flank continuation, non-essential -->
    <circle cx="1230" cy="110" r="13"/><circle cx="1290" cy="90" r="13"/><circle cx="1350" cy="70" r="13"/>
  </g>
  <!-- ghosted cell-centre anchors and their sub-cell projection ticks -->
  <g stroke="#006a90" stroke-width="3" stroke-dasharray="6 6" fill="none">
    <line x1="810" y1="270" x2="810" y2="250"/><line x1="870" y1="270" x2="870" y2="230"/><line x1="990" y1="210" x2="990" y2="190"/><line x1="1050" y1="210" x2="1050" y2="170"/>
    <circle cx="810" cy="270" r="7"/><circle cx="870" cy="270" r="7"/><circle cx="990" cy="210" r="7"/><circle cx="1050" cy="210" r="7"/>
  </g>
  <!-- labels, inside the centre-crop safe zone -->
  <g font-family="IBM Plex Sans" font-size="30" fill="#11171d">
    <text x="330" y="555">pixels: which colour?</text>
    <text x="760" y="555">commands: which line?</text>
  </g>
</svg>
