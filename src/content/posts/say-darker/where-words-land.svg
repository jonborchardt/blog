<svg xmlns="http://www.w3.org/2000/svg" width="640" height="272" viewBox="0 0 640 272" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="wwl-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0b35a" />
    </marker>
  </defs>

  <text x="10" y="16" font-size="11.5" fill="currentColor" fill-opacity="0.7">WHERE A WORD LANDS</text>

  <!-- what you type -->
  <rect x="24" y="26" width="124" height="26" rx="13" fill="none" stroke="currentColor" stroke-opacity="0.45" />
  <text x="86" y="44" font-family="ui-monospace, Consolas, monospace" font-size="12.5" text-anchor="middle" fill="currentColor">much darker</text>

  <!-- what the table turns it into -->
  <text x="172" y="37" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="currentColor">brightness -0.60</text>
  <text x="172" y="53" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="currentColor">register -0.20</text>

  <!-- and the line of the song file it is added to -->
  <path d="M231 62V72H420V131" stroke="#f0b35a" stroke-width="1.5" fill="none" marker-end="url(#wwl-tip)" />

  <rect x="10" y="80" width="620" height="160" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.22" />
  <g font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="currentColor" fill-opacity="0.42">
    <text x="26" y="102">song({ bpm: 64, key: 'D:minor' }, [</text>
    <text x="42" y="126">section('drop', 8, {</text>
    <text x="58" y="174">pad:    { brightness: .5, space: .8 },</text>
    <text x="42" y="198">}),</text>
    <text x="26" y="222">])</text>
  </g>

  <rect x="20" y="135" width="600" height="21" rx="5" fill="none" stroke="#f0b35a" stroke-opacity="0.75" stroke-width="1.5" />
  <text x="58" y="150" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="currentColor">melody: { brightness: .7, density: .5, width: .8 },</text>

  <path d="M330 170H424" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="2 3" fill="none" />
  <text x="430" y="174" font-size="11.5" fill="currentColor" fill-opacity="0.6">the same edit, every part in the section</text>

  <text x="10" y="262" font-size="11.5" fill="currentColor" fill-opacity="0.7">the word is never stored, only the numbers it moved</text>
</svg>
