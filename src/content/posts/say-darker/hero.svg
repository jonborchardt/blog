<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>The word darker pushing four sliders down, two of which have hit the floor and stopped</title>

  <rect x="0" y="0" width="1500" height="600" fill="#fafcfe" />

  <path
    d="M50 0V600 M100 0V600 M150 0V600 M200 0V600 M250 0V600 M300 0V600 M350 0V600 M400 0V600 M450 0V600 M500 0V600 M550 0V600 M600 0V600 M650 0V600 M700 0V600 M750 0V600 M800 0V600 M850 0V600 M900 0V600 M950 0V600 M1000 0V600 M1050 0V600 M1100 0V600 M1150 0V600 M1200 0V600 M1250 0V600 M1300 0V600 M1350 0V600 M1400 0V600 M1450 0V600"
    stroke="#d9dfe3" stroke-width="1" opacity="0.55" />

  <!-- the floor every slider is falling toward -->
  <path d="M0 470H1500" stroke="#11171d" stroke-width="4" opacity="0.6" />

  <!-- left flank: earlier words, out of frame -->
  <g opacity="0.28">
    <rect x="54" y="214" width="190" height="58" rx="29" fill="#deeef5" stroke="#006a90" stroke-width="3" />
    <rect x="120" y="300" width="190" height="58" rx="29" fill="#deeef5" stroke="#006a90" stroke-width="3" />
  </g>

  <!-- the word -->
  <rect x="326" y="256" width="244" height="64" rx="32" fill="#deeef5" stroke="#006a90" stroke-width="4" />
  <text x="448" y="299" font-family="IBM Plex Sans" font-size="34" text-anchor="middle" fill="#11171d">darker</text>

  <!-- it pushes down on the sliders -->
  <g stroke="#006a90" stroke-width="4" fill="none" opacity="0.7">
    <path d="M582 288C630 288 636 214 682 214" />
    <path d="M582 288C630 288 636 288 682 288" />
    <path d="M582 288C630 288 636 362 682 362" />
  </g>

  <!-- four vertical sliders, two with headroom and two on the floor -->
  <!-- track 1: still has room -->
  <path d="M740 150V470" stroke="#d9dfe3" stroke-width="10" stroke-linecap="round" />
  <path d="M740 150V330" stroke="#006a90" stroke-width="10" stroke-linecap="round" />
  <circle cx="740" cy="330" r="22" fill="#f0b35a" stroke="#11171d" stroke-width="4" />
  <path d="M740 372V430" stroke="#006a90" stroke-width="5" stroke-dasharray="10 8" />
  <path d="M726 426L740 452L754 426Z" fill="#006a90" />

  <!-- track 2: still has room -->
  <path d="M876 150V470" stroke="#d9dfe3" stroke-width="10" stroke-linecap="round" />
  <path d="M876 150V276" stroke="#006a90" stroke-width="10" stroke-linecap="round" />
  <circle cx="876" cy="276" r="22" fill="#f0b35a" stroke="#11171d" stroke-width="4" />
  <path d="M876 318V430" stroke="#006a90" stroke-width="5" stroke-dasharray="10 8" />
  <path d="M862 426L876 452L890 426Z" fill="#006a90" />

  <!-- track 3: on the floor, nothing left to give -->
  <path d="M1012 150V470" stroke="#d9dfe3" stroke-width="10" stroke-linecap="round" />
  <path d="M1012 150V448" stroke="#006a90" stroke-width="10" stroke-linecap="round" />
  <circle cx="1012" cy="448" r="22" fill="#deeef5" stroke="#006a90" stroke-width="4" />

  <!-- track 4: on the floor -->
  <path d="M1148 150V470" stroke="#d9dfe3" stroke-width="10" stroke-linecap="round" />
  <path d="M1148 150V448" stroke="#006a90" stroke-width="10" stroke-linecap="round" />
  <circle cx="1148" cy="448" r="22" fill="#deeef5" stroke="#006a90" stroke-width="4" />

  <!-- right flank: more tracks past the frame -->
  <g opacity="0.3">
    <path d="M1284 150V470" stroke="#d9dfe3" stroke-width="10" stroke-linecap="round" />
    <path d="M1284 150V400" stroke="#006a90" stroke-width="10" stroke-linecap="round" />
    <circle cx="1284" cy="400" r="22" fill="#deeef5" stroke="#006a90" stroke-width="4" />
  </g>
  <g opacity="0.18">
    <path d="M1420 150V470" stroke="#d9dfe3" stroke-width="10" stroke-linecap="round" />
    <path d="M1420 150V352" stroke="#006a90" stroke-width="10" stroke-linecap="round" />
    <circle cx="1420" cy="352" r="22" fill="#deeef5" stroke="#006a90" stroke-width="4" />
  </g>
</svg>
