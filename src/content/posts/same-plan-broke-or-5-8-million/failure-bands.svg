<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" font-family="system-ui, sans-serif" font-size="12">
  <!-- x = start year 1928..2025 (x = 70 + (year-1928) * 550/97, ~5.67 px/yr); one row per plan variant, warm blocks = failing start years -->
  <g stroke="currentColor" stroke-opacity="0.12" stroke-width="1">
    <line x1="81" y1="36" x2="81" y2="196"/><line x1="138" y1="36" x2="138" y2="196"/><line x1="195" y1="36" x2="195" y2="196"/><line x1="251" y1="36" x2="251" y2="196"/><line x1="308" y1="36" x2="308" y2="196"/><line x1="365" y1="36" x2="365" y2="196"/><line x1="422" y1="36" x2="422" y2="196"/><line x1="478" y1="36" x2="478" y2="196"/><line x1="535" y1="36" x2="535" y2="196"/><line x1="592" y1="36" x2="592" y2="196"/>
  </g>
  <!-- row 1: textbook plan -->
  <text x="70" y="48" fill="currentColor">textbook plan — 60/40, 4% spending · fails 1964–68 · 5 of 98 (94.9%)</text>
  <rect x="70" y="54" width="550" height="18" fill="currentColor" fill-opacity="0.06"/>
  <rect x="274.1" y="54" width="27.7" height="18" fill="#f0b35a"/>
  <!-- row 2: bond-heavier -->
  <text x="70" y="104" fill="currentColor">bond-heavier — 40/60, same spending · fails 1961–68 · 8 of 98 (91.8%)</text>
  <rect x="70" y="110" width="550" height="18" fill="currentColor" fill-opacity="0.06"/>
  <rect x="257.1" y="110" width="44.7" height="18" fill="#f0b35a"/>
  <!-- row 3: higher spending -->
  <text x="70" y="160" fill="currentColor">higher spending — 60/40, 5% · fails 1928–29, 1936, 1956, 1959–73, 1999–2000 · 21 of 98 (78.6%)</text>
  <rect x="70" y="166" width="550" height="18" fill="currentColor" fill-opacity="0.06"/>
  <rect x="70" y="166" width="10.7" height="18" fill="#f0b35a"/>
  <rect x="115.4" y="166" width="5" height="18" fill="#f0b35a"/>
  <rect x="228.8" y="166" width="5" height="18" fill="#f0b35a"/>
  <rect x="245.8" y="166" width="84.4" height="18" fill="#f0b35a"/>
  <rect x="472.6" y="166" width="10.7" height="18" fill="#f0b35a"/>
  <!-- axis -->
  <line x1="70" y1="196" x2="620" y2="196" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <g fill="currentColor" fill-opacity="0.75" text-anchor="middle">
    <text x="81" y="214">1930</text><text x="138" y="214">1940</text><text x="195" y="214">1950</text><text x="251" y="214">1960</text><text x="308" y="214">1970</text><text x="365" y="214">1980</text><text x="422" y="214">1990</text><text x="478" y="214">2000</text><text x="535" y="214">2010</text><text x="592" y="214">2020</text>
  </g>
  <text x="345" y="232" fill="currentColor" fill-opacity="0.8" text-anchor="middle">retirement start year</text>
  <text x="345" y="252" fill="currentColor" fill-opacity="0.7" text-anchor="middle" font-size="11">failing start years at a pinned as-of month · gaps of 3 and 16 cohorts are far above the ±1–2 cohort noise floor</text>
</svg>
