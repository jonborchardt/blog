<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="system-ui, sans-serif" font-size="13">
  <!-- x = years since retirement (0..30, 19.333 px/yr from x=60), y = real balance 0..6M (56.667 px per 1M, 0 at y=370) -->
  <g stroke="currentColor" stroke-opacity="0.15" stroke-width="1">
    <line x1="60" y1="370" x2="640" y2="370"/><line x1="60" y1="313.3" x2="640" y2="313.3"/><line x1="60" y1="256.7" x2="640" y2="256.7"/><line x1="60" y1="200" x2="640" y2="200"/><line x1="60" y1="143.3" x2="640" y2="143.3"/><line x1="60" y1="86.7" x2="640" y2="86.7"/><line x1="60" y1="30" x2="640" y2="30"/>
    <line x1="156.7" y1="30" x2="156.7" y2="370"/><line x1="253.3" y1="30" x2="253.3" y2="370"/><line x1="350" y1="30" x2="350" y2="370"/><line x1="446.7" y1="30" x2="446.7" y2="370"/><line x1="543.3" y1="30" x2="543.3" y2="370"/><line x1="640" y1="30" x2="640" y2="370"/>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <line x1="60" y1="370" x2="640" y2="370"/><line x1="60" y1="30" x2="60" y2="370"/>
  </g>
  <!-- y tick labels -->
  <g fill="currentColor" fill-opacity="0.75" text-anchor="end">
    <text x="52" y="374">$0</text><text x="52" y="317">$1M</text><text x="52" y="261">$2M</text><text x="52" y="204">$3M</text><text x="52" y="147">$4M</text><text x="52" y="91">$5M</text><text x="52" y="34">$6M</text>
  </g>
  <!-- x tick labels -->
  <g fill="currentColor" fill-opacity="0.75" text-anchor="middle">
    <text x="60" y="390">0</text><text x="156.7" y="390">5</text><text x="253.3" y="390">10</text><text x="350" y="390">15</text><text x="446.7" y="390">20</text><text x="543.3" y="390">25</text><text x="640" y="390">30</text>
    <text x="350" y="410">years since retirement</text>
  </g>
  <!-- start marker -->
  <text x="64" y="300" fill="currentColor" fill-opacity="0.75" font-size="12">all four start at $1,000,000</text>
  <!-- 1982 -->
  <g stroke="#006a90" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <polyline points="60,313.3 156.7,279.3 253.3,245.3 350,171.7 640,41.3"/>
  </g>
  <g fill="#006a90"><circle cx="60" cy="313.3" r="3.5"/><circle cx="156.7" cy="279.3" r="3.5"/><circle cx="253.3" cy="245.3" r="3.5"/><circle cx="350" cy="171.7" r="3.5"/><circle cx="640" cy="41.3" r="3.5"/></g>
  <text x="648" y="46" fill="#006a90" font-weight="600">1982 · $5.8M</text>
  <!-- 2000 (dashed) -->
  <g stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="6 4" stroke-linejoin="round">
    <polyline points="60,313.3 156.7,323.8 253.3,330.9 350,328.1 446.7,320.7 640,328.1"/>
  </g>
  <g fill="currentColor"><circle cx="156.7" cy="323.8" r="3.5"/><circle cx="253.3" cy="330.9" r="3.5"/><circle cx="350" cy="328.1" r="3.5"/><circle cx="446.7" cy="320.7" r="3.5"/><circle cx="640" cy="328.1" r="3.5"/></g>
  <text x="648" y="318" fill="currentColor">2000 · $740k</text>
  <!-- 1929 (solid ink) -->
  <g stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round">
    <polyline points="60,313.3 156.7,324.7 253.3,319 486.7,340.5 640,330.9"/>
  </g>
  <g fill="currentColor"><circle cx="156.7" cy="324.7" r="3.5"/><circle cx="253.3" cy="319" r="3.5"/><circle cx="486.7" cy="340.5" r="3.5"/><circle cx="640" cy="330.9" r="3.5"/></g>
  <text x="648" y="345" fill="currentColor">1929 · $690k</text>
  <!-- 1966 -->
  <g stroke="#f0b35a" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <polyline points="60,313.3 156.7,320.4 253.3,335.3 350,351.9 446.7,353.5 543.3,361.2 640,370"/>
  </g>
  <g fill="#f0b35a"><circle cx="156.7" cy="320.4" r="3.5"/><circle cx="253.3" cy="335.3" r="3.5"/><circle cx="350" cy="351.9" r="3.5"/><circle cx="446.7" cy="353.5" r="3.5"/><circle cx="543.3" cy="361.2" r="3.5"/><circle cx="640" cy="370" r="3.5"/></g>
  <text x="648" y="374" fill="currentColor" font-weight="600">1966 · $0</text>
  <!-- legend -->
  <g font-size="12" fill="currentColor" fill-opacity="0.85">
    <line x1="80" y1="60" x2="104" y2="60" stroke="#006a90" stroke-width="2.5"/><text x="110" y="64">retire 1982</text>
    <line x1="80" y1="80" x2="104" y2="80" stroke="currentColor" stroke-width="2"/><text x="110" y="84">retire 1929</text>
    <line x1="80" y1="100" x2="104" y2="100" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/><text x="110" y="104">retire 2000</text>
    <line x1="80" y1="120" x2="104" y2="120" stroke="#f0b35a" stroke-width="2.5"/><text x="110" y="124">retire 1966</text>
    <text x="80" y="144" fill-opacity="0.65">dots = balances stated in the text; straight lines between</text>
  </g>
</svg>
