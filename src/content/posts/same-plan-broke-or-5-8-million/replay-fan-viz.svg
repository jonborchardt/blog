  <text x="598" y="192" fill="currentColor" fill-opacity="0.85" text-anchor="end" font-size="12" font-style="italic">history, then long-run average</text>

  <line x1="320" y1="204" x2="320" y2="232" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#repv-fg)"/>

