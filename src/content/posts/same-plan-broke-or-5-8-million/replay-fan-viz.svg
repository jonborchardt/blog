<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="repv-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
  </defs>

  <!-- the one plan: a document sheet -->
  <rect x="230" y="16" width="180" height="56" rx="5" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <line x1="244" y1="32" x2="396" y2="32" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
