<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, sans-serif" font-size="13">
  <!-- y: lines 0..1100 over 230 px, baseline y=250; x: hours 0..54 over 20..600 -->
  <g stroke="currentColor" stroke-opacity="0.25" stroke-width="1">
    <line x1="60" y1="250" x2="620" y2="250" />
    <line x1="60" y1="197" x2="620" y2="197" />
    <line x1="60" y1="145" x2="620" y2="145" />
    <line x1="60" y1="92" x2="620" y2="92" />
    <line x1="60" y1="40" x2="620" y2="40" />
  </g>
  <g font-size="11" fill="currentColor" fill-opacity="0.75" text-anchor="end">
    <text x="52" y="254">0</text>
    <text x="52" y="201">250</text>
    <text x="52" y="149">500</text>
    <text x="52" y="96">750</text>
    <text x="52" y="44">1000</text>
  </g>
  <text x="10" y="20" font-size="12" fill="currentColor" fill-opacity="0.75">LINES IN THE EDITOR PAGE</text>

  <!-- step line. x = 60 + hours*10.4 ; y = 250 - lines*0.21 -->
  <path
    d="M60 229 L110 229 L110 201 L287 201 L287 200 L297 200 L297 179 L340 179 L340 133 L356 133 L356 63 L504 63 L504 43 L530 43 L530 35 L551 35 L551 27 L620 27"
    fill="none" stroke="#006a90" stroke-width="2.5" stroke-linejoin="round" />

  <!-- the flat stretch -->
  <path d="M110 201H287" stroke="#f0b35a" stroke-width="5" stroke-linecap="round" opacity="0.85" />
  <text x="198" y="192" font-size="12" text-anchor="middle" fill="currentColor">the textarea, 22 hours</text>

  <!-- the midnight commit -->
  <circle cx="356" cy="63" r="6" fill="#f0b35a" stroke="#11171d" stroke-width="2" />
  <path d="M356 69V96H240" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" fill="none" />
  <text x="236" y="93" font-size="12" text-anchor="end" fill="currentColor">"added mixer"</text>
  <text x="236" y="107" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">556 to 891, in one commit</text>

  <!-- inline controls -->
  <circle cx="530" cy="43" r="6" fill="#f0b35a" stroke="#11171d" stroke-width="2" />
  <path d="M530 37V24" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" />
  <text x="536" y="22" font-size="12" text-anchor="end" fill="currentColor">inline controls</text>
  <text x="620" y="60" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.75">12 commits, under 2 hours</text>

  <!-- x axis -->
  <g font-size="11" fill="currentColor" fill-opacity="0.75" text-anchor="middle">
    <text x="60" y="270">0</text>
    <text x="164" y="270">10</text>
    <text x="268" y="270">20</text>
    <text x="372" y="270">30</text>
    <text x="476" y="270">40</text>
    <text x="580" y="270">50</text>
  </g>
  <text x="340" y="290" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">hours since the first commit</text>
</svg>
