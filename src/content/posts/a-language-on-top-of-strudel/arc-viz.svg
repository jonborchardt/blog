<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="system-ui, sans-serif" font-size="13">
  <text x="10" y="20" font-size="12" fill="currentColor" fill-opacity="0.75">ENERGY PER SECTION, ACROSS 59 BARS</text>

  <!-- bars, width proportional to bars, height proportional to energy -->
  <g stroke="#006a90" stroke-width="1.5" fill="#deeef5">
    <rect x="20" y="294" width="10" height="6" />
    <rect x="31" y="281" width="80" height="19" />
    <rect x="112" y="215" width="80" height="85" />
    <rect x="193" y="134" width="80" height="166" />
    <rect x="274" y="254" width="80" height="46" />
    <rect x="355" y="177" width="80" height="123" />
    <rect x="437" y="80" width="121" height="220" fill="#f0b35a" />
    <rect x="559" y="267" width="61" height="33" />
  </g>

  <!-- energy values -->
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="25" y="288">1.7</text>
    <text x="71" y="275">5.6</text>
    <text x="152" y="209">25.2</text>
    <text x="233" y="128">49.4</text>
    <text x="314" y="248">13.7</text>
    <text x="395" y="171">36.6</text>
    <text x="497" y="74">65.3</text>
    <text x="589" y="261">9.7</text>
  </g>

  <!-- the two climax-role sections -->
  <g font-size="11" fill="#11171d" text-anchor="middle">
    <text x="233" y="152">climax</text>
    <text x="497" y="98">climax</text>
  </g>

  <!-- baseline and section names -->
  <line x1="20" y1="300" x2="620" y2="300" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" />
  <g font-size="12" fill="currentColor" text-anchor="middle">
    <text x="25" y="318">void</text>
    <text x="71" y="318">signal</text>
    <text x="152" y="318">approach</text>
    <text x="233" y="318">contact</text>
    <text x="314" y="318">will</text>
    <text x="395" y="318">plea</text>
    <text x="497" y="318">threshold</text>
    <text x="589" y="318">after</text>
  </g>
  <g font-size="11" fill="currentColor" fill-opacity="0.75" text-anchor="middle">
    <text x="25" y="334">1</text>
    <text x="71" y="334">8</text>
    <text x="152" y="334">8</text>
    <text x="233" y="334">8</text>
    <text x="314" y="334">8</text>
    <text x="395" y="334">8</text>
    <text x="497" y="334">12</text>
    <text x="589" y="334">6</text>
  </g>
  <text x="10" y="352" font-size="11" fill="currentColor" fill-opacity="0.75">bars</text>
</svg>
