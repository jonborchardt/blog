<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="phv-fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6" />
    </marker>
    <marker id="phv-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0b35a" />
    </marker>
  </defs>

  <text x="10" y="20" font-size="12" fill="currentColor" fill-opacity="0.75">THE SEVEN STAGES, ALWAYS IN THIS ORDER</text>

  <!-- the pipeline -->
  <g>
    <rect x="10" y="32" width="78" height="30" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
    <rect x="98" y="32" width="70" height="30" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
    <rect x="178" y="32" width="60" height="30" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
    <rect x="248" y="32" width="96" height="30" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
    <rect x="354" y="32" width="80" height="30" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
    <rect x="444" y="32" width="70" height="30" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
    <rect x="524" y="32" width="60" height="30" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  </g>
  <g font-size="12" fill="#11171d" text-anchor="middle">
    <text x="49" y="52">structural</text>
    <text x="133" y="52">timing</text>
    <text x="208" y="52">pitch</text>
    <text x="296" y="52">articulation</text>
    <text x="394" y="52">spectral</text>
    <text x="479" y="52">spatial</text>
    <text x="554" y="52">level</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <path d="M88 47H96" /><path d="M168 47H176" /><path d="M238 47H246" /><path d="M344 47H352" /><path d="M434 47H442" /><path d="M514 47H522" />
  </g>
  <g font-size="11" fill="currentColor" fill-opacity="0.75">
    <text x="10" y="80">builds the material,</text>
    <text x="10" y="94">before any pattern exists</text>
    <text x="524" y="80" text-anchor="end">nothing after it</text>
    <text x="584" y="94" text-anchor="end">can undo the balance</text>
  </g>

  <!-- the collision, inside the spectral stage -->
  <line x1="10" y1="118" x2="630" y2="118" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" />
  <text x="10" y="142" font-size="12" fill="currentColor" fill-opacity="0.75">TWO AXES, ONE FILTER CUTOFF, INSIDE THE SPECTRAL STAGE</text>

  <!-- correct path -->
  <text x="10" y="180" font-size="12" fill="currentColor">declared</text>
  <rect x="82" y="164" width="66" height="24" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" />
  <text x="115" y="181" font-size="12" text-anchor="middle" fill="currentColor">400 Hz</text>
  <path d="M150 176H182" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#phv-fg)" fill="none" />
  <rect x="192" y="164" width="120" height="24" rx="5" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="252" y="181" font-size="12" text-anchor="middle" fill="#11171d">brightness sets</text>
  <path d="M314 176H346" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#phv-fg)" fill="none" />
  <rect x="356" y="164" width="120" height="24" rx="5" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="416" y="181" font-size="12" text-anchor="middle" fill="#11171d">weight scales</text>
  <path d="M478 176H510" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#phv-fg)" fill="none" />
  <text x="520" y="181" font-size="13" fill="currentColor">893.02 Hz</text>

  <!-- broken path -->
  <text x="10" y="234" font-size="12" fill="currentColor">reversed</text>
  <rect x="82" y="218" width="66" height="24" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" />
  <text x="115" y="235" font-size="12" text-anchor="middle" fill="currentColor">400 Hz</text>
  <path d="M150 230H182" stroke="#f0b35a" stroke-width="1.5" marker-end="url(#phv-warn)" fill="none" />
  <rect x="192" y="218" width="120" height="24" rx="5" fill="none" stroke="#f0b35a" stroke-width="1.5" />
  <text x="252" y="235" font-size="12" text-anchor="middle" fill="currentColor">weight scales</text>
  <path d="M314 230H346" stroke="#f0b35a" stroke-width="1.5" marker-end="url(#phv-warn)" fill="none" />
  <rect x="356" y="218" width="120" height="24" rx="5" fill="none" stroke="#f0b35a" stroke-width="1.5" />
  <text x="416" y="235" font-size="12" text-anchor="middle" fill="currentColor">brightness sets</text>
  <path d="M478 230H510" stroke="#f0b35a" stroke-width="1.5" marker-end="url(#phv-warn)" fill="none" />
  <text x="520" y="235" font-size="13" fill="currentColor">1050.61 Hz</text>

  <!-- the annotation that explains the second row -->
  <path d="M416 248V268H252" stroke="#f0b35a" stroke-width="1.5" fill="none" marker-end="url(#phv-warn)" />
  <text x="416" y="286" font-size="12" text-anchor="middle" fill="currentColor">the second call replaced the first</text>
  <text x="416" y="302" font-size="12" text-anchor="middle" fill="currentColor" fill-opacity="0.75">weight contributed nothing, silently</text>
  <text x="115" y="302" font-size="12" text-anchor="middle" fill="currentColor" fill-opacity="0.75">same inputs</text>
</svg>
