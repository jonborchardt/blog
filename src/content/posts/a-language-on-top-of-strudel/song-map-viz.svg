<svg xmlns="http://www.w3.org/2000/svg" width="700" height="312" viewBox="0 0 700 312" font-family="system-ui, sans-serif" font-size="12">
  <text x="8" y="18" font-size="11.5" fill="currentColor" fill-opacity="0.7">THE SHAPE OF A SONG FILE</text>

  <!-- nesting: the whole file, one section, one part -->
  <g fill="none">
    <rect x="6" y="29" width="688" height="268" rx="8" stroke="currentColor" stroke-opacity="0.2" />
    <rect x="22" y="53" width="656" height="220" rx="8" stroke="currentColor" stroke-opacity="0.32" />
    <rect x="38" y="101" width="624" height="148" rx="8" stroke="#006a90" stroke-opacity="0.75" />
  </g>

  <!-- dashed leaders from each line of code to the name of the thing it is -->
  <g stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="2 3">
    <path d="M382 42H470" />
    <path d="M204 66H470" />
    <path d="M160 90H470" />
    <path d="M461 114H470" />
    <path d="M395 138H470" />
    <path d="M413 162H470" />
    <path d="M364 186H470" />
    <path d="M448 210H470" />
    <path d="M428 234H470" />
    <path d="M344 258H470" />
  </g>

  <!-- the file itself -->
  <g font-family="ui-monospace, Consolas, monospace" fill="currentColor">
    <text x="18" y="46">song({ cps · bpm · key · kit · meter · seed · room }, [</text>
    <text x="34" y="70">section('name', bars, {</text>
    <text x="34" y="94">key · progression</text>
    <text x="50" y="118">drums · bass · melody · pad · fx · sample · perc · raw: {</text>
    <text x="50" y="142">density · brightness · weight · space · width …</text>
    <text x="50" y="190">ramp(a, b) · wobble · drift · pulse · swell</text>
    <text x="50" y="214">sound · notes · template · patch · arp · begin · slices</text>
    <text x="50" y="238">level · position · velocity · humanize · duck · room</text>
    <text x="34" y="262">} · dropout · sweep · fx: { riser, impact }</text>
    <text x="18" y="286">])</text>
  </g>

  <!-- the one row that is words rather than code -->
  <text x="50" y="166" font-size="11" font-style="italic" fill="currentColor">"darker", "punchier", "much more spacious" write those numbers</text>

  <!-- what each line is called -->
  <g fill="currentColor" fill-opacity="0.78" font-size="11.5">
    <text x="478" y="46">Song settings</text>
    <text x="478" y="70">Sections</text>
    <text x="478" y="94">Harmony</text>
    <text x="478" y="118">Eight kinds of part</text>
    <text x="478" y="142">Twelve axes</text>
    <text x="478" y="166">Words</text>
    <text x="478" y="190">Movement over the section</text>
    <text x="478" y="214">Material</text>
    <text x="478" y="238">Mix routing</text>
    <text x="478" y="262">Transitions</text>
  </g>
</svg>
