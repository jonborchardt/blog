<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>Thirteen instruments placed on a stage seen from above, one in front and the rest arranged behind and to the sides, inside a single hall</title>

  <rect x="0" y="0" width="1500" height="600" fill="#fafcfe" />

  <!-- faint depth rulings across the whole width -->
  <g stroke="#d9dfe3" stroke-width="2" opacity="0.7">
    <path d="M0 140H1500 M0 220H1500 M0 300H1500 M0 380H1500 M0 460H1500" />
  </g>

  <!-- the hall: one rounded room enclosing the stage, dashed -->
  <rect x="330" y="70" width="840" height="450" rx="60" fill="none" stroke="#006a90" stroke-width="6" stroke-dasharray="26 18" opacity="0.8" />

  <!-- reflections on the flanks: echoes of the room edge, non-essential -->
  <g fill="none" stroke="#006a90" stroke-width="3" opacity="0.18">
    <rect x="250" y="30" width="1000" height="530" rx="80" />
    <rect x="170" y="-10" width="1160" height="610" rx="100" />
  </g>

  <!-- the listener at the front centre -->
  <path d="M722 566 L750 538 L778 566" fill="none" stroke="#11171d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="750" cy="576" r="9" fill="#11171d" />

  <!-- send lines from each part down toward the listener, faint -->
  <g stroke="#006a90" stroke-width="3" opacity="0.25">
    <path d="M750 200V530" />
    <path d="M560 300L730 530" />
    <path d="M940 300L770 530" />
    <path d="M470 400L722 530" />
    <path d="M1030 400L778 530" />
  </g>

  <!-- the parts: circles sized by level, one warm (the theme) in front -->
  <g stroke="#006a90" stroke-width="5" fill="#deeef5">
    <!-- front row -->
    <circle cx="750" cy="260" r="34" />
    <circle cx="690" cy="300" r="26" />
    <!-- middle row -->
    <circle cx="560" cy="300" r="30" />
    <circle cx="930" cy="290" r="30" />
    <circle cx="980" cy="330" r="26" />
    <circle cx="470" cy="360" r="30" />
    <circle cx="620" cy="380" r="28" />
    <circle cx="820" cy="380" r="30" />
    <!-- back row -->
    <circle cx="1030" cy="420" r="22" />
    <circle cx="540" cy="440" r="24" />
    <circle cx="760" cy="450" r="20" />
    <circle cx="430" cy="470" r="18" />
  </g>
  <circle cx="800" cy="200" r="44" fill="#f0b35a" stroke="#11171d" stroke-width="6" />

  <!-- a few labels, short -->
  <g font-family="IBM Plex Sans" font-size="26" fill="#11171d">
    <text x="856" y="210">front</text>
    <text x="1068" y="440" fill="#555f69">back</text>
    <text x="360" y="118" fill="#555f69">one hall</text>
  </g>
</svg>
