<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="system-ui, sans-serif" font-size="13">
  <text x="10" y="20" font-size="12" fill="currentColor" fill-opacity="0.75">THE SAME THIRTEEN PARTS, AND HOW MANY REVERBS THEY RUN THROUGH</text>

  <!-- three panels: 13 convolvers, 5, 1 -->
  <g font-size="12" fill="currentColor" text-anchor="middle">
    <text x="110" y="52">one bus per part</text>
    <text x="320" y="52">parts whose reverb would match share</text>
    <text x="530" y="52">one hall on the song</text>
  </g>
  <g font-size="11" fill="currentColor" fill-opacity="0.75" text-anchor="middle">
    <text x="110" y="68">13 convolvers</text>
    <text x="320" y="68">5 convolvers</text>
    <text x="530" y="68">1 convolver</text>
  </g>

  <!-- panel 1: 13 small parts each with its own reverb box -->
  <g>
    <g fill="#deeef5" stroke="#006a90" stroke-width="1.2">
      <rect x="40" y="86" width="26" height="14" rx="3" /><rect x="72" y="86" width="26" height="14" rx="3" /><rect x="104" y="86" width="26" height="14" rx="3" /><rect x="136" y="86" width="26" height="14" rx="3" /><rect x="168" y="86" width="26" height="14" rx="3" />
      <rect x="40" y="126" width="26" height="14" rx="3" /><rect x="72" y="126" width="26" height="14" rx="3" /><rect x="104" y="126" width="26" height="14" rx="3" /><rect x="136" y="126" width="26" height="14" rx="3" /><rect x="168" y="126" width="26" height="14" rx="3" />
      <rect x="72" y="166" width="26" height="14" rx="3" /><rect x="104" y="166" width="26" height="14" rx="3" /><rect x="136" y="166" width="26" height="14" rx="3" />
    </g>
    <g fill="none" stroke="#f0b35a" stroke-width="1.5">
      <rect x="36" y="82" width="34" height="22" rx="5" /><rect x="68" y="82" width="34" height="22" rx="5" /><rect x="100" y="82" width="34" height="22" rx="5" /><rect x="132" y="82" width="34" height="22" rx="5" /><rect x="164" y="82" width="34" height="22" rx="5" />
      <rect x="36" y="122" width="34" height="22" rx="5" /><rect x="68" y="122" width="34" height="22" rx="5" /><rect x="100" y="122" width="34" height="22" rx="5" /><rect x="132" y="122" width="34" height="22" rx="5" /><rect x="164" y="122" width="34" height="22" rx="5" />
      <rect x="68" y="162" width="34" height="22" rx="5" /><rect x="100" y="162" width="34" height="22" rx="5" /><rect x="132" y="162" width="34" height="22" rx="5" />
    </g>
  </g>

  <!-- panel 2: five groups -->
  <g>
    <rect x="232" y="82" width="44" height="26" rx="5" fill="none" stroke="#f0b35a" stroke-width="1.5" />
    <rect x="241" y="88" width="26" height="14" rx="3" fill="#deeef5" stroke="#006a90" stroke-width="1.2" />
    <text x="254" y="122" font-size="10" fill="currentColor" fill-opacity="0.75" text-anchor="middle">drums</text>

    <rect x="284" y="82" width="120" height="66" rx="5" fill="none" stroke="#f0b35a" stroke-width="1.5" />
    <g fill="#deeef5" stroke="#006a90" stroke-width="1.2">
      <rect x="292" y="88" width="26" height="14" rx="3" /><rect x="324" y="88" width="26" height="14" rx="3" /><rect x="356" y="88" width="26" height="14" rx="3" />
      <rect x="292" y="108" width="26" height="14" rx="3" /><rect x="324" y="108" width="26" height="14" rx="3" /><rect x="356" y="108" width="26" height="14" rx="3" />
      <rect x="324" y="128" width="26" height="14" rx="3" />
    </g>
    <text x="344" y="162" font-size="10" fill="currentColor" fill-opacity="0.75" text-anchor="middle">bass and six melodies: send only</text>

    <rect x="232" y="176" width="76" height="26" rx="5" fill="none" stroke="#f0b35a" stroke-width="1.5" />
    <g fill="#deeef5" stroke="#006a90" stroke-width="1.2"><rect x="240" y="182" width="26" height="14" rx="3" /><rect x="272" y="182" width="26" height="14" rx="3" /></g>
    <text x="270" y="216" font-size="10" fill="currentColor" fill-opacity="0.75" text-anchor="middle">two pads at .8</text>

    <rect x="316" y="176" width="76" height="26" rx="5" fill="none" stroke="#f0b35a" stroke-width="1.5" />
    <g fill="#deeef5" stroke="#006a90" stroke-width="1.2"><rect x="324" y="182" width="26" height="14" rx="3" /><rect x="356" y="182" width="26" height="14" rx="3" /></g>
    <text x="354" y="216" font-size="10" fill="currentColor" fill-opacity="0.75" text-anchor="middle">two pads at .9</text>

    <rect x="368" y="228" width="44" height="26" rx="5" fill="none" stroke="#f0b35a" stroke-width="1.5" />
    <rect x="377" y="234" width="26" height="14" rx="3" fill="#deeef5" stroke="#006a90" stroke-width="1.2" />
    <text x="390" y="268" font-size="10" fill="currentColor" fill-opacity="0.75" text-anchor="middle">fx</text>
  </g>

  <!-- panel 3: one hall, thirteen parts inside, each with its own send line -->
  <g>
    <rect x="442" y="82" width="176" height="172" rx="8" fill="none" stroke="#f0b35a" stroke-width="2" />
    <g fill="#deeef5" stroke="#006a90" stroke-width="1.2">
      <rect x="454" y="94" width="26" height="14" rx="3" /><rect x="486" y="94" width="26" height="14" rx="3" /><rect x="518" y="94" width="26" height="14" rx="3" /><rect x="550" y="94" width="26" height="14" rx="3" /><rect x="582" y="94" width="26" height="14" rx="3" />
      <rect x="454" y="134" width="26" height="14" rx="3" /><rect x="486" y="134" width="26" height="14" rx="3" /><rect x="518" y="134" width="26" height="14" rx="3" /><rect x="550" y="134" width="26" height="14" rx="3" /><rect x="582" y="134" width="26" height="14" rx="3" />
      <rect x="486" y="174" width="26" height="14" rx="3" /><rect x="518" y="174" width="26" height="14" rx="3" /><rect x="550" y="174" width="26" height="14" rx="3" />
    </g>
    <!-- sends: short lines of varying length under each part -->
    <g stroke="#006a90" stroke-opacity="0.6" stroke-width="2">
      <line x1="467" y1="110" x2="467" y2="116" /><line x1="499" y1="110" x2="499" y2="124" /><line x1="531" y1="110" x2="531" y2="126" /><line x1="563" y1="110" x2="563" y2="128" /><line x1="595" y1="110" x2="595" y2="122" />
      <line x1="467" y1="150" x2="467" y2="166" /><line x1="499" y1="150" x2="499" y2="164" /><line x1="531" y1="150" x2="531" y2="168" /><line x1="563" y1="150" x2="563" y2="160" /><line x1="595" y1="150" x2="595" y2="166" />
      <line x1="499" y1="190" x2="499" y2="206" /><line x1="531" y1="190" x2="531" y2="210" /><line x1="563" y1="190" x2="563" y2="204" />
    </g>
    <text x="530" y="240" font-size="10" fill="currentColor" fill-opacity="0.75" text-anchor="middle">each part keeps its own send amount</text>
  </g>

  <line x1="10" y1="286" x2="630" y2="286" stroke="currentColor" stroke-opacity="0.25" />
  <text x="10" y="306" font-size="11" fill="currentColor" fill-opacity="0.75">A reverb lives on a bus. Superdough rebuilds a bus's impulse whenever a note arrives asking for a different one,</text>
  <text x="10" y="322" font-size="11" fill="currentColor" fill-opacity="0.75">so parts can only share a bus if they want the same reverb. Under one hall, they all do.</text>
</svg>
