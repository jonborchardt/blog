<svg xmlns="http://www.w3.org/2000/svg" width="640" height="268" viewBox="0 0 640 268" font-family="system-ui, sans-serif" font-size="13">
  <!-- group: every song edit -->
  <text x="10" y="22" font-size="12" fill="currentColor" fill-opacity="0.75">RUNS ON EVERY SONG EDIT</text>

  <text x="162" y="50" text-anchor="end" fill="currentColor">check, one song</text>
  <rect x="178" y="36" width="21" height="20" rx="3" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="207" y="51" fill="currentColor">1.3 s</text>

  <text x="162" y="86" text-anchor="end" fill="currentColor">check, arrival</text>
  <rect x="178" y="72" width="97" height="20" rx="3" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="283" y="87" fill="currentColor">3.1 s</text>

  <text x="162" y="122" text-anchor="end" fill="currentColor">check, all six songs</text>
  <rect x="178" y="108" width="156" height="20" rx="3" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="342" y="123" fill="currentColor">6.2 s</text>

  <!-- group: engine changes only -->
  <text x="10" y="166" font-size="12" fill="currentColor" fill-opacity="0.75">RUNS ONLY WHEN THE ENGINE CHANGES</text>

  <text x="162" y="194" text-anchor="end" fill="currentColor">the full test suite</text>
  <rect x="178" y="180" width="358" height="20" rx="3" fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" />
  <text x="544" y="195" fill="currentColor">67 s</text>

  <!-- log axis -->
  <line x1="178" y1="218" x2="570" y2="218" stroke="currentColor" stroke-opacity="0.35" stroke-width="1" />
  <g stroke="currentColor" stroke-opacity="0.35" stroke-width="1">
    <line x1="178" y1="218" x2="178" y2="224" />
    <line x1="271" y1="218" x2="271" y2="224" />
    <line x1="374" y1="218" x2="374" y2="224" />
    <line x1="468" y1="218" x2="468" y2="224" />
    <line x1="570" y1="218" x2="570" y2="224" />
  </g>
  <g font-size="12" fill="currentColor" fill-opacity="0.75" text-anchor="middle">
    <text x="178" y="238">1</text>
    <text x="271" y="238">3</text>
    <text x="374" y="238">10</text>
    <text x="468" y="238">30</text>
    <text x="570" y="238">100</text>
  </g>
  <text x="374" y="258" font-size="12" text-anchor="middle" fill="currentColor" fill-opacity="0.75">seconds, log scale</text>
</svg>
