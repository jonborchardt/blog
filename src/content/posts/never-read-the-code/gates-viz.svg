<svg xmlns="http://www.w3.org/2000/svg" width="640" height="566" viewBox="0 0 640 566" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="gate-fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6" />
    </marker>
  </defs>

  <!-- the change entering at the top: a small ruled sheet -->
  <rect x="128" y="16" width="44" height="36" rx="3" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <g stroke="#006a90" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="136" y1="26" x2="164" y2="26" />
    <line x1="136" y1="34" x2="158" y2="34" />
    <line x1="136" y1="42" x2="162" y2="42" />
  </g>
  <text x="206" y="32" fill="currentColor">A change to a song, or to the engine under it</text>
  <text x="206" y="49" font-size="12" fill="currentColor" fill-opacity="0.75">described in a sentence, with a criterion for done</text>

  <!-- the spine -->
  <line x1="150" y1="56" x2="150" y2="484" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#gate-fg)" />

  <!-- gate 1 -->
  <g stroke="#006a90" stroke-width="1.5">
    <line x1="110" y1="96" x2="110" y2="124" />
    <line x1="190" y1="96" x2="190" y2="124" />
  </g>
  <rect x="110" y="103" width="80" height="14" rx="3" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="96" y="114" text-anchor="end" font-size="12" fill="currentColor" fill-opacity="0.75">instant</text>
  <text x="206" y="108" fill="currentColor">The code refuses it</text>
  <text x="206" y="125" font-size="12" fill="currentColor" fill-opacity="0.75">throws, and names every key it would have accepted</text>

  <!-- gate 2 -->
  <g stroke="#006a90" stroke-width="1.5">
    <line x1="110" y1="176" x2="110" y2="204" />
    <line x1="190" y1="176" x2="190" y2="204" />
  </g>
  <rect x="110" y="183" width="80" height="14" rx="3" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="96" y="194" text-anchor="end" font-size="12" fill="currentColor" fill-opacity="0.75">1.3 s</text>
  <text x="206" y="188" fill="currentColor">The checker prints the whole musical state</text>
  <text x="206" y="205" font-size="12" fill="currentColor" fill-opacity="0.75">every section, part and value, and the energy arc</text>

  <!-- gate 3 -->
  <g stroke="#006a90" stroke-width="1.5">
    <line x1="110" y1="256" x2="110" y2="284" />
    <line x1="190" y1="256" x2="190" y2="284" />
  </g>
  <rect x="110" y="263" width="80" height="14" rx="3" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="96" y="274" text-anchor="end" font-size="12" fill="currentColor" fill-opacity="0.75">67 s</text>
  <text x="206" y="268" fill="currentColor">The test suite, on engine changes only</text>
  <text x="206" y="285" font-size="12" fill="currentColor" fill-opacity="0.75">invariants over every cell, a fingerprint, the ship gate</text>

  <!-- gate 4: removed -->
  <rect x="110" y="343" width="80" height="14" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 4" />
  <g stroke="#f0b35a" stroke-width="3" stroke-linecap="round">
    <line x1="116" y1="336" x2="184" y2="364" />
    <line x1="184" y1="336" x2="116" y2="364" />
  </g>
  <text x="96" y="354" text-anchor="end" font-size="12" fill="currentColor" fill-opacity="0.75">never</text>
  <text x="206" y="348" fill="currentColor" fill-opacity="0.75">The human reads the diff</text>
  <text x="206" y="365" font-size="12" fill="currentColor" fill-opacity="0.75">ten pull requests, zero review comments on any of them</text>

  <!-- gate 5 -->
  <g stroke="#006a90" stroke-width="1.5">
    <line x1="110" y1="416" x2="110" y2="444" />
    <line x1="190" y1="416" x2="190" y2="444" />
  </g>
  <rect x="110" y="423" width="80" height="14" rx="3" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="96" y="434" text-anchor="end" font-size="12" fill="currentColor" fill-opacity="0.75">~2 min</text>
  <text x="206" y="428" fill="currentColor">Integration, then deploy</text>
  <text x="206" y="445" font-size="12" fill="currentColor" fill-opacity="0.75">the deploy step does not run when the tests fail</text>

  <!-- terminus: a person hears it -->
  <path d="M132 512 L148 498 L148 542 L132 528 Z" fill="#deeef5" stroke="#006a90" stroke-width="1.5" stroke-linejoin="round" />
  <g fill="none" stroke="#006a90" stroke-width="1.5" stroke-linecap="round">
    <path d="M158 508 A 14 14 0 0 1 158 532" />
    <path d="M168 500 A 24 24 0 0 1 168 540" />
  </g>
  <text x="206" y="514" fill="currentColor">A person presses Play</text>
  <text x="206" y="531" font-size="12" fill="currentColor" fill-opacity="0.75">the only step in this diagram that can hear the result</text>
</svg>
