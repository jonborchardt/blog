<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>A board of ticked swatch tiles, one per shared MDX primitive, with one amber tile labelled dev only, more faded tiles continuing past the board's edges</title>
  <rect width="1500" height="600" fill="#fafcfe"/>
  <defs>
    <g id="tile">
      <rect width="180" height="90" rx="8" fill="#deeef5"/>
      <circle cx="152" cy="24" r="14" fill="#006a90"/>
      <path d="M144 24 L150 30 L161 18" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="14" y="52" width="100" height="10" rx="5" fill="#006a90"/>
      <rect x="14" y="68" width="60" height="8" rx="4" fill="#11171d" opacity="0.35"/>
    </g>
    <g id="ghost" opacity="0.45">
      <rect width="180" height="90" rx="8" fill="#deeef5"/>
      <rect x="14" y="52" width="100" height="10" rx="5" fill="#d9dfe3"/>
      <rect x="14" y="68" width="60" height="8" rx="4" fill="#d9dfe3"/>
    </g>
  </defs>
  <!-- flanks: the field of primitives continues off the board (non-essential) -->
  <use href="#ghost" x="-80" y="145"/><use href="#ghost" x="-80" y="365"/>
  <use href="#ghost" x="120" y="35"/><use href="#ghost" x="120" y="255"/><use href="#ghost" x="120" y="475"/>
  <use href="#ghost" x="1400" y="145"/><use href="#ghost" x="1400" y="365"/>
  <use href="#ghost" x="1200" y="35"/><use href="#ghost" x="1200" y="255"/><use href="#ghost" x="1200" y="475"/>
  <!-- the board (essential: inside centre 900) -->
  <rect x="330" y="55" width="840" height="450" rx="14" fill="#ffffff" stroke="#11171d" stroke-width="4"/>
  <use href="#tile" x="360" y="90"/><use href="#tile" x="560" y="90"/><use href="#tile" x="760" y="90"/><use href="#tile" x="960" y="90"/>
  <use href="#tile" x="360" y="200"/><use href="#tile" x="560" y="200"/><use href="#tile" x="760" y="200"/><use href="#tile" x="960" y="200"/>
  <use href="#tile" x="360" y="310"/><use href="#tile" x="560" y="310"/><use href="#tile" x="760" y="310"/>
  <!-- the last tile: still under test -->
  <rect x="960" y="310" width="180" height="90" rx="8" fill="#f0b35a"/>
  <text x="1050" y="365" font-family="IBM Plex Sans" font-size="20" font-weight="700" fill="#11171d" text-anchor="middle">dev only</text>
  <text x="750" y="465" font-family="IBM Plex Sans" font-size="22" fill="#11171d" text-anchor="middle">every primitive · every variant · both themes</text>
</svg>
