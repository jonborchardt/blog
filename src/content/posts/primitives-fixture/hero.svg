<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>A checklist board of swatches, one tile per shared MDX primitive, every tile ticked</title>
  <rect width="1200" height="630" fill="#fafcfe"/>
  <rect x="200" y="80" width="800" height="470" rx="14" fill="#ffffff" stroke="#11171d" stroke-width="4"/>
  <defs>
    <g id="tile">
      <rect width="180" height="90" rx="8" fill="#deeef5"/>
      <circle cx="152" cy="24" r="14" fill="#006a90"/>
      <path d="M144 24 L150 30 L161 18" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="14" y="52" width="100" height="10" rx="5" fill="#006a90"/>
      <rect x="14" y="68" width="60" height="8" rx="4" fill="#11171d" opacity="0.35"/>
    </g>
  </defs>
  <g>
    <use href="#tile" x="230" y="110"/><use href="#tile" x="425" y="110"/><use href="#tile" x="620" y="110"/><use href="#tile" x="815" y="110"/>
    <use href="#tile" x="230" y="220"/><use href="#tile" x="425" y="220"/><use href="#tile" x="620" y="220"/><use href="#tile" x="815" y="220"/>
    <use href="#tile" x="230" y="330"/><use href="#tile" x="425" y="330"/><use href="#tile" x="620" y="330"/>
  </g>
  <!-- the last tile: still under test -->
  <rect x="815" y="330" width="180" height="90" rx="8" fill="#f0b35a"/>
  <text x="905" y="385" font-family="IBM Plex Sans" font-size="20" font-weight="700" fill="#11171d" text-anchor="middle">dev only</text>
  <text x="600" y="490" font-family="IBM Plex Sans" font-size="22" fill="#11171d" text-anchor="middle">every primitive · every variant · both themes</text>
</svg>
