<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="system-ui, sans-serif" font-size="13" aria-hidden="true">
  <defs>
    <marker id="stk-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6" />
    </marker>
  </defs>

  <!-- column titles -->
  <text x="165" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">macOS: AgentDeck</text>
  <text x="475" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">Windows: yolodeck</text>
  <line x1="320" y1="34" x2="320" y2="500" stroke="currentColor" stroke-opacity="0.2" stroke-dasharray="3 5" />

  <!-- ===== macOS column (centre x=165) ===== -->
  <!-- Claude Code terminal window -->
  <g>
    <rect x="85" y="44" width="160" height="56" rx="8" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
    <line x1="85" y1="62" x2="245" y2="62" stroke="#006a90" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="97" cy="53" r="3" fill="#006a90" fill-opacity="0.5" /><circle cx="107" cy="53" r="3" fill="#006a90" fill-opacity="0.5" /><circle cx="117" cy="53" r="3" fill="#006a90" fill-opacity="0.5" />
    <text x="165" y="86" text-anchor="middle" font-weight="600" fill="#11171d">claude</text>
  </g>
  <!-- hooks edge -->
  <line x1="165" y1="100" x2="165" y2="160" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#stk-fg)" />
  <text x="175" y="134" font-size="12" fill="currentColor" fill-opacity="0.8">lifecycle hooks</text>

  <!-- daemon -->
  <g>
    <rect x="70" y="162" width="190" height="78" rx="10" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
    <text x="165" y="186" text-anchor="middle" font-weight="600" fill="#11171d">AgentDeck daemon</text>
    <text x="165" y="206" text-anchor="middle" font-size="12" fill="#555f69">port 9120</text>
    <text x="165" y="224" text-anchor="middle" font-size="12" fill="#555f69">LaunchAgent, starts at login</text>
  </g>
  <!-- websocket edge -->
  <line x1="165" y1="240" x2="165" y2="300" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#stk-fg)" />
  <text x="175" y="274" font-size="12" fill="currentColor" fill-opacity="0.8">WebSocket</text>

  <!-- Stream Deck app frame with the plugin inside -->
  <rect x="60" y="302" width="210" height="96" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="72" y="320" font-size="12" fill="currentColor" fill-opacity="0.75">Stream Deck app</text>
  <rect x="80" y="330" width="170" height="56" rx="8" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="165" y="353" text-anchor="middle" font-weight="600" fill="#11171d">AgentDeck plugin</text>
  <text x="165" y="372" text-anchor="middle" font-size="12" fill="#555f69">Marketplace install</text>

  <!-- to hardware -->
  <line x1="165" y1="398" x2="165" y2="436" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#stk-fg)" />

  <!-- ===== Windows column (centre x=475) ===== -->
  <g>
    <rect x="395" y="44" width="160" height="56" rx="8" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
    <line x1="395" y1="62" x2="555" y2="62" stroke="#006a90" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="407" cy="53" r="3" fill="#006a90" fill-opacity="0.5" /><circle cx="417" cy="53" r="3" fill="#006a90" fill-opacity="0.5" /><circle cx="427" cy="53" r="3" fill="#006a90" fill-opacity="0.5" />
    <text x="475" y="86" text-anchor="middle" font-weight="600" fill="#11171d">claude</text>
  </g>
  <!-- HTTP hooks edge: runs straight past the missing daemon -->
  <line x1="475" y1="100" x2="475" y2="300" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#stk-fg)" />
  <text x="485" y="128" font-size="12" fill="currentColor" fill-opacity="0.8">HTTP hooks</text>
  <text x="485" y="144" font-size="12" fill="currentColor" fill-opacity="0.8">Bearer YOLODECK_TOKEN</text>

  <!-- ghost of the daemon that does not exist -->
  <rect x="380" y="162" width="190" height="78" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 5" />
  <text x="475" y="196" text-anchor="middle" fill="currentColor" fill-opacity="0.5">no daemon,</text>
  <text x="475" y="216" text-anchor="middle" fill="currentColor" fill-opacity="0.5">no service</text>

  <!-- Stream Deck app frame with the plugin inside -->
  <rect x="370" y="302" width="210" height="96" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="382" y="320" font-size="12" fill="currentColor" fill-opacity="0.75">Stream Deck app launches it</text>
  <rect x="390" y="330" width="170" height="56" rx="8" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="475" y="353" text-anchor="middle" font-weight="600" fill="#11171d">yolodeck plugin</text>
  <text x="475" y="372" text-anchor="middle" font-size="12" fill="#555f69">listens on 127.0.0.1:9200</text>

  <!-- to hardware -->
  <line x1="475" y1="398" x2="475" y2="436" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#stk-fg)" />

  <!-- ===== hardware: two small decks ===== -->
  <g>
    <rect x="105" y="440" width="120" height="62" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" />
    <g fill="#006a90" fill-opacity="0.7">
      <rect x="117" y="450" width="20" height="18" rx="3" /><rect x="142" y="450" width="20" height="18" rx="3" /><rect x="167" y="450" width="20" height="18" rx="3" /><rect x="192" y="450" width="20" height="18" rx="3" />
      <rect x="117" y="473" width="20" height="18" rx="3" /><rect x="142" y="473" width="20" height="18" rx="3" /><rect x="167" y="473" width="20" height="18" rx="3" />
    </g>
    <rect x="192" y="473" width="20" height="18" rx="3" fill="#f0b35a" />
    <text x="165" y="516" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.8">Stream Deck Neo</text>
  </g>
  <g>
    <rect x="415" y="440" width="120" height="62" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" />
    <g fill="#006a90" fill-opacity="0.7">
      <rect x="427" y="450" width="20" height="18" rx="3" /><rect x="452" y="450" width="20" height="18" rx="3" /><rect x="477" y="450" width="20" height="18" rx="3" /><rect x="502" y="450" width="20" height="18" rx="3" />
      <rect x="427" y="473" width="20" height="18" rx="3" /><rect x="452" y="473" width="20" height="18" rx="3" /><rect x="477" y="473" width="20" height="18" rx="3" /><rect x="502" y="473" width="20" height="18" rx="3" />
    </g>
    <text x="475" y="516" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.8">Stream Deck (approve / deny from here)</text>
  </g>
</svg>
