<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" font-family="system-ui, sans-serif" font-size="13" aria-hidden="true">
  <defs>
    <marker id="stv-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6" />
    </marker>
    <marker id="stv-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0b35a" />
    </marker>
  </defs>

  <!-- IDLE (left) -->
  <rect x="30" y="100" width="140" height="80" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 4" />
  <rect x="98" y="116" width="4" height="20" fill="currentColor" fill-opacity="0.75" />
  <text x="100" y="164" text-anchor="middle" font-weight="600" fill="currentColor" fill-opacity="0.85">IDLE</text>

  <!-- PROCESSING (centre) -->
  <rect x="250" y="100" width="140" height="80" rx="12" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <g fill="#006a90">
    <circle cx="304" cy="128" r="5" /><circle cx="320" cy="128" r="5" fill-opacity="0.6" /><circle cx="336" cy="128" r="5" fill-opacity="0.3" />
  </g>
  <text x="320" y="164" text-anchor="middle" font-weight="600" fill="#11171d">PROCESSING</text>

  <!-- idle <-> processing -->
  <line x1="170" y1="128" x2="250" y2="128" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#stv-fg)" />
  <text x="210" y="118" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.8">you type</text>
  <line x1="250" y1="156" x2="170" y2="156" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#stv-fg)" />
  <text x="210" y="176" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.8">turn ends</text>

  <!-- AWAITING PERMISSION (right top): the warm key -->
  <rect x="470" y="20" width="140" height="80" rx="12" fill="#f0b35a" stroke="#11171d" stroke-width="1.5" />
  <text x="540" y="52" text-anchor="middle" font-weight="600" fill="#11171d">AWAITING</text>
  <text x="540" y="72" text-anchor="middle" font-weight="600" fill="#11171d">PERMISSION</text>

  <!-- processing -> permission -->
  <path d="M390 116 L470 68" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#stv-fg)" />
  <text x="418" y="72" font-size="12" fill="currentColor" fill-opacity="0.8">tool call</text>
  <!-- permission -> processing via the deck -->
  <path d="M480 100 Q430 140 392 148" fill="none" stroke="#f0b35a" stroke-width="2" marker-end="url(#stv-warm)" />
  <text x="455" y="150" font-size="12" fill="currentColor" fill-opacity="0.8">Approve / Deny</text>
  <text x="455" y="166" font-size="12" fill="currentColor" fill-opacity="0.8">from the deck</text>

  <!-- AWAITING ELICITATION (right bottom) -->
  <rect x="470" y="200" width="140" height="80" rx="12" fill="#deeef5" stroke="#006a90" stroke-width="1.5" />
  <text x="540" y="232" text-anchor="middle" font-weight="600" fill="#11171d">AWAITING</text>
  <text x="540" y="252" text-anchor="middle" font-weight="600" fill="#11171d">ELICITATION</text>

  <!-- processing -> elicitation -->
  <path d="M390 164 L470 224" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#stv-fg)" />
  <text x="404" y="214" font-size="12" fill="currentColor" fill-opacity="0.8">asks you</text>
  <!-- elicitation -> processing -->
  <path d="M480 280 Q400 300 340 182" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#stv-fg)" />
  <text x="420" y="300" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.8">you answer</text>

  <!-- DISCONNECTED (bottom left) -->
  <rect x="30" y="260" width="140" height="80" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" />
  <line x1="88" y1="286" x2="112" y2="310" stroke="currentColor" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" />
  <line x1="112" y1="286" x2="88" y2="310" stroke="currentColor" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" />
  <text x="100" y="330" text-anchor="middle" font-weight="600" fill="currentColor" fill-opacity="0.6">DISCONNECTED</text>

  <!-- any state -> disconnected -->
  <path d="M250 172 Q200 230 172 288" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#stv-fg)" />
  <text x="190" y="248" font-size="12" fill="currentColor" fill-opacity="0.75">process gone</text>
  <text x="190" y="264" font-size="12" fill="currentColor" fill-opacity="0.75">(from any state)</text>
</svg>
