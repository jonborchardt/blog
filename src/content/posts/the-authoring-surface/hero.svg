<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>A page outline of stacked authoring blocks — callout, tabs, code — with one small island widget marked by a lightning bolt</title>
  <rect width="1500" height="600" fill="#fafcfe" />

  <!-- flank: faded neighbouring pages (non-essential scene continuation) -->
  <g opacity="0.4">
    <!-- left ghost page, bleeding off the edge -->
    <rect x="-120" y="110" width="330" height="400" rx="16" fill="#fafcfe" stroke="#d9dfe3" stroke-width="4" />
    <rect x="-90" y="146" width="180" height="14" rx="7" fill="#d9dfe3" />
    <rect x="-90" y="180" width="260" height="9" rx="4" fill="#d9dfe3" />
    <rect x="-90" y="200" width="230" height="9" rx="4" fill="#d9dfe3" />
    <rect x="-90" y="230" width="260" height="46" rx="9" fill="#deeef5" />
    <rect x="-90" y="300" width="260" height="56" rx="9" fill="#d9dfe3" />

    <!-- left ghost page, fully visible in the flank -->
    <rect x="250" y="110" width="330" height="400" rx="16" fill="#fafcfe" stroke="#d9dfe3" stroke-width="4" />
    <rect x="282" y="146" width="150" height="14" rx="7" fill="#d9dfe3" />
    <rect x="282" y="180" width="266" height="9" rx="4" fill="#d9dfe3" />
    <rect x="282" y="200" width="230" height="9" rx="4" fill="#d9dfe3" />
    <rect x="282" y="230" width="266" height="46" rx="9" fill="#deeef5" />
    <rect x="282" y="300" width="266" height="56" rx="9" fill="#d9dfe3" />
    <rect x="282" y="380" width="200" height="9" rx="4" fill="#d9dfe3" />
    <rect x="282" y="400" width="240" height="9" rx="4" fill="#d9dfe3" />

    <!-- right ghost page -->
    <rect x="920" y="110" width="330" height="400" rx="16" fill="#fafcfe" stroke="#d9dfe3" stroke-width="4" />
    <rect x="952" y="146" width="150" height="14" rx="7" fill="#d9dfe3" />
    <rect x="952" y="180" width="266" height="9" rx="4" fill="#d9dfe3" />
    <rect x="952" y="200" width="230" height="9" rx="4" fill="#d9dfe3" />
    <rect x="952" y="230" width="266" height="70" rx="9" fill="#11171d" opacity="0.25" />
    <rect x="952" y="324" width="266" height="46" rx="9" fill="#deeef5" />
    <rect x="952" y="394" width="200" height="9" rx="4" fill="#d9dfe3" />

    <!-- right ghost page, bleeding off the edge -->
    <rect x="1290" y="110" width="330" height="400" rx="16" fill="#fafcfe" stroke="#d9dfe3" stroke-width="4" />
    <rect x="1322" y="146" width="150" height="14" rx="7" fill="#d9dfe3" />
    <rect x="1322" y="180" width="160" height="9" rx="4" fill="#d9dfe3" />
    <rect x="1322" y="200" width="140" height="9" rx="4" fill="#d9dfe3" />
    <rect x="1322" y="230" width="160" height="46" rx="9" fill="#deeef5" />
  </g>

  <!-- main page outline (essential: centre ~860x540) -->
  <rect x="490" y="45" width="520" height="510" rx="18" fill="#fafcfe" stroke="#d9dfe3" stroke-width="4" />

  <!-- heading + text bars -->
  <rect x="530" y="82" width="230" height="18" rx="9" fill="#555f69" />
  <rect x="530" y="118" width="440" height="10" rx="5" fill="#d9dfe3" />
  <rect x="530" y="138" width="390" height="10" rx="5" fill="#d9dfe3" />

  <!-- callout block -->
  <rect x="530" y="170" width="440" height="58" rx="10" fill="#deeef5" />
  <rect x="530" y="170" width="8" height="58" rx="4" fill="#006a90" />
  <text x="554" y="206" font-family="IBM Plex Sans" font-size="26" font-weight="600" fill="#006a90">Callout</text>

  <!-- tabs block -->
  <rect x="530" y="252" width="96" height="34" rx="8" fill="#006a90" />
  <rect x="634" y="252" width="96" height="34" rx="8" fill="#deeef5" />
  <rect x="738" y="252" width="96" height="34" rx="8" fill="#deeef5" />
  <text x="578" y="276" font-family="IBM Plex Sans" font-size="22" fill="#fafcfe" text-anchor="middle">Tabs</text>
  <rect x="530" y="290" width="440" height="44" rx="8" fill="none" stroke="#d9dfe3" stroke-width="3" />
  <rect x="546" y="306" width="310" height="10" rx="5" fill="#d9dfe3" />

  <!-- code block -->
  <rect x="530" y="358" width="440" height="72" rx="10" fill="#11171d" />
  <rect x="550" y="376" width="180" height="10" rx="5" fill="#deeef5" />
  <rect x="550" y="396" width="270" height="10" rx="5" fill="#555f69" />
  <rect x="570" y="416" width="150" height="10" rx="5" fill="#555f69" />

  <!-- island widget -->
  <rect x="530" y="456" width="236" height="52" rx="10" fill="#fafcfe" stroke="#f0b35a" stroke-width="5" />
  <path d="M570 464 l-16 27 h12 l-8 21 22 -29 h-12 l10 -19 z" fill="#f0b35a" />
  <text x="596" y="491" font-family="IBM Plex Sans" font-size="24" font-weight="600" fill="#555f69">island</text>
</svg>
