<svg xmlns="http://www.w3.org/2000/svg" width="640" height="224" viewBox="0 0 640 224" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="bpv-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
  </defs>

  <!-- rail line -->
  <line x1="40" y1="170" x2="608" y2="170" stroke="currentColor" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
  <line x1="130" y1="170" x2="146" y2="170" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#bpv-fg)"/>
  <line x1="258" y1="170" x2="274" y2="170" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#bpv-fg)"/>
  <line x1="386" y1="170" x2="402" y2="170" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#bpv-fg)"/>
  <line x1="508" y1="170" x2="524" y2="170" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#bpv-fg)"/>
  <text x="265" y="156" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11">ok</text>

  <!-- station 1: MDX source sheet -->
  <rect x="52" y="58" width="56" height="46" rx="4" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <line x1="60" y1="72" x2="98" y2="72" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="82" x2="92" y2="82" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="92" x2="86" y2="92" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="108" x2="80" y2="158" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <circle cx="80" cy="170" r="7" fill="#deeef5" stroke="#006a90" stroke-width="2"/>
  <text x="80" y="198" fill="currentColor" text-anchor="middle" font-weight="600">MDX + frontmatter</text>

  <!-- station 2: validation gate -->
  <line x1="186" y1="170" x2="186" y2="130" stroke="#006a90" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="214" y1="170" x2="214" y2="130" stroke="#006a90" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="182" y1="130" x2="218" y2="130" stroke="#006a90" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="200" cy="170" r="7" fill="#deeef5" stroke="#006a90" stroke-width="2"/>
  <text x="200" y="198" fill="currentColor" text-anchor="middle" font-weight="600">validate</text>

  <!-- error arc back to the source sheet -->
  <path d="M184 124 Q150 62 116 74" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#bpv-fg)"/>
  <text x="152" y="52" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">error</text>

  <!-- station 3: build gear -->
  <circle cx="330" cy="120" r="11" fill="#deeef5" fill-opacity="0.6" stroke="#006a90" stroke-width="2.5"/>
  <line x1="341" y1="120" x2="346" y2="120" stroke="#006a90" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="319" y1="120" x2="314" y2="120" stroke="#006a90" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="330" y1="109" x2="330" y2="104" stroke="#006a90" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="330" y1="131" x2="330" y2="136" stroke="#006a90" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="337.8" y1="112.2" x2="341.3" y2="108.7" stroke="#006a90" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="322.2" y1="112.2" x2="318.7" y2="108.7" stroke="#006a90" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="337.8" y1="127.8" x2="341.3" y2="131.3" stroke="#006a90" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="322.2" y1="127.8" x2="318.7" y2="131.3" stroke="#006a90" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="330" y1="140" x2="330" y2="158" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <circle cx="330" cy="170" r="7" fill="#deeef5" stroke="#006a90" stroke-width="2"/>
  <text x="330" y="198" fill="currentColor" text-anchor="middle" font-weight="600">astro build</text>

  <!-- station 4: test magnifier -->
  <circle cx="452" cy="116" r="13" fill="#deeef5" fill-opacity="0.6" stroke="#006a90" stroke-width="2.5"/>
  <line x1="461" y1="125" x2="470" y2="134" stroke="#006a90" stroke-width="4" stroke-linecap="round"/>
  <line x1="452" y1="133" x2="452" y2="158" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <circle cx="455" cy="170" r="7" fill="#deeef5" stroke="#006a90" stroke-width="2"/>
  <text x="455" y="198" fill="currentColor" text-anchor="middle" font-weight="600">e2e + axe</text>

  <!-- station 5: deployed flag -->
  <line x1="575" y1="162" x2="575" y2="92" stroke="#006a90" stroke-width="3" stroke-linecap="round"/>
  <path d="M577 94 L610 103 L577 112 Z" fill="#f0b35a"/>
  <circle cx="575" cy="170" r="7" fill="#deeef5" stroke="#006a90" stroke-width="2"/>
  <text x="575" y="198" fill="currentColor" text-anchor="middle" font-weight="600">GitHub Pages</text>
</svg>
