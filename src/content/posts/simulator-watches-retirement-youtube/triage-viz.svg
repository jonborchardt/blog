<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="tvz-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
  </defs>

  <!-- transcript sheet -->
  <rect x="240" y="14" width="160" height="76" rx="5" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <text x="320" y="36" fill="#11171d" text-anchor="middle" font-weight="600">claim in transcript</text>
  <line x1="254" y1="52" x2="386" y2="52" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="254" y1="64" x2="370" y2="64" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="254" y1="76" x2="380" y2="76" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

  <!-- slips dropping into the three bins -->
  <path d="M296 98 Q170 118 114 156" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#tvz-fg)"/>
  <path d="M320 98 L320 156" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#tvz-fg)"/>
  <path d="M344 98 Q470 118 526 156" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#tvz-fg)"/>
  <g transform="translate(196,124) rotate(-18)"><rect x="-9" y="-6" width="18" height="12" fill="#fafcfe" stroke="#006a90" stroke-width="1"/><line x1="-5" y1="0" x2="5" y2="0" stroke="#555f69" stroke-opacity="0.6" stroke-width="1.5"/></g>
  <g transform="translate(338,128) rotate(6)"><rect x="-9" y="-6" width="18" height="12" fill="#fafcfe" stroke="#006a90" stroke-width="1"/><line x1="-5" y1="0" x2="5" y2="0" stroke="#555f69" stroke-opacity="0.6" stroke-width="1.5"/></g>
  <g transform="translate(444,124) rotate(18)"><rect x="-9" y="-6" width="18" height="12" fill="#fafcfe" stroke="#006a90" stroke-width="1"/><line x1="-5" y1="0" x2="5" y2="0" stroke="#555f69" stroke-opacity="0.6" stroke-width="1.5"/></g>

  <!-- bin: mechanism -->
  <path d="M15 168 L30 242 L190 242 L205 168" fill="#deeef5" stroke="#006a90" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="110" y="194" fill="#11171d" text-anchor="middle" font-weight="600">mechanism</text>
  <text x="110" y="212" fill="#11171d" text-anchor="middle" font-size="12">allocation, glide path,</text>
  <text x="110" y="228" fill="#11171d" text-anchor="middle" font-size="12">withdrawal rule, timing</text>

  <!-- bin: assumption -->
  <path d="M225 168 L240 242 L400 242 L415 168" fill="#deeef5" stroke="#006a90" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="320" y="200" fill="#11171d" text-anchor="middle" font-weight="600">assumption</text>
  <text x="320" y="222" fill="#11171d" text-anchor="middle" font-size="12">8% returns, 4% is safe</text>

  <!-- bin: framing -->
  <path d="M435 168 L450 242 L610 242 L625 168" fill="#deeef5" stroke="#006a90" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="530" y="194" fill="#11171d" text-anchor="middle" font-weight="600">framing / behavioral</text>
  <text x="530" y="212" fill="#11171d" text-anchor="middle" font-size="12">buckets,</text>
  <text x="530" y="228" fill="#11171d" text-anchor="middle" font-size="12">permission to spend</text>

  <!-- mechanism bin feeds the machine -->
  <line x1="110" y1="248" x2="110" y2="266" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#tvz-fg)"/>
  <rect x="15" y="270" width="190" height="44" rx="4" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <circle cx="37" cy="292" r="9" fill="none" stroke="#006a90" stroke-width="1.5"/>
  <line x1="37" y1="292" x2="42" y2="286" stroke="#006a90" stroke-width="1.5" stroke-linecap="round"/>
  <text x="126" y="296" fill="#11171d" text-anchor="middle" font-size="12" font-weight="600">engine can express it?</text>

  <!-- assumption: magnifier over history, sun flag -->
  <line x1="320" y1="248" x2="320" y2="266" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#tvz-fg)"/>
  <line x1="245" y1="300" x2="395" y2="300" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="262" cy="300" r="3.5" fill="currentColor" fill-opacity="0.4"/>
  <circle cx="330" cy="300" r="3.5" fill="currentColor" fill-opacity="0.4"/>
  <circle cx="362" cy="300" r="3.5" fill="currentColor" fill-opacity="0.4"/>
  <circle cx="296" cy="298" r="17" fill="#deeef5" fill-opacity="0.6" stroke="#006a90" stroke-width="2.5"/>
  <line x1="308" y1="310" x2="319" y2="321" stroke="#006a90" stroke-width="4" stroke-linecap="round"/>
  <circle cx="388" cy="272" r="6" fill="none" stroke="#f0b35a" stroke-width="2"/>
  <line x1="388" y1="262" x2="388" y2="258" stroke="#f0b35a" stroke-width="2" stroke-linecap="round"/>
  <line x1="388" y1="286" x2="388" y2="282" stroke="#f0b35a" stroke-width="2" stroke-linecap="round"/>
  <line x1="378" y1="272" x2="374" y2="272" stroke="#f0b35a" stroke-width="2" stroke-linecap="round"/>
  <line x1="402" y1="272" x2="398" y2="272" stroke="#f0b35a" stroke-width="2" stroke-linecap="round"/>
  <line x1="381" y1="265" x2="378" y2="262" stroke="#f0b35a" stroke-width="2" stroke-linecap="round"/>
  <line x1="395" y1="279" x2="398" y2="282" stroke="#f0b35a" stroke-width="2" stroke-linecap="round"/>
  <line x1="395" y1="265" x2="398" y2="262" stroke="#f0b35a" stroke-width="2" stroke-linecap="round"/>
  <line x1="381" y1="279" x2="378" y2="282" stroke="#f0b35a" stroke-width="2" stroke-linecap="round"/>
  <text x="320" y="344" fill="currentColor" text-anchor="middle" font-size="12">fact-check against history,</text>
  <text x="320" y="360" fill="currentColor" text-anchor="middle" font-size="12">flag when sunny</text>

  <!-- framing: name tag -->
  <line x1="530" y1="248" x2="530" y2="266" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#tvz-fg)"/>
  <path d="M450 272 L595 272 L613 297 L595 322 L450 322 Z" fill="#deeef5" stroke="#006a90" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="598" cy="297" r="3.5" fill="none" stroke="#006a90" stroke-width="1.5"/>
  <text x="522" y="294" fill="#11171d" text-anchor="middle" font-size="12">name the mechanism</text>
  <text x="522" y="310" fill="#11171d" text-anchor="middle" font-size="12">it is a proxy for</text>

  <!-- machine outputs -->
  <path d="M110 314 V520" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="110" y1="402" x2="240" y2="402" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#tvz-fg)"/>
  <text x="124" y="394" fill="currentColor" fill-opacity="0.75" font-size="12">yes</text>
  <rect x="250" y="384" width="150" height="10" rx="2" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <rect x="250" y="400" width="150" height="10" rx="2" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <rect x="250" y="416" width="150" height="10" rx="2" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="420" y="410" fill="currentColor" font-weight="600">experiment rows</text>

  <line x1="110" y1="460" x2="240" y2="460" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#tvz-fg)"/>
  <text x="124" y="452" fill="currentColor" fill-opacity="0.75" font-size="12">nearest primitive</text>
  <rect x="250" y="446" width="150" height="10" rx="2" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <rect x="250" y="462" width="150" height="10" rx="2" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <rect x="410" y="444" width="22" height="28" rx="2" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <line x1="415" y1="453" x2="427" y2="453" stroke="#555f69" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="415" y1="461" x2="424" y2="461" stroke="#555f69" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="445" y="464" fill="currentColor" font-weight="600">rows + caveat in notes</text>

  <line x1="110" y1="520" x2="240" y2="520" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#tvz-fg)"/>
  <text x="124" y="512" fill="currentColor" fill-opacity="0.75" font-size="12">gap is decisive</text>
  <circle cx="270" cy="520" r="18" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="270" y="526" fill="currentColor" text-anchor="middle" font-size="16" font-weight="600">?</text>
  <text x="300" y="525" fill="currentColor" font-weight="600">open question, not a fake verdict</text>
</svg>
