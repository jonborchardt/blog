  <path d="M412 628 Q634 570 634 380 V200 Q634 128 432 129" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pvz-fg)"/>
