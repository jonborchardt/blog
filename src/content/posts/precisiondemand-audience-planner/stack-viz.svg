<svg xmlns="http://www.w3.org/2000/svg" width="640" height="262" viewBox="0 0 640 262" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="stkv-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
  </defs>

  <!-- browser window with the plug-in surface -->
  <rect x="30" y="60" width="170" height="110" rx="6" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <line x1="30" y1="80" x2="200" y2="80" stroke="#006a90" stroke-opacity="0.5" stroke-width="1.5"/>
  <g fill="#555f69" fill-opacity="0.4">
    <circle cx="44" cy="70" r="3"/>
    <circle cx="56" cy="70" r="3"/>
    <circle cx="68" cy="70" r="3"/>
  </g>
  <rect x="60" y="95" width="110" height="58" rx="4" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="115" y="120" fill="#11171d" font-size="12" font-weight="600" text-anchor="middle">.xap</text>
  <text x="115" y="138" fill="#555f69" font-size="11" text-anchor="middle">Silverlight</text>
  <text x="115" y="192" fill="currentColor" fill-opacity="0.85" font-size="12" text-anchor="middle">browser plug-in</text>

  <path d="M205 124 L246 124" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#stkv-fg)"/>
  <text x="227" y="115" fill="currentColor" fill-opacity="0.75" font-size="11" text-anchor="middle">HTTP</text>

  <!-- the one piece of server code -->
  <rect x="255" y="95" width="130" height="58" rx="6" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="320" y="119" fill="#11171d" font-size="12" font-weight="600" text-anchor="middle">DalService.svc</text>
  <text x="320" y="137" fill="#555f69" font-size="11" text-anchor="middle">WCF service</text>
  <text x="320" y="192" fill="currentColor" fill-opacity="0.85" font-size="12" text-anchor="middle">the only server code</text>

  <path d="M390 124 L426 124" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#stkv-fg)"/>
  <text x="409" y="115" fill="currentColor" fill-opacity="0.75" font-size="11" text-anchor="middle">SQL</text>
  <line x1="430" y1="95" x2="430" y2="155" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="430" y1="95" x2="440" y2="95" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="430" y1="155" x2="440" y2="155" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- two databases -->
  <path d="M440 78 v34 a55 9 0 0 0 110 0 v-34 z" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <ellipse cx="495" cy="78" rx="55" ry="9" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="495" y="101" fill="#11171d" font-size="12" font-weight="600" text-anchor="middle">Demographics</text>

  <path d="M440 138 v34 a55 9 0 0 0 110 0 v-34 z" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <ellipse cx="495" cy="138" rx="55" ry="9" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="495" y="161" fill="#11171d" font-size="12" font-weight="600" text-anchor="middle">Acxiom</text>

  <text x="495" y="196" fill="currentColor" fill-opacity="0.85" font-size="12" text-anchor="middle">a SQL server named baker</text>

  <!-- one warm accent: none of it runs -->
  <path d="M30 212 L30 224 L610 224 L610 212" fill="none" stroke="#f0b35a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="320" y="244" fill="currentColor" fill-opacity="0.85" font-size="12" text-anchor="middle">no browser ships Silverlight, and baker is long gone</text>
</svg>
