<svg xmlns="http://www.w3.org/2000/svg" width="640" height="348" viewBox="0 0 640 348" font-family="system-ui, sans-serif" font-size="13">
  <text x="10" y="20" font-size="12" fill="currentColor" fill-opacity="0.75">HUMAN ABOVE, ALIEN BELOW</text>

  <!-- axis at y=170 ; one scale both sides: about 0.93 px per gain unit -->
  <line x1="30" y1="170" x2="630" y2="170" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" />

  <!-- 8 slots of 72px from x=40 -->
  <g fill="#deeef5" stroke="#006a90" stroke-width="1.5">
    <rect x="46" y="170" width="46" height="0.5" />
    <rect x="118" y="170" width="46" height="0.5" />
    <rect x="190" y="150" width="46" height="20" />
    <rect x="262" y="108" width="46" height="62" />
    <rect x="334" y="163" width="46" height="7" />
    <rect x="406" y="112" width="46" height="58" />
    <rect x="478" y="50" width="46" height="120" />
    <rect x="550" y="167" width="46" height="3" />
  </g>

  <g fill="#f0b35a" stroke="#11171d" stroke-width="1">
    <rect x="118" y="170" width="46" height="8" />
    <rect x="190" y="170" width="46" height="8" />
    <rect x="262" y="170" width="46" height="21" />
    <rect x="334" y="170" width="46" height="19" />
    <rect x="406" y="170" width="46" height="5" />
    <rect x="478" y="170" width="46" height="49" />
    <rect x="550" y="170" width="46" height="6" />
  </g>

  <!-- values -->
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="213" y="144">22.1</text>
    <text x="285" y="102">66.9</text>
    <text x="429" y="106">63.2</text>
    <text x="501" y="44">129.2</text>
  </g>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="141" y="195">8.4</text>
    <text x="285" y="215">22.3</text>
    <text x="357" y="212">20.2</text>
    <text x="501" y="261">53.0</text>
    <text x="573" y="192">6.8</text>
  </g>

  <!-- annotations for the three turns -->
  <text x="141" y="232" font-size="11" text-anchor="middle" fill="currentColor">alien alone</text>
  <text x="357" y="232" font-size="11" text-anchor="middle" fill="currentColor">alien wins</text>
  <text x="429" y="146" font-size="11" text-anchor="middle" fill="currentColor">human wins</text>
  <text x="573" y="212" font-size="11" text-anchor="middle" fill="currentColor">last word</text>

  <!-- section names -->
  <g font-size="11" fill="currentColor" text-anchor="end">
    <text transform="translate(75,282) rotate(-40)">void</text>
    <text transform="translate(147,282) rotate(-40)">signal</text>
    <text transform="translate(219,282) rotate(-40)">approach</text>
    <text transform="translate(291,282) rotate(-40)">contact</text>
    <text transform="translate(363,282) rotate(-40)">will</text>
    <text transform="translate(435,282) rotate(-40)">plea</text>
    <text transform="translate(507,282) rotate(-40)">threshold</text>
    <text transform="translate(579,282) rotate(-40)">after</text>
  </g>

  <text x="10" y="340" font-size="11" fill="currentColor" fill-opacity="0.75">summed per-event gain, a balance measure rather than loudness</text>
</svg>
