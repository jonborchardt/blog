<svg xmlns="http://www.w3.org/2000/svg" width="640" height="716" viewBox="0 0 640 716" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="auviz-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
  </defs>

  <!-- two repo folders -->
  <rect x="95" y="26" width="36" height="14" rx="3" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <rect x="95" y="34" width="90" height="54" rx="5" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="140" y="108" fill="currentColor" text-anchor="middle" font-weight="600">Blog repo</text>
  <rect x="455" y="26" width="36" height="14" rx="3" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <rect x="455" y="34" width="90" height="54" rx="5" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="500" y="108" fill="currentColor" text-anchor="middle" font-weight="600">Authority repo</text>

  <!-- faint plumb lines under each repo -->
  <line x1="140" y1="118" x2="140" y2="652" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="2 4"/>
  <line x1="500" y1="118" x2="500" y2="640" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="2 4"/>

  <!-- 1: outline flies to the authority -->
  <text x="320" y="146" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">author outline (call 1 of 2)</text>
  <path d="M152 172 Q320 154 484 168" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#auviz-fg)"/>

  <!-- 2: authority investigates (magnifier) -->
  <circle cx="552" cy="224" r="16" fill="#deeef5" fill-opacity="0.6" stroke="#006a90" stroke-width="2"/>
  <line x1="563" y1="236" x2="576" y2="250" stroke="#006a90" stroke-width="4" stroke-linecap="round"/>
  <text x="528" y="228" fill="currentColor" fill-opacity="0.85" text-anchor="end" font-size="12" font-style="italic">investigate source, tests, docs</text>

  <!-- 3: the brief flies back as a real document -->
  <text x="320" y="292" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">domain brief → research/brief.md</text>
  <rect x="304" y="302" width="32" height="40" rx="3" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <line x1="310" y1="312" x2="330" y2="312" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="310" y1="320" x2="326" y2="320" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="310" y1="328" x2="330" y2="328" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="310" y1="336" x2="322" y2="336" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <path d="M488 360 Q320 342 158 356" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#auviz-fg)"/>

  <!-- 4: blog writes from the brief (pencil on sheet) -->
  <rect x="96" y="400" width="34" height="42" rx="3" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <line x1="103" y1="412" x2="123" y2="412" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="103" y1="421" x2="119" y2="421" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="103" y1="430" x2="121" y2="430" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="136" y1="432" x2="160" y2="406" stroke="#006a90" stroke-width="5"/>
  <path d="M128 440 L138 436 L131 429 z" fill="#f0b35a"/>
  <text x="176" y="424" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">write prose, visuals, hero — from the brief</text>

  <!-- 5: the finished draft flies out -->
  <text x="320" y="488" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">finished draft (call 2 of 2)</text>
  <rect x="304" y="498" width="32" height="40" rx="3" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <line x1="310" y1="508" x2="330" y2="508" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="310" y1="516" x2="326" y2="516" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="310" y1="524" x2="330" y2="524" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="310" y1="532" x2="322" y2="532" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <path d="M152 556 Q320 538 484 552" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#auviz-fg)"/>

  <!-- 6: verdict comes back -->
  <text x="320" y="600" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">confirm or correct, with evidence</text>
  <path d="M488 626 Q320 608 158 622" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#auviz-fg)"/>

  <!-- 7: blog fixes and publishes (seal) -->
  <circle cx="140" cy="678" r="17" fill="#deeef5" stroke="#006a90" stroke-width="2"/>
  <path d="M132 678 L138 685 L149 671" fill="none" stroke="#11171d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="176" y="682" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">fix findings, publish</text>
</svg>
