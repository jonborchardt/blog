<svg xmlns="http://www.w3.org/2000/svg" width="640" height="610" viewBox="0 0 640 610" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="plviz-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
  </defs>

  <!-- the draft: a sheet being written -->
  <rect x="250" y="24" width="140" height="96" rx="5" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <line x1="264" y1="46" x2="356" y2="46" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="264" y1="62" x2="372" y2="62" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="264" y1="78" x2="340" y2="78" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="264" y1="94" x2="330" y2="94" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="368" y1="100" x2="398" y2="64" stroke="#006a90" stroke-width="6"/>
  <path d="M358 110 L372 106 L363 96 z" fill="#f0b35a"/>
  <text x="320" y="142" fill="currentColor" text-anchor="middle" font-weight="600">write-post</text>
  <text x="320" y="159" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">scaffold · expert brief · prose</text>

  <!-- the sheet yields two artifacts -->
  <path d="M250 106 Q170 140 146 184" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#plviz-fg)"/>
  <path d="M390 106 Q470 140 496 182" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#plviz-fg)"/>

  <!-- create-visual: a little chart -->
  <path d="M116 194 V246 H186" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="128" y="222" width="12" height="24" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <rect x="146" y="206" width="12" height="40" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <rect x="164" y="214" width="12" height="32" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="150" y="272" fill="currentColor" text-anchor="middle" font-weight="600">create-visual</text>
  <text x="150" y="289" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">mandatory visual pass</text>

  <!-- create-hero: a framed picture -->
  <rect x="446" y="190" width="108" height="58" rx="4" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <circle cx="472" cy="208" r="7" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <path d="M450 246 L484 214 L502 232 L520 208 L550 246 Z" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="500" y="272" fill="currentColor" text-anchor="middle" font-weight="600">create-hero</text>
  <text x="500" y="289" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">hand-drawn SVG → PNG</text>

  <!-- review-post: a magnifier examines both -->
  <line x1="200" y1="262" x2="300" y2="338" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <line x1="440" y1="262" x2="340" y2="338" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <circle cx="320" cy="360" r="30" fill="#deeef5" fill-opacity="0.6" stroke="#006a90" stroke-width="2.5"/>
  <line x1="342" y1="382" x2="362" y2="402" stroke="#006a90" stroke-width="5" stroke-linecap="round"/>
  <text x="320" y="430" fill="currentColor" text-anchor="middle" font-weight="600">review-post</text>
  <text x="320" y="447" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">gates + expert validation</text>

  <!-- findings loop back to the sheet -->
  <path d="M288 360 C150 400 20 340 20 210 C20 100 100 60 244 62" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#plviz-fg)"/>
  <text x="36" y="176" fill="currentColor" fill-opacity="0.75" font-size="12">findings</text>

  <!-- clean: on to the seal -->
  <line x1="320" y1="458" x2="320" y2="486" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#plviz-fg)"/>
  <text x="332" y="478" fill="currentColor" fill-opacity="0.75" font-size="12">clean</text>

  <!-- publish-post: the approval seal -->
  <circle cx="320" cy="520" r="26" fill="#deeef5" stroke="#006a90" stroke-width="2.5"/>
  <circle cx="320" cy="520" r="19" fill="none" stroke="#006a90" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M308 520 L317 530 L334 509" fill="none" stroke="#11171d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="574" fill="currentColor" text-anchor="middle" font-weight="600">publish-post</text>
  <text x="320" y="591" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">draft: false · push · verify live</text>
</svg>
