<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Two repository boxes exchanging a document labelled brief, with a chain of stamped gates below them</title>
  <rect width="1200" height="630" fill="#fafcfe" />

  <!-- blog repo box -->
  <rect x="150" y="130" width="280" height="210" rx="16" fill="#deeef5" stroke="#d9dfe3" stroke-width="4" />
  <text x="290" y="250" font-family="IBM Plex Sans" font-size="64" font-weight="600" fill="#006a90" text-anchor="middle">&lt;/&gt;</text>
  <text x="290" y="308" font-family="IBM Plex Sans" font-size="28" fill="#555f69" text-anchor="middle">blog</text>

  <!-- expert repo box -->
  <rect x="770" y="130" width="280" height="210" rx="16" fill="#deeef5" stroke="#d9dfe3" stroke-width="4" />
  <!-- magnifier -->
  <circle cx="900" cy="212" r="36" fill="none" stroke="#006a90" stroke-width="10" />
  <line x1="926" y1="238" x2="956" y2="268" stroke="#006a90" stroke-width="10" stroke-linecap="round" />
  <text x="910" y="308" font-family="IBM Plex Sans" font-size="28" fill="#555f69" text-anchor="middle">expert</text>

  <!-- arrows between them -->
  <line x1="750" y1="196" x2="480" y2="196" stroke="#006a90" stroke-width="7" stroke-linecap="round" />
  <path d="M480 196 l26 -13 v26 z" fill="#006a90" />
  <line x1="450" y1="286" x2="720" y2="286" stroke="#555f69" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14" />
  <path d="M720 286 l24 -12 v24 z" fill="#555f69" />

  <!-- the brief document, riding the top arrow -->
  <g>
    <rect x="548" y="120" width="104" height="132" rx="8" fill="#fafcfe" stroke="#d9dfe3" stroke-width="4" />
    <rect x="564" y="140" width="72" height="8" rx="4" fill="#555f69" />
    <rect x="564" y="158" width="60" height="8" rx="4" fill="#d9dfe3" />
    <rect x="564" y="176" width="68" height="8" rx="4" fill="#d9dfe3" />
    <rect x="564" y="194" width="52" height="8" rx="4" fill="#d9dfe3" />
    <circle cx="624" cy="226" r="14" fill="#f0b35a" />
    <text x="686" y="176" font-family="IBM Plex Sans" font-size="26" font-weight="600" fill="#11171d">brief</text>
  </g>

  <!-- gate chain below -->
  <line x1="290" y1="470" x2="910" y2="470" stroke="#d9dfe3" stroke-width="5" />
  <g>
    <circle cx="360" cy="470" r="26" fill="#fafcfe" stroke="#006a90" stroke-width="6" />
    <path d="M348 470 l9 9 l16 -18" fill="none" stroke="#006a90" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="530" cy="470" r="26" fill="#fafcfe" stroke="#006a90" stroke-width="6" />
    <path d="M518 470 l9 9 l16 -18" fill="none" stroke="#006a90" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="700" cy="470" r="26" fill="#fafcfe" stroke="#006a90" stroke-width="6" />
    <path d="M688 470 l9 9 l16 -18" fill="none" stroke="#006a90" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="870" cy="470" r="26" fill="#fafcfe" stroke="#f0b35a" stroke-width="6" />
    <path d="M858 470 l9 9 l16 -18" fill="none" stroke="#f0b35a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
