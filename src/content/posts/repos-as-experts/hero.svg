<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>Two repository boxes exchanging a document labelled brief, with a chain of stamped gates below them</title>
  <rect width="1500" height="600" fill="#fafcfe" />

  <!-- flank continuation: ghost repo boxes suggesting a row of repos (non-essential) -->
  <rect x="55" y="130" width="220" height="180" rx="16" fill="none" stroke="#d9dfe3" stroke-width="4" />
  <rect x="1225" y="130" width="220" height="180" rx="16" fill="none" stroke="#d9dfe3" stroke-width="4" />
  <line x1="285" y1="200" x2="330" y2="200" stroke="#d9dfe3" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14" />
  <line x1="1170" y1="200" x2="1215" y2="200" stroke="#d9dfe3" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14" />

  <!-- blog repo box -->
  <rect x="340" y="110" width="260" height="200" rx="16" fill="#deeef5" stroke="#d9dfe3" stroke-width="4" />
  <text x="470" y="225" font-family="IBM Plex Sans" font-size="60" font-weight="600" fill="#006a90" text-anchor="middle">&lt;/&gt;</text>
  <text x="470" y="282" font-family="IBM Plex Sans" font-size="28" fill="#555f69" text-anchor="middle">blog</text>

  <!-- expert repo box -->
  <rect x="900" y="110" width="260" height="200" rx="16" fill="#deeef5" stroke="#d9dfe3" stroke-width="4" />
  <circle cx="1022" cy="188" r="34" fill="none" stroke="#006a90" stroke-width="10" />
  <line x1="1046" y1="212" x2="1074" y2="240" stroke="#006a90" stroke-width="10" stroke-linecap="round" />
  <text x="1030" y="282" font-family="IBM Plex Sans" font-size="28" fill="#555f69" text-anchor="middle">expert</text>

  <!-- arrows between them -->
  <line x1="880" y1="180" x2="630" y2="180" stroke="#006a90" stroke-width="7" stroke-linecap="round" />
  <path d="M630 180 l26 -13 v26 z" fill="#006a90" />
  <line x1="620" y1="262" x2="856" y2="262" stroke="#555f69" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14" />
  <path d="M880 262 l-24 -12 v24 z" fill="#555f69" />

  <!-- the brief document, riding the top arrow -->
  <g>
    <rect x="700" y="88" width="100" height="128" rx="8" fill="#fafcfe" stroke="#d9dfe3" stroke-width="4" />
    <rect x="715" y="107" width="70" height="8" rx="4" fill="#555f69" />
    <rect x="715" y="125" width="58" height="8" rx="4" fill="#d9dfe3" />
    <rect x="715" y="143" width="66" height="8" rx="4" fill="#d9dfe3" />
    <rect x="715" y="161" width="50" height="8" rx="4" fill="#d9dfe3" />
    <circle cx="774" cy="192" r="13" fill="#f0b35a" />
    <text x="750" y="252" font-family="IBM Plex Sans" font-size="26" font-weight="600" fill="#11171d" text-anchor="middle">brief</text>
  </g>

  <!-- gate chain: rail continues into the flanks, checks stay in the centre -->
  <line x1="110" y1="470" x2="1390" y2="470" stroke="#d9dfe3" stroke-width="5" />
  <circle cx="185" cy="470" r="22" fill="#fafcfe" stroke="#d9dfe3" stroke-width="5" />
  <circle cx="1315" cy="470" r="22" fill="#fafcfe" stroke="#d9dfe3" stroke-width="5" />
  <g>
    <circle cx="450" cy="470" r="26" fill="#fafcfe" stroke="#006a90" stroke-width="6" />
    <path d="M438 470 l9 9 l16 -18" fill="none" stroke="#006a90" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="650" cy="470" r="26" fill="#fafcfe" stroke="#006a90" stroke-width="6" />
    <path d="M638 470 l9 9 l16 -18" fill="none" stroke="#006a90" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="850" cy="470" r="26" fill="#fafcfe" stroke="#006a90" stroke-width="6" />
    <path d="M838 470 l9 9 l16 -18" fill="none" stroke="#006a90" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="1050" cy="470" r="26" fill="#fafcfe" stroke="#f0b35a" stroke-width="6" />
    <path d="M1038 470 l9 9 l16 -18" fill="none" stroke="#f0b35a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
