<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Labelled building blocks — Callout, Figure, Tabs, Steps, Code, Quote — stacked into the outline of a web page</title>
  <rect width="1200" height="630" fill="#fafcfe"/>
  <!-- page outline -->
  <rect x="330" y="85" width="540" height="470" rx="14" fill="#ffffff" stroke="#11171d" stroke-width="4"/>
  <rect x="330" y="85" width="540" height="46" rx="14" fill="#11171d"/>
  <circle cx="358" cy="108" r="7" fill="#fafcfe"/><circle cx="382" cy="108" r="7" fill="#fafcfe"/><circle cx="406" cy="108" r="7" fill="#fafcfe"/>
  <!-- prose lines -->
  <g fill="#deeef5">
    <rect x="365" y="160" width="330" height="12" rx="6"/>
    <rect x="365" y="184" width="470" height="12" rx="6"/>
    <rect x="365" y="470" width="470" height="12" rx="6"/>
    <rect x="365" y="494" width="380" height="12" rx="6"/>
  </g>
  <!-- blocks stacked inside the page -->
  <g font-family="IBM Plex Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="365" y="215" width="225" height="70" rx="8" fill="#006a90"/><text x="477" y="258">Callout</text>
    <rect x="610" y="215" width="225" height="70" rx="8" fill="#006a90"/><text x="722" y="258">Figure</text>
    <rect x="365" y="300" width="145" height="70" rx="8" fill="#006a90"/><text x="437" y="343">Tabs</text>
    <rect x="530" y="300" width="145" height="70" rx="8" fill="#006a90"/><text x="602" y="343">Steps</text>
    <rect x="695" y="300" width="140" height="70" rx="8" fill="#006a90"/><text x="765" y="343">Quote</text>
    <rect x="365" y="385" width="470" height="70" rx="8" fill="#11171d"/><text x="600" y="428" font-family="IBM Plex Sans" font-weight="400" fill="#f0b35a">&lt;code /&gt;</text>
  </g>
  <!-- loose blocks outside, being lifted in -->
  <g font-family="IBM Plex Sans" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="120" y="250" width="150" height="62" rx="8" fill="#f0b35a"/><text x="195" y="289" fill="#11171d">Aside</text>
    <rect x="930" y="330" width="160" height="62" rx="8" fill="#f0b35a"/><text x="1010" y="369" fill="#11171d">Details</text>
  </g>
  <path d="M275 281 L322 281" stroke="#11171d" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <path d="M925 361 L878 361" stroke="#11171d" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#11171d"/></marker></defs>
</svg>
