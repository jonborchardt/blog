<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow-seal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <pattern id="grid6" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M15 0 L0 0 0 15" fill="none" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Left panel: the native condition -->
  <text x="160" y="24" fill="currentColor" text-anchor="middle" font-weight="600">Native resolution: the condition</text>
  <text x="160" y="42" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">a fill–fill diagonal flanked by</text>
  <text x="160" y="58" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">two different line commands</text>
  <g transform="translate(70 78)">
    <rect x="0" y="0" width="90" height="90" fill="#006a90"/>
    <rect x="90" y="90" width="90" height="90" fill="#f0b35a"/>
    <rect x="90" y="0" width="90" height="90" fill="#deeef5" stroke="currentColor" stroke-opacity="0.3"/>
    <rect x="0" y="90" width="90" height="90" fill="#deeef5" stroke="currentColor" stroke-opacity="0.3"/>
    <text x="45" y="50" fill="#fafcfe" text-anchor="middle" font-weight="600">line A</text>
    <text x="135" y="140" fill="#11171d" text-anchor="middle" font-weight="600">line B</text>
    <text x="135" y="50" fill="#11171d" text-anchor="middle">fill</text>
    <text x="45" y="140" fill="#11171d" text-anchor="middle">fill</text>
    <!-- the diagonal being tested -->
    <line x1="150" y1="30" x2="30" y2="150" stroke="#11171d" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
  <text x="160" y="278" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">A ≠ B: this junction gets sealed</text>

  <line x1="320" y1="20" x2="320" y2="280" stroke="currentColor" stroke-opacity="0.2"/>

  <!-- Right panel: the same four cells at 6x, one pixel planted -->
  <text x="480" y="24" fill="currentColor" text-anchor="middle" font-weight="600">Same cells at 6×: the seal</text>
  <text x="480" y="42" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">one pixel at the junction corner,</text>
  <text x="480" y="58" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">planted before the fill runs</text>
  <g transform="translate(390 78)">
    <rect x="0" y="0" width="90" height="90" fill="#006a90"/>
    <rect x="90" y="90" width="90" height="90" fill="#f0b35a"/>
    <rect x="90" y="0" width="90" height="90" fill="#deeef5"/>
    <rect x="0" y="90" width="90" height="90" fill="#deeef5"/>
    <!-- 6x6 pixel grid inside each native cell -->
    <rect x="0" y="0" width="180" height="180" fill="url(#grid6)"/>
    <!-- the planted seal pixel: the fill cell's corner pixel touching the junction -->
    <rect x="90" y="75" width="15" height="15" fill="#11171d"/>
    <path d="M186 116 L108 86" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow-seal)"/>
  </g>
  <text x="636" y="212" fill="currentColor" font-size="12" text-anchor="end">seal pixel</text>
  <text x="480" y="278" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">a few dozen pixels per PIC, all told</text>
</svg>
