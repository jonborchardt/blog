<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>Two pixel-art staircase lines from different draw commands meeting at a corner over a fill region, with a single dark seal pixel planted at the junction and a 6-by-6 grid showing the upscale</title>
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#d9dfe3" stroke-width="1.5"/>
    </pattern>
    <pattern id="G" width="180" height="180" patternUnits="userSpaceOnUse">
      <path d="M180 0H0V180" fill="none" stroke="#11171d" stroke-opacity="0.18" stroke-width="2"/>
    </pattern>
  </defs>
  <!-- the whole canvas is the 6x upscaled fill region -->
  <rect width="1500" height="600" fill="#deeef5"/>
  <!-- line A: thick staircase band from the top-left flank descending to the junction (primary) -->
  <g fill="#006a90">
    <rect x="-60" y="0" width="90" height="60"/>
    <rect x="30" y="30" width="90" height="60"/>
    <rect x="120" y="60" width="90" height="60"/>
    <rect x="210" y="90" width="90" height="60"/>
    <rect x="300" y="120" width="90" height="60"/>
    <rect x="390" y="150" width="90" height="60"/>
    <rect x="480" y="180" width="90" height="60"/>
    <rect x="570" y="210" width="90" height="60"/>
    <rect x="660" y="240" width="90" height="60"/>
  </g>
  <!-- line B: thick staircase band from the junction going down-right (highlight) -->
  <g fill="#f0b35a">
    <rect x="780" y="330" width="60" height="60"/>
    <rect x="840" y="390" width="60" height="60"/>
    <rect x="900" y="450" width="60" height="60"/>
    <rect x="960" y="510" width="60" height="60"/>
    <rect x="1020" y="570" width="60" height="60"/>
  </g>
  <!-- right-flank echo: another line's staircase, faint, scene continuation -->
  <g fill="#006a90" fill-opacity="0.18">
    <rect x="1260" y="60" width="90" height="60"/>
    <rect x="1350" y="90" width="90" height="60"/>
    <rect x="1440" y="120" width="90" height="60"/>
  </g>
  <!-- 6x pixel grid over everything, heavier native-cell boundaries every 6 cells -->
  <rect width="1500" height="600" fill="url(#g)"/>
  <rect width="1500" height="600" fill="url(#G)"/>
  <!-- the seal pixel at the junction corner -->
  <rect x="750" y="300" width="30" height="30" fill="#11171d"/>
  <!-- fill seeds on each side of the boundary -->
  <circle cx="990" cy="150" r="10" fill="#555f69"/>
  <circle cx="630" cy="480" r="10" fill="#555f69"/>
  <!-- native 2x2 inset panel: the condition before the upscale -->
  <g transform="translate(380 375)">
    <rect x="-18" y="-18" width="176" height="176" fill="#fafcfe" stroke="#d9dfe3" stroke-width="2"/>
    <rect x="0" y="0" width="70" height="70" fill="#006a90"/>
    <rect x="70" y="70" width="70" height="70" fill="#f0b35a"/>
    <rect x="70" y="0" width="70" height="70" fill="#deeef5" stroke="#d9dfe3" stroke-width="2"/>
    <rect x="0" y="70" width="70" height="70" fill="#deeef5" stroke="#d9dfe3" stroke-width="2"/>
    <line x1="118" y1="22" x2="22" y2="118" stroke="#11171d" stroke-width="4" stroke-dasharray="10 8"/>
  </g>
  <!-- arrow: native -> 6x -->
  <path d="M572 445 L642 445" stroke="#555f69" stroke-width="4" fill="none"/>
  <path d="M634 433 L654 445 L634 457 Z" fill="#555f69"/>
  <text x="612" y="425" font-family="IBM Plex Sans" font-size="26" fill="#555f69" text-anchor="middle">6×</text>
</svg>
