<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="atv-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
  </defs>

  <!-- Claude -->
  <circle cx="320" cy="40" r="18" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="320" y="45" fill="#11171d" text-anchor="middle" font-size="12" font-weight="600">&gt;_</text>
  <text x="346" y="45" fill="currentColor" font-weight="600">Claude</text>

  <!-- commands fan out toward the three gates -->
  <line x1="320" y1="60" x2="320" y2="182" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#atv-fg)"/>
  <path d="M70 100 H470" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="70" y1="100" x2="70" y2="182" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#atv-fg)"/>
  <line x1="470" y1="100" x2="470" y2="182" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#atv-fg)"/>

  <text x="80" y="120" fill="currentColor" fill-opacity="0.75" font-size="12">install / launch / stop /</text>
  <text x="80" y="136" fill="currentColor" fill-opacity="0.75" font-size="12">uninstall of this package</text>
  <text x="80" y="152" fill="currentColor" fill-opacity="0.75" font-size="12">+ devices, logcat</text>

  <text x="330" y="120" fill="currentColor" fill-opacity="0.75" font-size="12">shell, pull,</text>
  <text x="330" y="136" fill="currentColor" fill-opacity="0.75" font-size="12">other packages,</text>
  <text x="330" y="152" fill="currentColor" fill-opacity="0.75" font-size="12">pair/connect, ...</text>

  <text x="482" y="120" fill="currentColor" fill-opacity="0.75" font-size="12">reboot, root, sideload,</text>
  <text x="482" y="136" fill="currentColor" fill-opacity="0.75" font-size="12">push, shell rm, settings,</text>
  <text x="482" y="152" fill="currentColor" fill-opacity="0.75" font-size="12">reading the API-key file</text>

  <!-- the wall: three gates through the wrapper -->
  <rect x="20" y="188" width="24" height="40" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <path d="M100 188 L82 176 L82 216 L100 228 Z" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <rect x="100" y="188" width="190" height="40" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <rect x="350" y="188" width="90" height="40" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <rect x="500" y="188" width="120" height="40" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <line x1="350" y1="208" x2="440" y2="208" stroke="#006a90" stroke-opacity="0.35"/>
  <line x1="380" y1="188" x2="380" y2="208" stroke="#006a90" stroke-opacity="0.35"/>
  <line x1="412" y1="208" x2="412" y2="228" stroke="#006a90" stroke-opacity="0.35"/>
  <line x1="500" y1="208" x2="620" y2="208" stroke="#006a90" stroke-opacity="0.35"/>
  <line x1="540" y1="188" x2="540" y2="208" stroke="#006a90" stroke-opacity="0.35"/>
  <line x1="580" y1="208" x2="580" y2="228" stroke="#006a90" stroke-opacity="0.35"/>
  <text x="195" y="212" fill="#11171d" text-anchor="middle" font-weight="600">.\adb.cmd wrapper</text>

  <!-- gate 3 is sealed -->
  <path d="M442 190 L498 226" stroke="#006a90" stroke-width="5" stroke-linecap="round"/>
  <path d="M498 190 L442 226" stroke="#006a90" stroke-width="5" stroke-linecap="round"/>

  <!-- gate 2: a guard in the doorway -->
  <g stroke="currentColor" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" fill="none">
    <circle cx="320" cy="246" r="8"/>
    <line x1="320" y1="254" x2="320" y2="282"/>
    <line x1="320" y1="260" x2="298" y2="252"/>
    <circle cx="294" cy="250" r="3.5"/>
    <line x1="320" y1="262" x2="338" y2="274"/>
    <line x1="320" y1="282" x2="306" y2="300"/>
    <line x1="320" y1="282" x2="334" y2="300"/>
  </g>

  <text x="84" y="252" fill="currentColor" font-weight="600">Runs unattended</text>
  <text x="320" y="322" fill="currentColor" text-anchor="middle" font-weight="600">Waits for a human</text>
  <text x="470" y="252" fill="currentColor" text-anchor="middle" font-weight="600">Refused outright</text>

  <!-- through gate 1 to the phone -->
  <path d="M70 232 V310 H140 V326" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#atv-fg)"/>
  <!-- through gate 2 only if approved -->
  <path d="M320 328 V386 H190" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#atv-fg)"/>
  <text x="330" y="362" fill="currentColor" fill-opacity="0.75" font-size="12">only if approved</text>

  <!-- phone -->
  <rect x="110" y="330" width="72" height="124" rx="10" fill="#deeef5" stroke="#006a90" stroke-width="2.5"/>
  <line x1="132" y1="339" x2="160" y2="339" stroke="#11171d" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <rect x="118" y="346" width="56" height="92" rx="3" fill="#fafcfe" stroke="#555f69" stroke-opacity="0.6"/>
  <text x="146" y="476" fill="currentColor" text-anchor="middle" font-weight="600">Phone</text>
</svg>
