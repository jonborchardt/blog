<svg xmlns="http://www.w3.org/2000/svg" width="640" height="448" viewBox="0 0 640 448" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="dlv-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
    <marker id="dlv-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555f69"/></marker>
  </defs>

  <!-- sun (outside) -->
  <g stroke="currentColor" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round">
    <circle cx="600" cy="42" r="11" fill="none"/>
    <line x1="600" y1="24" x2="600" y2="16"/>
    <line x1="600" y1="60" x2="600" y2="68"/>
    <line x1="582" y1="42" x2="574" y2="42"/>
    <line x1="618" y1="42" x2="626" y2="42"/>
    <line x1="587" y1="29" x2="581" y2="23"/>
    <line x1="613" y1="29" x2="619" y2="23"/>
    <line x1="587" y1="55" x2="581" y2="61"/>
    <line x1="613" y1="55" x2="619" y2="61"/>
  </g>

  <!-- terminal window -->
  <rect x="30" y="40" width="270" height="230" rx="8" fill="#fafcfe" stroke="#006a90" stroke-width="1.5"/>
  <rect x="32" y="42" width="266" height="20" rx="6" fill="#deeef5"/>
  <circle cx="46" cy="52" r="3.5" fill="#006a90" fill-opacity="0.55"/>
  <circle cx="60" cy="52" r="3.5" fill="#006a90" fill-opacity="0.55"/>
  <circle cx="74" cy="52" r="3.5" fill="#006a90" fill-opacity="0.55"/>

  <text x="58" y="88" fill="#11171d" font-weight="600">Claude edits Kotlin / GLSL</text>
  <text x="58" y="122" fill="#11171d" font-size="12">$ gradlew assembleDebug</text>
  <path d="M50 118 C36 112 36 92 50 84" fill="none" stroke="#555f69" stroke-width="1.5" marker-end="url(#dlv-mut)"/>
  <text x="58" y="142" fill="#555f69" font-size="12" font-style="italic">compiler errors</text>
  <path d="M244 118 C258 130 258 146 244 158" fill="none" stroke="#555f69" stroke-width="1.5" marker-end="url(#dlv-mut)"/>
  <text x="256" y="142" fill="#555f69" font-size="12">APK</text>
  <text x="58" y="176" fill="#11171d" font-size="12">$ gradlew installDebug</text>
  <rect x="58" y="192" width="8" height="13" fill="#11171d" fill-opacity="0.8"/>

  <!-- wifi link, terminal to phone -->
  <path d="M347 176 Q363 162 379 176" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M353 182 Q363 173 373 182" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="2"/>
  <circle cx="363" cy="187" r="2.5" fill="currentColor" fill-opacity="0.7"/>
  <line x1="302" y1="192" x2="424" y2="192" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#dlv-fg)"/>
  <text x="310" y="212" fill="currentColor" fill-opacity="0.75" font-size="12">wifi</text>

  <!-- back from the phone -->
  <line x1="428" y1="226" x2="306" y2="226" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#dlv-fg)"/>
  <text x="404" y="243" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="12">adb logcat -s Earth</text>
  <line x1="428" y1="256" x2="306" y2="256" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#dlv-fg)"/>
  <text x="378" y="272" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="12">screenshots</text>

  <!-- phone -->
  <rect x="430" y="64" width="120" height="234" rx="16" fill="#deeef5" stroke="#006a90" stroke-width="2.5"/>
  <line x1="474" y1="77" x2="506" y2="77" stroke="#11171d" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="442" y="88" width="96" height="186" rx="4" fill="#fafcfe" stroke="#555f69" stroke-opacity="0.6"/>
  <path d="M478 252 L490 164 L502 252" fill="none" stroke="#555f69" stroke-width="2"/>
  <line x1="481" y1="230" x2="499" y2="230" stroke="#555f69" stroke-width="1.5"/>
  <line x1="484" y1="205" x2="496" y2="205" stroke="#555f69" stroke-width="1.5"/>
  <line x1="486" y1="184" x2="494" y2="184" stroke="#555f69" stroke-width="1.5"/>
  <line x1="490" y1="164" x2="490" y2="150" stroke="#555f69" stroke-width="2"/>
  <circle cx="490" cy="147" r="3" fill="#006a90"/>
  <line x1="452" y1="252" x2="528" y2="252" stroke="#555f69" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="490" y="52" fill="currentColor" text-anchor="middle" font-weight="600">Phone, outside</text>

  <!-- human holding the phone up -->
  <g stroke="currentColor" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" fill="none">
    <circle cx="458" cy="352" r="10"/>
    <line x1="458" y1="362" x2="458" y2="392"/>
    <line x1="458" y1="370" x2="486" y2="348"/>
    <line x1="458" y1="372" x2="436" y2="386"/>
    <line x1="458" y1="392" x2="444" y2="414"/>
    <line x1="458" y1="392" x2="472" y2="414"/>
  </g>
  <text x="458" y="436" fill="currentColor" text-anchor="middle" font-weight="600">Human</text>

  <path d="M490 342 Q500 324 496 306" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#dlv-fg)"/>
  <text x="508" y="330" fill="currentColor" fill-opacity="0.75" font-size="12">points at the sky</text>
  <path d="M446 302 Q432 326 449 341" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#dlv-fg)"/>
  <text x="424" y="328" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="12">does it look right?</text>
</svg>
