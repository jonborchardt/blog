<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>A desk terminal on the left streams a build over wifi arcs to a phone held up outdoors on the right, whose screen shows an AR tower; a logcat line flows back along the same path</title>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#006a90" stop-opacity="0"/>
      <stop offset="1" stop-color="#deeef5"/>
    </linearGradient>
    <clipPath id="screen"><rect x="961" y="101" width="198" height="398" rx="16"/></clipPath>
  </defs>
  <rect width="1500" height="600" fill="#11171d"/>

  <!-- right flank: night sky and hills continuing the outdoor scene (non-essential) -->
  <g fill="#deeef5">
    <circle cx="1235" cy="70" r="2.5" opacity="0.8"/>
    <circle cx="1300" cy="140" r="2" opacity="0.5"/>
    <circle cx="1365" cy="60" r="3" opacity="0.7"/>
    <circle cx="1420" cy="190" r="2" opacity="0.5"/>
    <circle cx="1470" cy="100" r="2.5" opacity="0.7"/>
    <circle cx="1330" cy="250" r="2" opacity="0.4"/>
    <circle cx="1450" cy="300" r="2" opacity="0.4"/>
    <circle cx="1265" cy="330" r="2" opacity="0.35"/>
    <circle cx="1120" cy="50" r="2" opacity="0.5"/>
    <circle cx="905" cy="70" r="2" opacity="0.4"/>
  </g>
  <!-- distant real tower echo in the flank -->
  <rect x="1352" y="330" width="5" height="140" fill="#deeef5" opacity="0.25"/>
  <!-- outdoor hills sweeping off the right edge -->
  <path d="M900 560 Q1020 520 1140 545 T1360 520 T1500 540 L1500 600 L900 600 z" fill="#555f69" opacity="0.55"/>

  <!-- desk line continuing into the left flank -->
  <path d="M60 470 L790 470" stroke="#555f69" stroke-width="4"/>
  <!-- left flank: books and a mug on the desk (non-essential) -->
  <rect x="90" y="456" width="110" height="14" rx="2" fill="#555f69"/>
  <rect x="102" y="440" width="88" height="14" rx="2" fill="#555f69" opacity="0.7"/>
  <g fill="none" stroke="#555f69" stroke-width="3">
    <rect x="216" y="422" width="52" height="48" rx="6"/>
    <path d="M268 432 Q288 436 284 452 Q281 464 268 462"/>
  </g>

  <!-- monitor -->
  <rect x="340" y="120" width="400" height="270" rx="14" fill="#11171d" stroke="#fafcfe" stroke-width="4"/>
  <rect x="520" y="390" width="40" height="62" fill="#555f69"/>
  <rect x="460" y="452" width="160" height="10" rx="4" fill="#555f69"/>
  <!-- terminal text -->
  <g font-family="IBM Plex Sans" font-size="20" fill="#fafcfe">
    <text x="366" y="166"><tspan fill="#f0b35a">&gt;</tspan> gradlew assembleDebug</text>
    <text x="366" y="202"><tspan fill="#f0b35a">&gt;</tspan> gradlew installDebug</text>
    <text x="366" y="238"><tspan fill="#f0b35a">&gt;</tspan> adb logcat -s Earth</text>
  </g>
  <g fill="#555f69">
    <rect x="366" y="262" width="300" height="10" rx="5"/>
    <rect x="366" y="286" width="220" height="10" rx="5"/>
    <rect x="366" y="310" width="260" height="10" rx="5"/>
  </g>
  <text x="366" y="360" font-family="IBM Plex Sans" font-size="18" fill="#deeef5">Earth: anchored  delta=0.4m</text>
  <rect x="660" y="346" width="12" height="20" fill="#f0b35a"/>

  <!-- wifi arcs from monitor to phone -->
  <g fill="none" stroke="#006a90" stroke-width="6" stroke-linecap="round">
    <path d="M790 315 A70 70 0 0 1 790 245"/>
    <path d="M830 345 A110 110 0 0 1 830 215"/>
    <path d="M870 375 A150 150 0 0 1 870 185"/>
  </g>
  <!-- APK forward -->
  <path d="M760 280 L916 280" stroke="#f0b35a" stroke-width="4" stroke-dasharray="18 12"/>
  <path d="M908 268 L930 280 L908 292 z" fill="#f0b35a"/>
  <!-- logcat back -->
  <path d="M920 400 L772 400" stroke="#deeef5" stroke-width="3" stroke-dasharray="6 10"/>
  <path d="M782 388 L760 400 L782 412 z" fill="#deeef5"/>
  <text x="845" y="266" font-family="IBM Plex Sans" font-size="16" fill="#f0b35a" text-anchor="middle">APK</text>
  <text x="845" y="428" font-family="IBM Plex Sans" font-size="16" fill="#deeef5" text-anchor="middle">logcat</text>

  <!-- phone -->
  <rect x="950" y="90" width="220" height="420" rx="24" fill="#11171d" stroke="#fafcfe" stroke-width="4"/>
  <g clip-path="url(#screen)">
    <rect x="961" y="101" width="198" height="398" fill="#11171d"/>
    <!-- horizon and hills seen through the camera -->
    <path d="M961 420 Q1020 385 1075 412 T1159 402 L1159 499 L961 499 z" fill="#555f69"/>
    <!-- AR tower -->
    <rect x="1047" y="150" width="16" height="262" fill="url(#beam)"/>
    <rect x="1052" y="150" width="6" height="262" fill="#deeef5"/>
    <rect x="998" y="172" width="118" height="30" rx="5" fill="#11171d" stroke="#006a90" stroke-width="2"/>
    <text x="1057" y="193" font-family="IBM Plex Sans" font-size="14" font-weight="700" fill="#fafcfe" text-anchor="middle">Tacoma 42.4 km</text>
    <!-- HUD corners -->
    <g stroke="#006a90" stroke-width="3" fill="none">
      <path d="M975 133 L975 117 L991 117"/><path d="M1145 133 L1145 117 L1129 117"/>
      <path d="M975 467 L975 483 L991 483"/><path d="M1145 467 L1145 483 L1129 483"/>
    </g>
  </g>
  <!-- hand holding phone -->
  <path d="M950 448 Q914 458 924 508 L984 538 L1148 538 Q1186 528 1168 480" fill="none" stroke="#fafcfe" stroke-width="4" stroke-linecap="round"/>
  <path d="M1170 360 Q1206 360 1202 410 L1170 420" fill="none" stroke="#fafcfe" stroke-width="4" stroke-linecap="round"/>

  <!-- no cable: crossed-out USB plug under the desk -->
  <g transform="translate(470 520)">
    <rect x="0" y="0" width="60" height="26" rx="4" fill="none" stroke="#555f69" stroke-width="3"/>
    <rect x="60" y="8" width="24" height="10" fill="#555f69"/>
    <line x1="-8" y1="-8" x2="92" y2="34" stroke="#f0b35a" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
