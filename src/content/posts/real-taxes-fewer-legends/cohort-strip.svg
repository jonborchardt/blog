  <rect x="70" y="142" width="550" height="14" fill="currentColor" fill-opacity="0.06"/>
  <rect x="70" y="142" width="11.34" height="14" fill="#f0b35a"/>
  <rect x="109.69" y="142" width="11.34" height="14" fill="#f0b35a"/>
  <rect x="126.7" y="142" width="11.34" height="14" fill="#f0b35a"/>
  <rect x="257.11" y="142" width="5.67" height="14" fill="#f0b35a"/>
  <rect x="279.79" y="142" width="5.67" height="14" fill="#f0b35a"/>
