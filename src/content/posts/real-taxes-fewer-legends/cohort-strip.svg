  <text x="70" y="280" fill="currentColor">spend pre-tax first · adds 1935, 1965</text>
  <rect x="70" y="286" width="550" height="14" fill="currentColor" fill-opacity="0.06"/>
  <rect x="70" y="286" width="11.34" height="14" fill="#f0b35a"/>
  <rect x="109.69" y="286" width="11.34" height="14" fill="#f0b35a"/>
  <rect x="279.79" y="286" width="5.67" height="14" fill="#f0b35a"/>

