<svg xmlns="http://www.w3.org/2000/svg" width="640" height="428" viewBox="0 0 640 428" font-family="system-ui, sans-serif" font-size="12">
  <!-- x = start year 1928..2025 (x = 70 + (year-1928) * 5.6701, one 5.67px tile per year); one row per policy; warm tiles = start years that run out of money -->
  <g stroke="currentColor" stroke-opacity="0.12" stroke-width="1">
    <line x1="81.3" y1="30" x2="81.3" y2="386"/><line x1="138" y1="30" x2="138" y2="386"/><line x1="194.7" y1="30" x2="194.7" y2="386"/><line x1="251.4" y1="30" x2="251.4" y2="386"/><line x1="308.1" y1="30" x2="308.1" y2="386"/><line x1="364.9" y1="30" x2="364.9" y2="386"/><line x1="421.6" y1="30" x2="421.6" y2="386"/><line x1="478.3" y1="30" x2="478.3" y2="386"/><line x1="535" y1="30" x2="535" y2="386"/><line x1="591.7" y1="30" x2="591.7" y2="386"/>
  </g>

  <!-- row 0: baseline -->
  <text x="70" y="28" fill="currentColor">baseline · fails 1928, 1929, 1936</text>
  <rect x="70" y="34" width="550" height="14" fill="currentColor" fill-opacity="0.06"/>
  <rect x="70" y="34" width="11.34" height="14" fill="#f0b35a"/>
  <rect x="115.36" y="34" width="5.67" height="14" fill="#f0b35a"/>

  <!-- row 1: convert day one to IRMAA tier 1 -->
  <text x="70" y="64" fill="currentColor">convert day one, up to IRMAA tier 1 · adds 1965</text>
  <rect x="70" y="70" width="550" height="14" fill="currentColor" fill-opacity="0.06"/>
  <rect x="70" y="70" width="11.34" height="14" fill="#f0b35a"/>
  <rect x="115.36" y="70" width="5.67" height="14" fill="#f0b35a"/>
  <rect x="279.79" y="70" width="5.67" height="14" fill="#f0b35a"/>

  <!-- row 2: convert day one to 22% top -->
  <text x="70" y="100" fill="currentColor">convert day one, up to the 22% top · adds 1961, 1965</text>
  <rect x="70" y="106" width="550" height="14" fill="currentColor" fill-opacity="0.06"/>
  <rect x="70" y="106" width="11.34" height="14" fill="#f0b35a"/>
  <rect x="115.36" y="106" width="5.67" height="14" fill="#f0b35a"/>
