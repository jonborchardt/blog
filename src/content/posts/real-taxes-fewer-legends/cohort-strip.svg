  <!-- row 9: harvest 0% gains -->
  <text x="70" y="352" fill="currentColor">harvest 0% gains · same as baseline</text>
  <rect x="70" y="358" width="550" height="14" fill="currentColor" fill-opacity="0.06"/>
  <rect x="70" y="358" width="11.34" height="14" fill="#f0b35a"/>
  <rect x="115.36" y="358" width="5.67" height="14" fill="#f0b35a"/>

  <!-- axis -->
  <line x1="70" y1="386" x2="620" y2="386" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <g fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11">
    <text x="81.3" y="402">1930</text><text x="138" y="402">1940</text><text x="194.7" y="402">1950</text><text x="251.4" y="402">1960</text><text x="308.1" y="402">1970</text><text x="364.9" y="402">1980</text><text x="421.6" y="402">1990</text><text x="478.3" y="402">2000</text><text x="535" y="402">2010</text><text x="591.7" y="402">2020</text>
