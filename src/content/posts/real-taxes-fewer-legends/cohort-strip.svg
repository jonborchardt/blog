  <rect x="70" y="214" width="550" height="14" fill="currentColor" fill-opacity="0.06"/>
  <rect x="70" y="214" width="11.34" height="14" fill="#f0b35a"/>
  <rect x="109.69" y="214" width="11.34" height="14" fill="#f0b35a"/>
