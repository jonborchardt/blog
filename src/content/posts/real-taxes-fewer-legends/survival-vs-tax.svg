<svg xmlns="http://www.w3.org/2000/svg" width="640" height="428" viewBox="0 0 640 428" font-family="system-ui, sans-serif" font-size="12">
  <!-- x = lifetime tax change vs baseline, -40..+35 pts over x 250..620 (x = 250 + (v+40)*4.933); one row per policy; number in the dot = cohorts lost beyond baseline's three -->
  <!-- zero line -->
  <line x1="447.3" y1="40" x2="447.3" y2="364" stroke="currentColor" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="447.3" y="34" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11">baseline</text>

  <!-- group: conversion rules -->
  <text x="36" y="48" fill="currentColor" fill-opacity="0.7" font-size="11" font-weight="600">CONVERSION RULES</text>
  <text x="222" y="70" fill="currentColor" text-anchor="end">day one, to IRMAA tier 1</text>
  <line x1="447.3" y1="66" x2="380.7" y2="66" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="380.7" cy="66" r="9" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="380.7" y="70" fill="#11171d" text-anchor="middle" font-size="11" font-weight="600">1</text>
  <text x="366" y="70" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="11">−13%</text>

  <text x="222" y="98" fill="currentColor" text-anchor="end">day one, to 22% top</text>
  <line x1="447.3" y1="94" x2="323.5" y2="94" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="323.5" cy="94" r="9" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="323.5" y="98" fill="#11171d" text-anchor="middle" font-size="11" font-weight="600">2</text>
  <text x="309" y="98" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="11">−25%</text>

  <text x="222" y="126" fill="currentColor" text-anchor="end">day one, to 24% top</text>
  <line x1="447.3" y1="122" x2="257.9" y2="122" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="257.9" cy="122" r="9" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="257.9" y="126" fill="#11171d" text-anchor="middle" font-size="11" font-weight="600">7</text>
  <text x="257.9" y="110" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11">−38%</text>

  <text x="222" y="154" fill="currentColor" text-anchor="end" font-weight="600">after window, gated</text>
  <line x1="447.3" y1="150" x2="392.1" y2="150" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="392.1" cy="150" r="9" fill="#f0b35a" stroke="#11171d" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="392.1" y="154" fill="#11171d" text-anchor="middle" font-size="11" font-weight="600">0</text>
  <text x="377" y="154" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="11">−11%</text>

  <!-- group: contribution rules -->
  <text x="36" y="184" fill="currentColor" fill-opacity="0.7" font-size="11" font-weight="600">CONTRIBUTION RULES</text>
  <text x="222" y="206" fill="currentColor" text-anchor="end">Roth 401k deferral</text>
  <line x1="447.3" y1="202" x2="326.5" y2="202" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="326.5" cy="202" r="9" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="326.5" y="206" fill="#11171d" text-anchor="middle" font-size="11" font-weight="600">2</text>
  <text x="312" y="206" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="11">−25%</text>

  <text x="222" y="234" fill="currentColor" text-anchor="end">skip the mega-backdoor</text>
  <line x1="447.3" y1="230" x2="556.9" y2="230" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="556.9" cy="230" r="9" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="556.9" y="234" fill="#11171d" text-anchor="middle" font-size="11" font-weight="600">2</text>
  <text x="571" y="234" fill="currentColor" fill-opacity="0.75" font-size="11">+22%</text>

  <text x="222" y="262" fill="currentColor" text-anchor="end">match only, rest to brokerage</text>
  <line x1="447.3" y1="258" x2="593.4" y2="258" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="593.4" cy="258" r="9" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="593.4" y="262" fill="#11171d" text-anchor="middle" font-size="11" font-weight="600">1</text>
  <text x="607" y="262" fill="currentColor" fill-opacity="0.75" font-size="11">+30%</text>

  <!-- group: withdrawal rules -->
  <text x="36" y="292" fill="currentColor" fill-opacity="0.7" font-size="11" font-weight="600">WITHDRAWAL RULES</text>
  <text x="222" y="314" fill="currentColor" text-anchor="end">spend pre-tax first</text>
  <line x1="447.3" y1="310" x2="416.2" y2="310" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="416.2" cy="310" r="9" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="416.2" y="314" fill="#11171d" text-anchor="middle" font-size="11" font-weight="600">2</text>
  <text x="402" y="314" fill="currentColor" fill-opacity="0.75" text-anchor="end" font-size="11">−6%</text>

  <text x="222" y="342" fill="currentColor" text-anchor="end">chase the ACA subsidy</text>
  <line x1="447.3" y1="338" x2="592.9" y2="338" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="592.9" cy="338" r="9" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="592.9" y="342" fill="#11171d" text-anchor="middle" font-size="11" font-weight="600">1</text>
  <text x="607" y="342" fill="currentColor" fill-opacity="0.75" font-size="11">+30%</text>

  <!-- axis -->
  <line x1="250" y1="364" x2="620" y2="364" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <g fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="11">
    <text x="250" y="380">−40%</text>
    <text x="299.3" y="380">−30%</text>
    <text x="348.7" y="380">−20%</text>
    <text x="398" y="380">−10%</text>
    <text x="447.3" y="380">0</text>
    <text x="496.7" y="380">+10%</text>
    <text x="546" y="380">+20%</text>
    <text x="595.3" y="380">+30%</text>
  </g>
  <text x="435" y="400" fill="currentColor" fill-opacity="0.8" text-anchor="middle" font-size="11">lifetime tax versus baseline, median across 98 histories</text>
  <text x="320" y="420" fill="currentColor" fill-opacity="0.7" text-anchor="middle" font-size="11">number in each dot: start years lost beyond the baseline's three · retire 55, Social Security 65</text>
</svg>
