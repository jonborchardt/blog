<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>A fan of wealth lines with the first ten retirement years shaded; one line pays tax inside that window and sinks to zero, while after a gate at year eleven a slice is funneled into a Roth bucket and the rest keep rising</title>
