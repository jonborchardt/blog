  <!-- the day-one converter: pays tax inside the window, then sinks to zero -->
  <polyline points="380,380 450,372 520,366" fill="none" stroke="#f0b35a" stroke-width="7" stroke-linecap="round"/>
  <line x1="520" y1="366" x2="520" y2="402" stroke="#f0b35a" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 12"/>
  <text x="562" y="446" font-family="IBM Plex Sans" font-size="26" fill="#11171d">tax</text>
  <polyline points="520,402 600,414 700,440 800,478 900,520" fill="none" stroke="#f0b35a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="900" cy="520" r="12" fill="#f0b35a" stroke="#11171d" stroke-width="3"/>

  <!-- the gated converter: waits, then diverts a slice after the gate and keeps rising -->
  <polyline points="380,380 470,372 560,378 650,360 700,352 800,330 900,300 1000,270 1100,240 1200,210 1300,180 1440,150" fill="none" stroke="#006a90" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1440" cy="150" r="12" fill="#006a90" stroke="#11171d" stroke-width="3"/>
  <path d="M950 285 C990 250 1010 220 1055 184" fill="none" stroke="#006a90" stroke-width="5" stroke-dasharray="10 9" stroke-linecap="round"/>
  <path d="M1042 176 L1066 172 L1058 196 Z" fill="#006a90"/>

  <!-- year 11 gate, raised -->
  <rect x="691" y="400" width="18" height="120" rx="5" fill="#deeef5" stroke="#006a90" stroke-width="4"/>
  <path d="M694 406 L771 329 L785 343 L708 420 Z" fill="#deeef5" stroke="#006a90" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Roth bucket with the IRMAA ceiling -->
  <rect x="1000" y="60" width="170" height="112" rx="10" fill="#fafcfe" stroke="#006a90" stroke-width="4"/>
  <rect x="1003" y="118" width="164" height="51" rx="7" fill="#deeef5"/>
  <line x1="985" y1="118" x2="1185" y2="118" stroke="#f0b35a" stroke-width="6" stroke-dasharray="18 10" stroke-linecap="round"/>
  <text x="1085" y="100" font-family="IBM Plex Sans" font-size="28" fill="#11171d" text-anchor="middle">Roth</text>

