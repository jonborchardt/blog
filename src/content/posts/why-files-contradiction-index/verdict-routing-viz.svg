<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="vetv-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker>
  </defs>

  <!-- source -->
  <text x="40" y="34" fill="currentColor" font-weight="600">Embedding similarity</text>
  <text x="40" y="52" fill="currentColor" fill-opacity="0.75" font-size="12">Jaccard fallback</text>
  <path d="M185 40 Q215 50 232 56" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#vetv-fg)"/>

  <!-- candidate pair dumbbells -->
  <g stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="245" y1="60" x2="263" y2="60"/>
    <line x1="310" y1="50" x2="328" y2="50"/>
    <line x1="378" y1="64" x2="396" y2="64"/>
    <line x1="272" y1="92" x2="290" y2="92"/>
    <line x1="348" y1="88" x2="366" y2="88"/>
    <line x1="428" y1="88" x2="446" y2="88"/>
  </g>
  <g fill="#deeef5" stroke="#006a90" stroke-width="1.5">
    <circle cx="240" cy="60" r="5"/><circle cx="268" cy="60" r="5"/>
    <circle cx="305" cy="50" r="5"/><circle cx="333" cy="50" r="5"/>
    <circle cx="373" cy="64" r="5"/><circle cx="401" cy="64" r="5"/>
    <circle cx="267" cy="92" r="5"/><circle cx="295" cy="92" r="5"/>
    <circle cx="343" cy="88" r="5"/><circle cx="371" cy="88" r="5"/>
    <circle cx="423" cy="88" r="5"/><circle cx="451" cy="88" r="5"/>
  </g>
  <text x="320" y="118" fill="currentColor" text-anchor="middle" font-weight="600">Candidate pairs</text>

  <!-- unverified pair slides off to the admin sheet -->
  <path d="M458 96 Q520 106 548 136" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#vetv-fg)"/>
  <text x="527" y="98" fill="currentColor" fill-opacity="0.75" text-anchor="middle" font-size="12">unverified</text>
  <rect x="490" y="142" width="130" height="58" rx="5" fill="#fafcfe" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="502" y1="158" x2="608" y2="158" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="502" y1="172" x2="588" y2="172" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <line x1="502" y1="186" x2="598" y2="186" stroke="#555f69" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <text x="555" y="220" fill="currentColor" fill-opacity="0.85" text-anchor="middle" font-size="12" font-style="italic">Admin only</text>
  <text x="555" y="236" fill="currentColor" fill-opacity="0.85" text-anchor="middle" font-size="12" font-style="italic">(verified: null)</text>

  <!-- verification funnel -->
  <path d="M200 130 H440 L350 212 L350 244 L290 244 L290 212 Z" fill="#deeef5" stroke="#006a90" stroke-width="2"/>
  <text x="320" y="168" fill="#11171d" text-anchor="middle" font-weight="600">AI verification</text>

  <!-- fan-out from the spout -->
  <path d="M305 250 Q210 262 140 282" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#vetv-fg)"/>
  <path d="M320 250 V278" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#vetv-fg)"/>
  <path d="M335 250 Q430 262 502 282" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" marker-end="url(#vetv-fg)"/>

  <!-- verdicts falling into each container -->
  <g fill="currentColor" fill-opacity="0.75" font-size="12" text-anchor="middle">
    <text x="125" y="300">LOGICAL-CONTRADICTION</text>
    <text x="125" y="316">DEBUNKS</text>
    <text x="125" y="332">UNDERCUTS</text>
    <text x="125" y="348">ALTERNATIVE</text>
    <text x="320" y="316">SAME-CLAIM</text>
    <text x="520" y="308">COMPLEMENTARY</text>
    <text x="520" y="324">IRRELEVANT</text>
  </g>

  <!-- tub: public contradictions page -->
  <path d="M35 358 L215 358 L203 412 L47 412 Z" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="125" y="382" fill="#11171d" text-anchor="middle" font-weight="600">Public contradictions</text>
  <text x="125" y="400" fill="#11171d" text-anchor="middle" font-weight="600">page</text>

  <!-- tub: cross-video agreements page -->
  <path d="M230 358 L410 358 L398 412 L242 412 Z" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="320" y="382" fill="#11171d" text-anchor="middle" font-weight="600">Cross-video</text>
  <text x="320" y="400" fill="#11171d" text-anchor="middle" font-weight="600">agreements page</text>

  <!-- trash can: dropped -->
  <g stroke="currentColor" stroke-opacity="0.5" fill="none" stroke-width="2">
    <path d="M482 362 L558 362 L551 414 L489 414 Z"/>
    <line x1="474" y1="358" x2="566" y2="358"/>
    <path d="M512 358 V351 H528 V358"/>
    <line x1="505" y1="370" x2="503" y2="406" stroke-opacity="0.35"/>
    <line x1="520" y1="370" x2="520" y2="406" stroke-opacity="0.35"/>
    <line x1="535" y1="370" x2="537" y2="406" stroke-opacity="0.35"/>
  </g>
  <text x="520" y="436" fill="currentColor" text-anchor="middle" font-size="12">Dropped</text>
</svg>
