<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>A row of episode reels feeding a graph of claim nodes, two of which are joined by a highlighted contradiction edge, with every node tethered back down to a highlighted span on a transcript strip</title>
  <rect width="1200" height="630" fill="#fafcfe"/>

  <!-- episode reels along the top -->
  <defs>
    <g id="reel">
      <rect x="0" y="0" width="120" height="70" rx="8" fill="#deeef5" stroke="#006a90" stroke-width="3"/>
      <rect x="0" y="0" width="120" height="12" rx="4" fill="#006a90"/>
      <rect x="0" y="58" width="120" height="12" rx="4" fill="#006a90"/>
      <rect x="10" y="2" width="14" height="8" fill="#fafcfe"/><rect x="34" y="2" width="14" height="8" fill="#fafcfe"/><rect x="58" y="2" width="14" height="8" fill="#fafcfe"/><rect x="82" y="2" width="14" height="8" fill="#fafcfe"/>
      <rect x="10" y="60" width="14" height="8" fill="#fafcfe"/><rect x="34" y="60" width="14" height="8" fill="#fafcfe"/><rect x="58" y="60" width="14" height="8" fill="#fafcfe"/><rect x="82" y="60" width="14" height="8" fill="#fafcfe"/>
      <polygon points="48,24 48,46 72,35" fill="#006a90"/>
    </g>
    <g id="node">
      <circle r="18" fill="#deeef5" stroke="#006a90" stroke-width="4"/>
    </g>
  </defs>
  <use href="#reel" x="200" y="70"/>
  <use href="#reel" x="380" y="70"/>
  <use href="#reel" x="560" y="70"/>
  <use href="#reel" x="740" y="70"/>
  <use href="#reel" x="920" y="70"/>
  <text x="130" y="112" font-family="IBM Plex Sans" font-size="22" fill="#555f69" text-anchor="end">episodes</text>

  <!-- reels feed down into the graph -->
  <g stroke="#d9dfe3" stroke-width="3" fill="none">
    <path d="M260 140 C260 200 320 210 350 250"/>
    <path d="M440 140 C440 200 470 220 470 250"/>
    <path d="M620 140 C620 190 600 220 600 250"/>
    <path d="M800 140 C800 200 760 210 740 250"/>
    <path d="M980 140 C980 200 900 220 880 250"/>
  </g>

  <!-- claim graph -->
  <g stroke="#006a90" stroke-width="3" fill="none">
    <line x1="350" y1="270" x2="470" y2="270"/>
    <line x1="470" y1="270" x2="600" y2="270"/>
    <line x1="470" y1="270" x2="530" y2="350"/>
    <line x1="600" y1="270" x2="740" y2="270"/>
    <line x1="740" y1="270" x2="880" y2="270"/>
    <line x1="740" y1="270" x2="680" y2="350"/>
    <line x1="880" y1="270" x2="820" y2="350"/>
    <line x1="350" y1="270" x2="410" y2="350"/>
  </g>
  <!-- contradiction edge: dashed red-ish highlight, drawn with the theme highlight -->
  <path d="M530 350 C560 400 650 400 680 350" stroke="#f0b35a" stroke-width="6" stroke-dasharray="14 10" fill="none"/>
  <text x="605" y="445" font-family="IBM Plex Sans" font-size="20" fill="#11171d" text-anchor="middle">contradicts</text>

  <use href="#node" x="350" y="270"/>
  <use href="#node" x="470" y="270"/>
  <use href="#node" x="600" y="270"/>
  <use href="#node" x="740" y="270"/>
  <use href="#node" x="880" y="270"/>
  <use href="#node" x="410" y="350"/>
  <use href="#node" x="820" y="350"/>
  <circle cx="530" cy="350" r="18" fill="#f0b35a" stroke="#11171d" stroke-width="4"/>
  <circle cx="680" cy="350" r="18" fill="#f0b35a" stroke="#11171d" stroke-width="4"/>
  <text x="130" y="278" font-family="IBM Plex Sans" font-size="22" fill="#555f69" text-anchor="end">claims</text>

  <!-- tethers from every node down to a transcript span -->
  <g stroke="#006a90" stroke-width="2" stroke-dasharray="4 6" fill="none">
    <line x1="350" y1="288" x2="300" y2="500"/>
    <line x1="470" y1="288" x2="420" y2="500"/>
    <line x1="600" y1="288" x2="600" y2="500"/>
    <line x1="740" y1="288" x2="780" y2="500"/>
    <line x1="880" y1="288" x2="930" y2="500"/>
    <line x1="410" y1="368" x2="360" y2="500"/>
    <line x1="820" y1="368" x2="860" y2="500"/>
  </g>
  <g stroke="#11171d" stroke-width="2.5" stroke-dasharray="4 6" fill="none">
    <line x1="530" y1="368" x2="510" y2="500"/>
    <line x1="680" y1="368" x2="700" y2="500"/>
  </g>

  <!-- transcript strip -->
  <rect x="200" y="500" width="840" height="60" rx="8" fill="#fafcfe" stroke="#d9dfe3" stroke-width="3"/>
  <g fill="#d9dfe3">
    <rect x="220" y="516" width="60" height="10" rx="5"/><rect x="290" y="516" width="30" height="10" rx="5"/><rect x="330" y="516" width="70" height="10" rx="5"/><rect x="410" y="516" width="40" height="10" rx="5"/><rect x="460" y="516" width="90" height="10" rx="5"/><rect x="560" y="516" width="50" height="10" rx="5"/><rect x="620" y="516" width="70" height="10" rx="5"/><rect x="700" y="516" width="40" height="10" rx="5"/><rect x="750" y="516" width="80" height="10" rx="5"/><rect x="840" y="516" width="60" height="10" rx="5"/><rect x="910" y="516" width="100" height="10" rx="5"/>
    <rect x="220" y="536" width="90" height="10" rx="5"/><rect x="320" y="536" width="40" height="10" rx="5"/><rect x="370" y="536" width="60" height="10" rx="5"/><rect x="440" y="536" width="30" height="10" rx="5"/><rect x="480" y="536" width="80" height="10" rx="5"/><rect x="570" y="536" width="60" height="10" rx="5"/><rect x="640" y="536" width="40" height="10" rx="5"/><rect x="690" y="536" width="90" height="10" rx="5"/><rect x="790" y="536" width="50" height="10" rx="5"/><rect x="850" y="536" width="70" height="10" rx="5"/><rect x="930" y="536" width="80" height="10" rx="5"/>
  </g>
  <!-- highlighted spans where the tethers land -->
  <g fill="#006a90" fill-opacity="0.85">
    <rect x="290" y="516" width="30" height="10" rx="5"/><rect x="410" y="516" width="40" height="10" rx="5"/><rect x="560" y="516" width="50" height="10" rx="5"/><rect x="750" y="516" width="80" height="10" rx="5"/><rect x="910" y="516" width="100" height="10" rx="5"/>
    <rect x="320" y="536" width="40" height="10" rx="5"/><rect x="850" y="536" width="70" height="10" rx="5"/>
  </g>
  <g fill="#f0b35a">
    <rect x="480" y="536" width="80" height="10" rx="5"/><rect x="690" y="536" width="90" height="10" rx="5"/>
  </g>
  <text x="130" y="538" font-family="IBM Plex Sans" font-size="22" fill="#555f69" text-anchor="end">transcript</text>
</svg>
