<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>Word pills feeding a stack of axis sliders that raise a strip of section blocks into an energy arc</title>

  <rect x="0" y="0" width="1500" height="600" fill="#fafcfe" />

  <!-- cycle grid: one line per bar, with a baseline the sections stand on -->
  <path
    d="M50 0V600 M100 0V600 M150 0V600 M200 0V600 M250 0V600 M300 0V600 M350 0V600 M400 0V600 M450 0V600 M500 0V600 M550 0V600 M600 0V600 M650 0V600 M700 0V600 M750 0V600 M800 0V600 M850 0V600 M900 0V600 M950 0V600 M1000 0V600 M1050 0V600 M1100 0V600 M1150 0V600 M1200 0V600 M1250 0V600 M1300 0V600 M1350 0V600 M1400 0V600 M1450 0V600"
    stroke="#d9dfe3" stroke-width="1" opacity="0.55" />
  <path d="M0 515H1500" stroke="#d9dfe3" stroke-width="3" />

  <!-- left flank: more words arriving, out of frame -->
  <g opacity="0.28">
    <rect x="104" y="196" width="168" height="54" rx="27" fill="#deeef5" stroke="#006a90" stroke-width="2" />
    <rect x="28" y="296" width="168" height="54" rx="27" fill="#deeef5" stroke="#006a90" stroke-width="2" />
    <rect x="140" y="396" width="168" height="54" rx="27" fill="#deeef5" stroke="#006a90" stroke-width="2" />
  </g>

  <!-- the words -->
  <g font-family="IBM Plex Sans" font-size="27" fill="#11171d" text-anchor="middle">
    <rect x="344" y="173" width="168" height="54" rx="27" fill="#deeef5" stroke="#006a90" stroke-width="2" />
    <text x="428" y="209">darker</text>
    <rect x="344" y="273" width="168" height="54" rx="27" fill="#deeef5" stroke="#006a90" stroke-width="2" />
    <text x="428" y="309">punchier</text>
    <rect x="344" y="373" width="168" height="54" rx="27" fill="#deeef5" stroke="#006a90" stroke-width="2" />
    <text x="428" y="409">dreamier</text>
  </g>

  <!-- words converge on the axis stack -->
  <g stroke="#006a90" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M518 200C580 200 600 268 634 294" />
    <path d="M518 300C570 300 590 298 634 300" />
    <path d="M518 400C580 400 600 332 634 306" />
  </g>
  <polygon points="632,289 658,300 632,312" fill="#006a90" />

  <!-- the axis stack: one slider per axis, thumbs at their own values -->
  <rect x="652" y="130" width="196" height="340" rx="16" fill="#deeef5" stroke="#d9dfe3" stroke-width="2" />
  <g stroke-linecap="round">
    <path d="M678 187H822" stroke="#d9dfe3" stroke-width="7" />
    <path d="M678 187H728" stroke="#006a90" stroke-width="7" />
    <circle cx="728" cy="187" r="11" fill="#f0b35a" stroke="#11171d" stroke-width="2" />

    <path d="M678 243H822" stroke="#d9dfe3" stroke-width="7" />
    <path d="M678 243H790" stroke="#006a90" stroke-width="7" />
    <circle cx="790" cy="243" r="11" fill="#f0b35a" stroke="#11171d" stroke-width="2" />

    <path d="M678 300H822" stroke="#d9dfe3" stroke-width="7" />
    <path d="M678 300H700" stroke="#006a90" stroke-width="7" />
    <circle cx="700" cy="300" r="11" fill="#f0b35a" stroke="#11171d" stroke-width="2" />

    <path d="M678 357H822" stroke="#d9dfe3" stroke-width="7" />
    <path d="M678 357H762" stroke="#006a90" stroke-width="7" />
    <circle cx="762" cy="357" r="11" fill="#f0b35a" stroke="#11171d" stroke-width="2" />

    <path d="M678 413H822" stroke="#d9dfe3" stroke-width="7" />
    <path d="M678 413H812" stroke="#006a90" stroke-width="7" />
    <circle cx="812" cy="413" r="11" fill="#f0b35a" stroke="#11171d" stroke-width="2" />
  </g>

  <!-- the stack writes the arrangement -->
  <path d="M852 300H864" stroke="#006a90" stroke-width="2.5" fill="none" opacity="0.8" />
  <polygon points="862,289 888,300 862,312" fill="#006a90" />

  <!-- sections, standing on the baseline, shaped into an energy arc -->
  <g stroke="#006a90" stroke-width="2.5">
    <rect x="892" y="427" width="52" height="88" fill="#deeef5" />
    <path d="M892 471H944" stroke-width="1.5" opacity="0.45" />

    <rect x="953" y="355" width="52" height="160" fill="#deeef5" />
    <path d="M953 408H1005 M953 461H1005" stroke-width="1.5" opacity="0.45" />

    <rect x="1014" y="271" width="52" height="244" fill="#deeef5" />
    <path d="M1014 332H1066 M1014 393H1066 M1014 454H1066" stroke-width="1.5" opacity="0.45" />

    <rect x="1075" y="185" width="52" height="330" fill="#f0b35a" />
    <path d="M1075 251H1127 M1075 317H1127 M1075 383H1127 M1075 449H1127" stroke-width="1.5" opacity="0.45" />

    <rect x="1136" y="299" width="52" height="216" fill="#deeef5" />
    <path d="M1136 353H1188 M1136 407H1188 M1136 461H1188" stroke-width="1.5" opacity="0.45" />
  </g>

  <!-- right flank: the piece carries on past the frame -->
  <g stroke="#006a90" stroke-width="2.5" fill="#deeef5">
    <rect x="1197" y="387" width="52" height="128" opacity="0.55" />
    <rect x="1258" y="423" width="52" height="92" opacity="0.4" />
    <rect x="1319" y="451" width="52" height="64" opacity="0.3" />
    <rect x="1380" y="471" width="52" height="44" opacity="0.22" />
    <rect x="1441" y="487" width="52" height="28" opacity="0.16" />
  </g>
</svg>
