<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>A grid of small tiles, one per retirement start year from 1928 to 2025, most pale blue with rising strokes and one warm streak of falling tiles where the same plan went broke</title>
  <defs>
    <g id="t">
      <rect width="62" height="62" rx="10" fill="#deeef5"/>
      <polyline points="14,46 30,32 48,16" fill="none" stroke="#006a90" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="b">
      <rect width="62" height="62" rx="10" fill="#f0b35a"/>
      <polyline points="14,18 30,34 48,50" fill="none" stroke="#11171d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="row">
      <use href="#t" x="33"/><use href="#t" x="110"/><use href="#t" x="187"/><use href="#t" x="264"/>
      <use href="#t" x="341"/><use href="#t" x="418"/><use href="#t" x="495"/><use href="#t" x="572"/>
      <use href="#t" x="649"/><use href="#t" x="726"/><use href="#t" x="803"/><use href="#t" x="880"/>
      <use href="#t" x="957"/><use href="#t" x="1034"/><use href="#t" x="1111"/><use href="#t" x="1188"/>
      <use href="#t" x="1265"/><use href="#t" x="1342"/><use href="#t" x="1419"/>
    </g>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fafcfe" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fafcfe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fafcfe" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fafcfe" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="600" fill="#fafcfe"/>
  <use href="#row" y="90"/>
  <use href="#row" y="172"/>
  <use href="#row" y="254"/>
  <use href="#row" y="336"/>
  <use href="#row" y="418"/>
  <!-- the broke streak, middle row -->
  <use href="#b" x="572" y="254"/><use href="#b" x="649" y="254"/><use href="#b" x="726" y="254"/>
  <use href="#b" x="803" y="254"/><use href="#b" x="880" y="254"/><use href="#b" x="957" y="254"/>
  <!-- flank fade: non-essential continuation -->
  <rect x="0" y="80" width="320" height="410" fill="url(#fadeL)"/>
  <rect x="1180" y="80" width="320" height="410" fill="url(#fadeR)"/>
  <text x="341" y="66" font-family="IBM Plex Sans" font-size="26" fill="#555f69">1928</text>
  <text x="1173" y="66" font-family="IBM Plex Sans" font-size="26" fill="#555f69" text-anchor="end">2025</text>
  <text x="750" y="552" font-family="IBM Plex Sans" font-size="36" font-weight="600" fill="#11171d" text-anchor="middle">one plan, 98 start years</text>
</svg>
