<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>A cursor mid-build on a baseline: solid geometric structures stand behind it, dashed blueprint outlines of the same structures wait ahead of it on a drafting grid</title>
  <rect width="1500" height="600" fill="#fafcfe"/>

  <!-- drafting grid on the blueprint (right) side, fading in from the cursor -->
  <g stroke="#d9dfe3" stroke-width="2">
    <line x1="850" y1="90" x2="850" y2="470"/>
    <line x1="950" y1="90" x2="950" y2="470"/>
    <line x1="1050" y1="90" x2="1050" y2="470"/>
    <line x1="1150" y1="90" x2="1150" y2="470"/>
    <line x1="1250" y1="90" x2="1250" y2="470"/>
    <line x1="1350" y1="90" x2="1350" y2="470"/>
    <line x1="1450" y1="90" x2="1450" y2="470"/>
    <line x1="820" y1="140" x2="1500" y2="140"/>
    <line x1="820" y1="240" x2="1500" y2="240"/>
    <line x1="820" y1="340" x2="1500" y2="340"/>
  </g>

  <!-- baseline -->
  <line x1="40" y1="450" x2="1460" y2="450" stroke="#11171d" stroke-width="6" stroke-linecap="round"/>

  <!-- BUILT side (left of cursor): solid structures -->
  <!-- flank continuation, non-essential -->
  <rect x="60" y="330" width="90" height="120" fill="#deeef5" stroke="#006a90" stroke-width="4"/>
  <rect x="170" y="270" width="70" height="180" fill="#006a90"/>
  <!-- essential built cluster (inside centre crop) -->
  <rect x="330" y="230" width="110" height="220" fill="#006a90"/>
  <path d="M330 230 h110 l-55 -70 z" fill="#f0b35a"/>
  <rect x="460" y="310" width="130" height="140" fill="#deeef5" stroke="#006a90" stroke-width="5"/>
  <rect x="484" y="340" width="34" height="34" fill="#006a90"/>
  <rect x="536" y="340" width="34" height="34" fill="#006a90"/>
  <circle cx="655" cy="390" r="60" fill="#deeef5" stroke="#006a90" stroke-width="5"/>
  <circle cx="655" cy="390" r="22" fill="#006a90"/>

  <!-- cursor: the agent's caret at the build frontier -->
  <rect x="742" y="170" width="34" height="280" rx="8" fill="#f0b35a"/>
  <line x1="759" y1="120" x2="759" y2="150" stroke="#f0b35a" stroke-width="10" stroke-linecap="round"/>
  <line x1="759" y1="470" x2="759" y2="500" stroke="#f0b35a" stroke-width="10" stroke-linecap="round"/>

  <!-- BLUEPRINT side (right of cursor): dashed outlines of the same kinds of structures -->
  <g fill="none" stroke="#555f69" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round">
    <rect x="830" y="250" width="110" height="200"/>
    <path d="M830 250 l55 -70 l55 70"/>
    <rect x="970" y="320" width="130" height="130"/>
    <circle cx="1165" cy="395" r="55"/>
  </g>
  <!-- dimension marks on the blueprint -->
  <g stroke="#006a90" stroke-width="3" fill="none">
    <path d="M830 490 v14 m110 -14 v14 M830 497 h110"/>
    <path d="M968 250 h-14 m14 200 h-14 M961 250 v200"/>
  </g>

  <!-- right flank continuation, non-essential -->
  <g fill="none" stroke="#555f69" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round">
    <rect x="1265" y="290" width="80" height="160"/>
    <rect x="1375" y="350" width="70" height="100"/>
  </g>
</svg>
