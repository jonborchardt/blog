<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <title>A blocky Sierra-style vector landscape of mountains, sun and water at native resolution, with a magnifier loupe over one slope revealing the same edge redrawn smooth on a fine 6x grid</title>
  <defs>
    <clipPath id="loupe"><circle cx="900" cy="330" r="140"/></clipPath>
    <pattern id="fine" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M15 0H0V15" fill="none" stroke="#d9dfe3" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- sky -->
  <rect width="1500" height="600" fill="#fafcfe"/>
  <!-- pixel sun -->
  <g fill="#f0b35a">
    <rect x="400" y="100" width="60" height="30"/>
    <rect x="370" y="130" width="120" height="30"/>
    <rect x="340" y="160" width="180" height="30"/>
    <rect x="370" y="190" width="120" height="30"/>
    <rect x="400" y="220" width="60" height="30"/>
  </g>
  <!-- distant mountains (muted), left and right flanks continuing the range -->
  <g fill="#555f69">
    <rect x="235" y="240" width="30" height="30"/>
    <rect x="190" y="270" width="120" height="30"/>
    <rect x="145" y="300" width="210" height="30"/>
    <rect x="100" y="330" width="300" height="30"/>
    <rect x="55" y="360" width="390" height="30"/>
    <rect x="10" y="390" width="480" height="30"/>
    <rect x="-35" y="420" width="570" height="60"/>
    <rect x="1315" y="270" width="30" height="30"/>
    <rect x="1270" y="300" width="120" height="30"/>
    <rect x="1225" y="330" width="210" height="30"/>
    <rect x="1180" y="360" width="300" height="30"/>
    <rect x="1135" y="390" width="390" height="30"/>
    <rect x="1090" y="420" width="480" height="60"/>
  </g>
  <!-- main mountain (primary), blocky staircase slopes, apex in the centre crop -->
  <g fill="#006a90">
    <rect x="675" y="120" width="30" height="30"/>
    <rect x="645" y="150" width="90" height="30"/>
    <rect x="615" y="180" width="150" height="30"/>
    <rect x="585" y="210" width="210" height="30"/>
    <rect x="555" y="240" width="270" height="30"/>
    <rect x="525" y="270" width="330" height="30"/>
    <rect x="495" y="300" width="390" height="30"/>
    <rect x="465" y="330" width="450" height="30"/>
    <rect x="435" y="360" width="510" height="30"/>
    <rect x="405" y="390" width="570" height="30"/>
    <rect x="375" y="420" width="630" height="30"/>
    <rect x="345" y="450" width="690" height="30"/>
  </g>
  <!-- water -->
  <rect x="0" y="480" width="1500" height="120" fill="#deeef5"/>
  <rect x="0" y="478" width="1500" height="4" fill="#d9dfe3"/>
  <!-- pixel ripples and sun reflection -->
  <g fill="#d9dfe3">
    <rect x="120" y="525" width="90" height="12"/>
    <rect x="660" y="555" width="120" height="12"/>
    <rect x="1200" y="525" width="90" height="12"/>
    <rect x="1380" y="558" width="90" height="12"/>
    <rect x="30" y="558" width="60" height="12"/>
  </g>
  <g fill="#f0b35a">
    <rect x="400" y="510" width="60" height="12"/>
    <rect x="385" y="540" width="45" height="12"/>
    <rect x="415" y="570" width="60" height="12"/>
  </g>
  <!-- loupe interior: the same slope redrawn smooth at 6x on a fine grid -->
  <g clip-path="url(#loupe)">
    <rect x="760" y="190" width="280" height="280" fill="#fafcfe"/>
    <polygon points="745,190 1025,470 700,470 700,190" fill="#006a90"/>
    <rect x="760" y="190" width="280" height="280" fill="url(#fine)"/>
    <line x1="745" y1="190" x2="1025" y2="470" stroke="#11171d" stroke-width="4" stroke-dasharray="14 10"/>
  </g>
  <!-- loupe rim and handle -->
  <circle cx="900" cy="330" r="140" fill="none" stroke="#11171d" stroke-width="8"/>
  <line x1="999" y1="429" x2="1068" y2="498" stroke="#11171d" stroke-width="20" stroke-linecap="round"/>
  <text x="1055" y="215" font-family="IBM Plex Sans" font-size="36" fill="#11171d">6×</text>
</svg>
