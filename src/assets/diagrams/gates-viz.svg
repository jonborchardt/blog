  <text x="260" y="177" fill="#11171d" text-anchor="middle" font-size="12" font-weight="600">2</text>
  <text x="206" y="202" fill="currentColor" text-anchor="end" font-weight="600">type system</text>
  <text x="314" y="202" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">unknown vocabulary won't compile</text>

  <!-- gate 3 -->
  <line x1="220" y1="244" x2="220" y2="284" stroke="#006a90" stroke-width="4" stroke-linecap="round"/>
