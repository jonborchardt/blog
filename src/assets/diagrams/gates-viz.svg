  <line x1="220" y1="316" x2="300" y2="316" stroke="#006a90" stroke-width="4" stroke-linecap="round"/>
  <circle cx="260" cy="316" r="13" fill="#deeef5" stroke="#006a90" stroke-width="1.5"/>
  <text x="260" y="321" fill="#11171d" text-anchor="middle" font-size="12" font-weight="600">4</text>
  <text x="206" y="346" fill="currentColor" text-anchor="end" font-weight="600">cross-post checks</text>
  <text x="314" y="346" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">duplicate slugs and series order</text>

