  <text x="260" y="249" fill="#11171d" text-anchor="middle" font-size="12" font-weight="600">3</text>
  <text x="206" y="274" fill="currentColor" text-anchor="end" font-weight="600">content load, Zod</text>
  <text x="314" y="274" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">title, description, hero, dates</text>

  <!-- gate 4 -->
  <line x1="220" y1="316" x2="220" y2="356" stroke="#006a90" stroke-width="4" stroke-linecap="round"/>
