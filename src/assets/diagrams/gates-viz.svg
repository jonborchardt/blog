  <text x="206" y="490" fill="currentColor" text-anchor="end" font-weight="600">e2e on the real build</text>
  <text x="314" y="490" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">axe WCAG 2.2 AA, JS budget</text>

  <!-- deployed: flag at the end of the track -->
  <line x1="260" y1="542" x2="260" y2="600" stroke="#006a90" stroke-width="3" stroke-linecap="round"/>
  <path d="M260 542 L322 552 L260 562 Z" fill="#f0b35a"/>
