  <text x="206" y="130" fill="currentColor" text-anchor="end" font-weight="600">scaffold</text>
  <text x="314" y="130" fill="currentColor" fill-opacity="0.85" font-size="12" font-style="italic">bad slug, unknown series or tag</text>

  <!-- gate 2 -->
  <line x1="220" y1="172" x2="220" y2="212" stroke="#006a90" stroke-width="4" stroke-linecap="round"/>
