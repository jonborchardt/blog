  <text x="322" y="46" fill="currentColor" font-weight="600">authoring</text>

  <!-- the track -->
  <line x1="260" y1="64" x2="260" y2="534" stroke="currentColor" stroke-opacity="0.5" stroke-width="2" marker-end="url(#gviz-fg)"/>

  <!-- gate 1 -->
