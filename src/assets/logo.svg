<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Always Shippable: a rocket launching from an open box">
  <style>
    /* Standalone (favicon): rocket dark on light, light on dark. Inlined in a page, the page's
       currentColor / --background win (a class on the element beats these bare selectors). */
    svg { color: #0b1120; }
    .r { fill: currentColor; }
    .p { fill: var(--background, #fff); }
    @media (prefers-color-scheme: dark) {
      svg { color: #f8fafc; }
      .p { fill: var(--background, #0b1120); }
    }
  </style>
  <!-- back flaps -->
  <path d="M7 40 23 32 18 25 2 33Z" fill="#3B82F6"/>
  <path d="M23 32 39 40 44 33 28 25Z" fill="#60A5FA"/>
  <!-- inside -->
  <path d="M7 40 23 32 39 40 23 48Z" fill="#1E3A8A"/>
  <!-- flame, rising out of the opening -->
  <path d="M23 44C26 36 31 29 38 24" fill="none" stroke="#F97316" stroke-width="7" stroke-linecap="round"/>
  <path d="M23 44C26 36 31 29 38 24" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  <!-- front faces -->
  <path d="M7 40 23 48V62L7 54Z" fill="#1D4ED8"/>
  <path d="M23 48 39 40V54L23 62Z" fill="#2563EB"/>
  <!-- front flaps, folded down over the faces -->
  <path d="M7 40 23 48 20 55 4 47Z" fill="#3B82F6"/>
  <path d="M23 48 39 40 42 47 26 55Z" fill="#60A5FA"/>
  <!-- rocket -->
  <g transform="translate(47 15) rotate(45) scale(1.2)">
    <path class="r" d="M-4 5-10 13-3 11Z"/>
    <path class="r" d="M4 5 10 13 3 11Z"/>
    <path class="r" d="M0-15C5-10 5.5 3 4.5 10H-4.5C-5.5 3-5-10 0-15Z"/>
    <circle class="p" cx="0" cy="-4" r="2.6"/>
  </g>
</svg>
